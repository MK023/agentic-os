# La query del pannello "Costo USD per sessione" di docker/grafana/dashboards/claude-code.json,
# messa alla prova sul solo punto in cui puo' rompersi in silenzio: l'unione dei termini.
#
#   promtool test rules scripts/cost-per-session.promql-test.yml
#
# DAL 20-08-2026 GIRA IN CI, col binario della nostra immagine. Fino a quel giorno
# la riga qui sopra era un'istruzione che nessuno eseguiva: il job `compose`
# confrontava le TARIFFE dentro questo file senza mai lanciarlo, quindi una query
# rotta qui sarebbe rimasta rotta in silenzio. Un test che spiega come eseguirsi e
# non viene eseguito e' documentazione — la stessa forma di "un commento non e' un
# gate", applicata a un file che sembrava gia' un controllo.
#
# Quella riga qui sopra e' rimasta un'istruzione non seguita: la #66 ha alzato
# cacheCreation da 1.25x a 2x dell'input in main.py e nella dashboard, e qui le
# tariffe vecchie sono sopravvissute due giorni. Il test passava lo stesso, perche'
# esercita solo opus input/output e haiku cacheRead e quei moltiplicatori non li
# valuta mai. Dal 16-08 il job `compose` confronta queste tariffe con quelle del
# pannello e diventa rosso se divergono: un commento che chiede di ricordarsi non
# e' un gate, ed e' stato dimostrato qui.
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Session A used only opus. Session B used only haiku. No session used
      # every model — which is the normal case, and the case the naive form breaks.
      - series: 'claude_code_token_usage{session_id="A",model="claude-opus-5",type="input"}'
        values: '1000000x5'
      - series: 'claude_code_token_usage{session_id="A",model="claude-opus-5",type="output"}'
        values: '200000x5'
      - series: 'claude_code_token_usage{session_id="B",model="claude-haiku-4-5-20251001",type="cacheRead"}'
        values: '10000000x5'
      # C e D esistono perche' questo file diceva di se' stesso: "esercita solo opus
      # input/output e haiku cacheRead e quei moltiplicatori non li valuta mai".
      # Era vero, ed e' costato: il 2026-08-21 le tariffe di Sonnet sono cambiate e
      # nessuno di questi casi le avrebbe viste sbagliate. C prezza Sonnet, D prezza
      # Opus 4.8 — i due modelli toccati da quel cambio.
      - series: 'claude_code_token_usage{session_id="C",model="claude-sonnet-5",type="input"}'
        values: '1000000x5'
      - series: 'claude_code_token_usage{session_id="C",model="claude-sonnet-5",type="cacheCreation"}'
        values: '500000x5'
      - series: 'claude_code_token_usage{session_id="D",model="claude-opus-4-8",type="output"}'
        values: '400000x5'
      # E prezza `claude-opus-5[1m]`, aggiunta il 2026-08-31 insieme al modello. Non e'
      # un caso in piu' per completezza: e' l'UNICA chiave della tabella in cui
      # scambiare `=` con `=~` non darebbe errore ma darebbe zero in silenzio, perche'
      # sotto `=~` la regex di Prometheus e' ancorata e `[1m]` diventa una CLASSE DI
      # CARATTERI — corrisponderebbe a `claude-opus-51` e `claude-opus-5m`, cioe' a
      # niente di reale. Il pannello usa `=` ed e' corretto; questa serie e' cio' che
      # lo tiene corretto domani.
      - series: 'claude_code_token_usage{session_id="E",model="claude-opus-5[1m]",type="input"}'
        values: '1000000x5'
      - series: 'claude_code_token_usage{session_id="E",model="claude-opus-5[1m]",type="cacheRead"}'
        values: '2000000x5'

    promql_expr_test:
      # The union form: one row per session, sessions with a partial model mix included.
      - expr: |
          sum by (session_id) (
              claude_code_token_usage{model="claude-fable-5",type="input"} * 10
           or claude_code_token_usage{model="claude-fable-5",type="output"} * 50
           or claude_code_token_usage{model="claude-fable-5",type="cacheCreation"} * 20
           or claude_code_token_usage{model="claude-fable-5",type="cacheRead"} * 1
           or claude_code_token_usage{model="claude-opus-5",type="input"} * 5
           or claude_code_token_usage{model="claude-opus-5",type="output"} * 25
           or claude_code_token_usage{model="claude-opus-5",type="cacheCreation"} * 10
           or claude_code_token_usage{model="claude-opus-5",type="cacheRead"} * 0.5
           or claude_code_token_usage{model="claude-opus-5[1m]",type="input"} * 5
           or claude_code_token_usage{model="claude-opus-5[1m]",type="output"} * 25
           or claude_code_token_usage{model="claude-opus-5[1m]",type="cacheCreation"} * 10
           or claude_code_token_usage{model="claude-opus-5[1m]",type="cacheRead"} * 0.5
           or claude_code_token_usage{model="claude-opus-4-8",type="input"} * 5
           or claude_code_token_usage{model="claude-opus-4-8",type="output"} * 25
           or claude_code_token_usage{model="claude-opus-4-8",type="cacheCreation"} * 10
           or claude_code_token_usage{model="claude-opus-4-8",type="cacheRead"} * 0.5
           or claude_code_token_usage{model="claude-sonnet-5",type="input"} * 2
           or claude_code_token_usage{model="claude-sonnet-5",type="output"} * 10
           or claude_code_token_usage{model="claude-sonnet-5",type="cacheCreation"} * 4
           or claude_code_token_usage{model="claude-sonnet-5",type="cacheRead"} * 0.2
           or claude_code_token_usage{model="claude-haiku-4-5-20251001",type="input"} * 1
           or claude_code_token_usage{model="claude-haiku-4-5-20251001",type="output"} * 5
           or claude_code_token_usage{model="claude-haiku-4-5-20251001",type="cacheCreation"} * 2
           or claude_code_token_usage{model="claude-haiku-4-5-20251001",type="cacheRead"} * 0.1
          ) / 1e6
        eval_time: 5m
        exp_samples:
          - labels: '{session_id="A"}'
            value: 1.0e+01
          - labels: '{session_id="B"}'
            value: 1.0e+00
          # C: 1e6 input * 2 + 5e5 cacheCreation * 4 = 4e6 / 1e6 = 4
          - labels: '{session_id="C"}'
            value: 4.0e+00
          # D: 4e5 output * 25 = 1e7 / 1e6 = 10
          - labels: '{session_id="D"}'
            value: 1.0e+01
          # E: 1e6 input * 5 + 2e6 cacheRead * 0.5 = 6e6 / 1e6 = 6
          - labels: '{session_id="E"}'
            value: 6.0e+00

      # The naive form — per-model sums added with `+` — returns NOTHING at all:
      # `+` matches label sets, so a session missing any model drops out entirely.
      - expr: |
          (sum by (session_id) (claude_code_token_usage{model="claude-opus-5",type="input"}) * 5
           + sum by (session_id) (claude_code_token_usage{model="claude-haiku-4-5-20251001",type="cacheRead"}) * 0.1) / 1e6
        eval_time: 5m
        exp_samples: []

  # Le altre due cifre pubbliche. Aggiunte il 20-08-2026, quando questo file ha
  # smesso di essere documentazione: prima non aveva senso scrivere casi che nessuno
  # avrebbe eseguito.
  #
  # Cio' che si pinna qui e' la scelta di `max_over_time` al posto di `increase`, che
  # e' l'errore strutturale gia' commesso e corretto una volta. Claude Code emette UNA
  # SERIE PER SESSIONE, ciascuna un contatore cumulativo del solo processo: nasce,
  # cresce mentre la sessione gira, e resta piatta per sempre dopo. `increase` misura
  # la crescita DENTRO la finestra, quindi su una serie ferma vale zero — e su
  # claude_code_session_count, incrementato esattamente una volta all'avvio, e'
  # zero sempre. Un test sintetico che ri-manda lo stesso session_id con valori
  # crescenti nasconde perfettamente il difetto: e' esattamente cio' che fece il
  # primo test locale.
  - interval: 1m
    input_series:
      # Due sessioni che finiscono in momenti diversi: A si ferma presto e resta
      # piatta, B continua. E' il caso normale, ed e' quello che `increase` sbaglia.
      - series: 'claude_code_session_count{session_id="A"}'
        values: '1 1 1 1 1 1'
      - series: 'claude_code_session_count{session_id="B"}'
        values: '_ _ 1 1 1 1'
      - series: 'claude_code_token_usage{session_id="A",model="claude-opus-5",type="input"}'
        values: '1000 2000 3000 3000 3000 3000'
      - series: 'claude_code_token_usage{session_id="B",model="claude-opus-5",type="input"}'
        values: '_ _ 500 900 1200 1200'

    promql_expr_test:
      # Due sessioni, entrambe contate, anche quella ormai ferma.
      - expr: 'sum(max_over_time(claude_code_session_count[25h]))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 2

      # I token sono la somma dei massimi per sessione: 3000 + 1200. Contare
      # l'ultimo valore invece del massimo darebbe lo stesso numero qui, ma non
      # dopo un riavvio del Collector — il massimo e' cio' che sopravvive.
      - expr: 'sum(max_over_time(claude_code_token_usage[25h]))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 4200

      # La controprova, e la ragione per cui la query e' scritta cosi': con
      # `increase` le sessioni ferme spariscono e il numero pubblico crolla.
      - expr: 'sum(increase(claude_code_session_count[25h]))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0
