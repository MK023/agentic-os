version: 2
updates:
  # Le tre dipendenze Python della status API. requirements.txt è generato da
  # pip-compile --generate-hashes a partire da requirements.in: Dependabot lo
  # riconosce e rigenera il lock con gli hash, quindi gli aggiornamenti arrivano
  # già nella forma che il Dockerfile pretende (--require-hashes).
  - package-ecosystem: "pip"
    directory: "/services/public-status-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Le immagini base sono pinnate a versione, mai :latest — che è una scelta di
  # supply chain, non di riproducibilità. Il prezzo del pin è che invecchia in
  # silenzio: queste voci sono ciò che lo rende rumoroso invece.
  - package-ecosystem: "docker"
    directory: "/railway/otel-collector"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/railway/prometheus"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/railway/grafana"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # MISURATO IL 20-08-2026, non supposto: `grafana/grafana:13.2.0` risolve ZERO
    # delle 13 CVE HIGH di 13.1.4 e ne aggiunge 15, per un totale di 28. Vendora
    # un binario con `stdlib v1.25.7` — piu' VECCHIO dell'1.26.3/1.26.4 di 13.1.4 —
    # piu' x/net v0.51.0, x/text, otel e grpc arretrati, e si riporta dentro
    # CVE-2026-33814, che la triage del 14/08 nominava come la peggiore per EPSS.
    # Stessa trivy 0.70.0 e stessi flag della CI (`--severity HIGH,CRITICAL
    # --ignore-unfixed`), sulle due immagini di Docker Hub.
    #
    # Il job `images` stampa le CVE delle immagini di terzi SENZA fallire (e' voluto:
    # un gate che non puo' diventare verde muore come `continue-on-error`). Quindi
    # questo bump sarebbe arrivato verde, e il conteggio sarebbe passato da 13 a 28
    # senza che niente lo dicesse. Un commento non e' un gate: questa riga lo e'.
    #
    # IGNORATA LA SOLA 13.2.0, non tutta la 13.2.x: se esce una 13.2.1 ricompilata
    # con un Go recente va rimisurata e presa. 13.1.x e' ancora mantenuta (13.1.4 e
    # 13.2.0 sono uscite lo stesso giorno), quindi restare qui non e' restare indietro.
    ignore:
      - dependency-name: "grafana/grafana"
        versions: ["13.2.0"]
  # Aggiunta il 21/08/2026: mancava, e la Fase 1.5 era gia' in produzione da un
  # giorno. Il servizio del log store non avrebbe MAI ricevuto un bump — e il
  # difetto sarebbe arrivato al contrario: Dependabot avrebbe aggiornato il solo
  # compose (voce `/docker`, che pinna la stessa immagine) e il gate "le immagini
  # del compose non divergono dai Dockerfile" avrebbe segnato rosso su una PR
  # automatica, mentre l'immagine di produzione invecchiava.
  - package-ecosystem: "docker"
    directory: "/railway/loki"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/railway/cloudflared"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/services/public-status-api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Anche il compose locale pinna le stesse immagini dei Dockerfile Railway: senza
  # questa voce un bump Dependabot aggiornerebbe solo i Dockerfile e locale e
  # produzione girerebbero immagini diverse in silenzio — esattamente il drift che
  # "una copia di ogni configurazione" esiste per impedire.
  #
  # LA CONSEGUENZA VA SAPUTA PRIMA, non scoperta davanti a una PR rossa. Le due
  # meta' della stessa immagine stanno in due voci, quindi arrivano in DUE PR
  # (storia: #39/#40, #44/#45, #76/#82, #77/#80) — ed e' la forma esatta del guasto
  # del 13/08, dove la seconda PR cancello' il build della prima. Dal gate #95
  # (20/08) ciascuna meta' e' anche ROSSA da sola: il confronto compose/Dockerfile
  # trova la divergenza che la PR ha appena creato.
  # Non e' un difetto del gate: e' il gate che fa il suo mestiere. La procedura e'
  # una sola, e sta scritta qui perche' non ci sia da indovinarla — si prende UNA
  # delle due PR, si porta a mano l'altra meta' nello stesso ramo, e diventa una
  # PR sola che passa. L'altra si chiude. `multi-ecosystem-groups` unirebbe le due
  # voci in una PR sola, ma la sua interazione con `ignore` e `directory` non e'
  # documentata dal fornitore (letto il 21/08/2026) e qui non e' verificabile senza
  # farla girare: una configurazione che sbaglia in silenzio smetterebbe di aprire
  # PR e nessuno se ne accorgerebbe. Assenza dichiarata, non controllo affermato.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Stessa immagine, stesso motivo: senza l'ignore anche qui il bump entrerebbe
    # da meta' — il Dockerfile Railway fermo e il compose avanti, cioe' il drift
    # che questa voce esiste per impedire, al contrario.
    ignore:
      - dependency-name: "grafana/grafana"
        versions: ["13.2.0"]

  # Le action sono pinnate a SHA: senza questa voce resterebbero ferme per sempre,
  # ed è il modo in cui un pin passa da protezione a debito.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
