name: notifica

# Quando un gate di questo repository diventa rosso senza che nessuno stia
# guardando, lo dice su Slack — lo stesso canale degli allarmi di produzione.
#
# Perche' esiste: il 20, il 22 e il 23/08/2026 il workflow `mutation` e' fallito
# di notte, tre volte, e l'unico rilevatore e' stata una persona che il 23
# mattina e' andata a guardare. Gli allarmi della produzione arrivano su Slack dal
# 22/08 e il repository ha dichiarato "chiuso il buco strutturale: accorgersi di
# un guasto non dipende piu' dal fatto che qualcuno decida di andare a leggere".
# Era vero per la produzione e falso per i gate che la sorvegliano — cioe' il
# guasto silenzioso spostato di un piano.
#
# UN SOLO file invece di uno step `if: failure()` in ognuno dei dieci: dieci copie
# della stessa logica divergono, ed e' esattamente il difetto che questo
# repository si e' gia' fatto due volte (la seconda lista accanto a
# `source_paths`, il pin copiato dentro le prove). `workflow_run` guarda gli altri
# da fuori e non chiede niente a loro.
#
# La lista dei workflow e' esplicita perche' `workflow_run` non accetta jolly, ed
# e' per costruzione una SECONDA lista accanto ai dieci file. Quindi un gate in
# lint.yml (`workflow-lint`) pretende che le due coincidano: un workflow nuovo che
# non finisce qui dentro fa rosso subito, invece di tacere la notte che serve.
#
# Cosa NON copre, dichiarato invece che scoperto: un cron che non parte affatto.
# `workflow_run` scatta quando un run FINISCE, quindi uno schedule morto — GitHub
# che disabilita i cron su un repository fermo da 60 giorni, un file che smette di
# stare sul ramo di default — resta invisibile qui. Servirebbe un dead man's
# switch, che e' un'altra cosa e va deciso a parte.
#
# zizmor marca `workflow_run` HIGH (`dangerous-triggers`), e va argomentato invece
# che spento: un'eccezione silenziosa e' `continue-on-error` con altre parole.
# Cio' che rende `workflow_run` la trappola che zizmor descrive e' la COMBINAZIONE
# — gira sul ramo di default, con i segreti, svegliato da codice che puo' venire da
# un fork — con un `actions/checkout` del commit di quel fork e un token che sa
# scrivere. Allora il codice di chiunque gira con le nostre credenziali.
# Qui mancano entrambe le meta': nessun checkout, nessun artefatto scaricato,
# `permissions: {}` in cima E sul job, e l'unico dato che arriva da fuori (il nome
# del ramo) entra da `env` e passa a `jq --arg`, quindi resta un dato — provato in
# locale con un ramo chiamato `main"; rm -rf /  $(id)`, che e' arrivato su Slack
# come testo e non come comando.
# La riga sotto spegne l'audit; il gate `notifica.yml resta la forma sicura di
# workflow_run` in lint.yml pretende che quelle proprieta' siano ancora vere. Una
# promessa scritta e una sorvegliata sembrano uguali sulla pagina.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - codeql
      - immagini
      - lint
      - mutation
      - sicurezza
      - smoke
      - sonar
      - sorveglianza
      - telemetry-baseline
      - test
    types: [completed]

# Deny by default. Questo job non tocca il repository: non fa checkout, non legge
# codice, manda un POST. Il token che riceve non gli serve per niente, e con la
# mappa vuota non ne ha nemmeno uno utile — cosa che conta piu' del solito qui,
# perche' `workflow_run` gira sul ramo di default CON i segreti anche quando il
# run che lo ha svegliato veniva da una PR di un fork.
permissions: {}

concurrency:
  # Un gruppo per run osservato: due notifiche per lo stesso guasto non aggiungono
  # niente, e `cancel-in-progress: false` perche' guasti diversi devono parlare
  # tutti, non solo l'ultimo.
  group: notifica-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  slack:
    # Solo i rossi che nessuno sta guardando. Un fallimento su `pull_request` e'
    # gia' scritto in faccia a chi ha aperto la PR, e notificarlo trasformerebbe
    # il canale in rumore — un canale che si impara a ignorare e' peggio di
    # nessun canale. Restano dentro `schedule` (nessuno guarda), `push` su main
    # (il rosso e' gia' spedito) e `workflow_dispatch`: quest'ultimo e' anche
    # l'unico modo di PROVARE che questa catena funziona senza aspettare un
    # guasto vero.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: dillo su Slack
        env:
          # Nessuna espressione ${{ }} dentro `run:`, come in ogni altro workflow
          # qui: i valori entrano da `env`, quindi un nome di ramo con dentro dei
          # metacaratteri resta un dato e non diventa codice.
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOME: ${{ github.event.workflow_run.name }}
          EVENTO: ${{ github.event.workflow_run.event }}
          RAMO: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # Rosso e non `skip` se manca il segreto: in questo repository un gate
          # senza credenziale resta rosso, perche' uno saltato si legge verde. E
          # qui il costo di leggerlo verde e' il silenzio che questo file esiste
          # per rompere.
          if [ -z "${WEBHOOK:-}" ]; then
            echo "FAIL: manca il secret SLACK_WEBHOOK_URL." >&2
            echo "Senza, questo workflow non notifica NIENTE e ogni cron rosso torna silenzioso." >&2
            exit 1
          fi

          testo="🔴 ${NOME} è rosso (${EVENTO} su ${RAMO}) — ${URL}"
          # jq costruisce il JSON: il testo contiene un URL e un nome di ramo, e
          # un `printf` con le virgolette a mano si rompe sul primo carattere da
          # sfuggire, mandando un 400 che sembra un webhook scaduto.
          corpo=$(jq -n --arg t "${testo}" '{text: $t}')

          codice=$(curl -sS --max-time 20 -o /tmp/risposta -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' \
            --data "${corpo}" "${WEBHOOK}")
          echo "Slack ha risposto ${codice}: $(cat /tmp/risposta)"

          # L'esito del POST e' l'unica meta' che questo job puo' provare da solo.
          # Che poi il messaggio compaia nel canale vive sul server di Slack, ed e'
          # la stessa divisione del lavoro gia' scritta in DECISIONS.md per gli
          # allarmi di Grafana.
          [ "${codice}" = "200" ]
