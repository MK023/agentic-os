name: lint

# Diviso da validate.yml il 13-08-2026, che era arrivato a 13 job di mestieri
# diversi. **I nomi dei job non sono cambiati**, ed e' la cosa importante: i
# dodici check obbligatori del ruleset `main protetta` (id 19979456) SONO i nomi
# dei job. Rinominarne uno durante la divisione avrebbe lasciato il ruleset ad
# aspettare per sempre un contesto che nessuno produce piu'.
#
# Analisi statica di cio' che scriviamo noi: ruff e bandit sul Python,
# zizmor sui workflow. Due linguaggi, stesso mestiere.
#
# Nessun filtro `paths`, di proposito: un check obbligatorio che non parte per un
# filtro lascia la PR in attesa per sempre invece di passare. Si puo' aggiungere,
# ma serve un job "skip" che riporti successo, ed e' un pezzo di macchinario in
# piu' per risparmiare qualche minuto di runner gratuito.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di
# workflow lo regala anche ai job che il repository non lo leggono mai; con la
# mappa vuota ogni permesso qui sotto e' una riga che qualcuno ha dovuto
# scrivere apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE. Con il gruppo condiviso di prima, un push avrebbe
  # cancellato i run degli altri quattro workflow, e un check obbligatorio
  # cancellato non e' ne' rosso ne' verde: resta appeso.
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Nessuno step `run:` interpola espressioni ${{ }}: le uniche sono in `if:` e
# in mappe `env:`, quindi non c'e' superficie di template injection. Lo impone
# zizmor, nel job workflow-lint (lint.yml).
jobs:
  # Fino al 13/08/2026 questa pipeline aveva dodici gate e nessun linter Python.
  # Non era un problema teorico: al primo lancio ruff ha trovato uno `zip()` senza
  # `strict=` proprio dove si costruiscono i tre numeri pubblici — se le chiavi e i
  # risultati divergessero, l'endpoint risponderebbe 200 con un valore accoppiato
  # alla query sbagliata. Stessa famiglia del `result[0]` che leggeva un gruppo su N.
  #
  # `S` (flake8-bandit) è dentro ruff, quindi bandit gira sotto in gran parte in
  # sovrapposizione: misurato il 13/08, l'unico rilievo di bandit era lo stesso
  # `B110` che ruff segnala come `S110`. Resta perché il suo catalogo si muove
  # separatamente, non perché oggi aggiunga segnale.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Pinnati come ogni altra cosa qui: un linter che cambia versione da solo
      # trasforma un gate in un generatore casuale di build rosse.
      # Hash-locked come le dipendenze di produzione. Prima erano pinnate al solo
      # primo livello, e il commento qui affermava che bastasse: non bastava. Senza
      # hash e senza --only-binary la chiusura transitiva si risolve a runtime e una
      # sdist esegue il proprio setup.py sul runner — cioe' dove sono atterrati gli
      # incidenti PyPI. Erano gli strumenti che verificano tutto il resto a essere
      # l'unico anello non bloccato. Modificare requirements-dev.in, mai il .txt.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements-dev.txt"
      - run: ruff check .
      - run: ruff format --check .
      # -x sui test: gli assert sono il modo in cui i test si scrivono. La cartella
      # mutants/ è generata da mutmut e non è codice sorgente.
      - run: bandit -q -r services/public-status-api -x '**/test_*.py,**/mutants/**'

  # Pipeline-as-attack-surface: zizmor is SAST for
  # the workflows themselves — template injection, dangerous triggers, overly
  # broad permissions. Blocks on HIGH, pinned version — a linter that changes its
  # own rules silently is a non-deterministic gate.
  workflow-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Stesso interprete del lock. requirements-dev.txt e' compilato per 3.14 e
      # contiene estensioni compilate (setproctitle, libcst): finora questo job era
      # l'unico a installarlo senza fissare la versione, quindi girava sul default
      # del runner. Funzionava perche' --generate-hashes raccoglie gli hash di tutte
      # le piattaforme, non perche' qualcosa lo verificasse.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: zizmor sui workflow (blocca su HIGH)
        run: |
          pip install --quiet --require-hashes --only-binary=:all: -r services/public-status-api/requirements-dev.txt
          zizmor --min-severity=high .github/workflows/

      # DOPO zizmor, non prima: questo controllo usa PyYAML, che arriva con
      # requirements-dev.txt installato nello step qui sopra. Messo prima falliva con
      # ModuleNotFoundError — un gate che non parte non e' un gate, ed e' la stessa
      # famiglia del pavimento su mutmut.
      #
      # Uno step duplicato in un job e' invisibile a tutto il resto: il YAML e'
      # valido, actionlint e zizmor non se ne occupano, ed entrambe le copie passano,
      # quindi la CI resta verde. E' successo il 19-08-2026 riscrivendo due gate: le
      # copie VECCHIE sono rimaste accanto alle nuove, una delle due non conosceva i
      # riferimenti @sha256 e confrontava il nulla. Quattro audit indipendenti l'hanno
      # vista; nessun gate. Ora c'e'.
      - name: nessuno step duplicato dentro lo stesso job
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, glob, sys, yaml

          problemi = []
          # `.yaml` anche qui. L'asimmetria era gia' stata trovata e chiusa sul gate
          # dei curl lo stesso giorno, e lasciata aperta in QUESTO step, che sta
          # quindici righe sopra: si era corretta la forma segnalata invece della
          # classe. Con la sola `*.yml`, un workflow con l'altra estensione e due step
          # omonimi — cioe' l'incidente del 19-08-2026 descritto qui sopra — passava
          # verde.
          for percorso in sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          ):
              workflow = yaml.safe_load(open(percorso))
              for nome_job, job in (workflow.get("jobs") or {}).items():
                  nomi = [s.get("name") for s in job.get("steps", []) if s.get("name")]
                  for nome, quante in collections.Counter(nomi).items():
                      if quante > 1:
                          problemi.append(f"{percorso}: il job '{nome_job}' ha {quante} step chiamati {nome!r}")

          if problemi:
              print("::error::uno step duplicato passa due volte e resta verde: se una delle "
                    "copie e' una versione vecchia, il job verifica due cose diverse e nessuno "
                    "se ne accorge.")
              for problema in problemi:
                  print(f"::error::{problema}")
              sys.exit(1)
          print("nessuno step duplicato")
          PY


      # La lista dentro notifica.yml e' una SECONDA lista accanto ai file dei
      # workflow, e `workflow_run` non accetta jolly: o le due coincidono, o esiste
      # un gate che quando fallisce di notte non lo dice a nessuno — cioe' il
      # silenzio che notifica.yml e' nato per rompere, riaperto dal file che qualcuno
      # aggiungera' fra sei mesi. Questo repository ha gia' pagato due volte per una
      # seconda lista divergente (`source_paths` in mutation.yml, il pin del
      # Collector copiato dentro le prove): la terza la vede un gate.
      #
      # Con due pavimenti, perche' un confronto fra insiemi vuoti e' verde: se il
      # glob non trova niente o notifica.yml sparisce, questo step deve gridare, non
      # passare.
      - name: notifica.yml sorveglia tutti i workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, sys, yaml

          NOTIFICATORE = ".github/workflows/notifica.yml"
          if not pathlib.Path(NOTIFICATORE).exists():
              print(f"::error::{NOTIFICATORE} non esiste: nessun cron rosso viene notificato.")
              sys.exit(1)

          # `on:` in YAML si legge come il booleano True, non come la stringa "on".
          notificatore = yaml.safe_load(open(NOTIFICATORE))
          trigger = notificatore.get(True, notificatore.get("on"))
          sorvegliati = set(trigger["workflow_run"]["workflows"])

          # `.yaml` oltre a `.yml`: GitHub accetta entrambe le estensioni, e un
          # workflow chiamato `.yaml` attraversava questo gate senza essere
          # sorvegliato da nessuno — misurato il 23/08/2026 creandone uno e
          # vedendolo passare verde.
          dichiarati = {}
          for percorso in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              if percorso == NOTIFICATORE:
                  continue
              nome = yaml.safe_load(open(percorso)).get("name")
              if not nome:
                  print(f"::error::{percorso} non dichiara `name:`, quindi notifica.yml non puo\' nominarlo.")
                  sys.exit(1)
              dichiarati[nome] = percorso

          if len(dichiarati) < 5:
              print(f"::error::trovati solo {len(dichiarati)} workflow: questo confronto non ha girato davvero.")
              sys.exit(1)

          scoperti = sorted(set(dichiarati) - sorvegliati)
          fantasmi = sorted(sorvegliati - set(dichiarati))
          if scoperti or fantasmi:
              for nome in scoperti:
                  print(f"::error::'{nome}' ({dichiarati[nome]}) non e\' in notifica.yml: se fallisce di notte, nessuno lo sa.")
              for nome in fantasmi:
                  print(f"::error::notifica.yml sorveglia '{nome}', che non esiste piu\': la riga non fa niente e sembra copertura.")
              sys.exit(1)
          print(f"notifica.yml sorveglia tutti i {len(dichiarati)} workflow")
          PY

      - name: notifica.yml resta la forma sicura di workflow_run
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml

          # L'oracolo vive QUI, non nel file sotto esame: la condizione attesa e'
          # scritta per intero in questo gate, non dedotta da quella trovata. La prima
          # stesura cercava la sottostringa "pull_request" dentro l'`if` e accettava
          # verde la condizione INVERTITA — notificare SOLO le PR e mai un cron
          # notturno, l'esatto contrario del motivo per cui notifica.yml esiste.
          # Trovata da una revisione avversaria il 23/08/2026 e riprodotta prima di
          # correggerla.
          ATTESA = (
              "contains(fromJSON('[\"failure\",\"cancelled\",\"timed_out\",\"startup_failure\"]'), "
              "github.event.workflow_run.conclusion) && "
              "contains(fromJSON('[\"schedule\",\"push\",\"workflow_dispatch\"]'), "
              "github.event.workflow_run.event)"
          )

          NOTIFICATORE = ".github/workflows/notifica.yml"
          workflow = yaml.safe_load(open(NOTIFICATORE))
          trigger = workflow.get(True, workflow.get("on"))
          problemi = []

          # Se un giorno non fosse piu' workflow_run, l'ignore di zizmor non servirebbe
          # piu' e nemmeno questo gate: che sia ancora quello e' la premessa di tutto.
          if "workflow_run" not in trigger:
              problemi.append("non e' piu' un workflow_run: togli anche l'ignore di zizmor e questo gate.")

          if workflow.get("permissions") != {}:
              problemi.append("`permissions` di workflow non e' piu' la mappa vuota.")

          jobs = workflow.get("jobs") or {}
          # Un job solo, e si chiama slack. Non e' rigidita' fine a se stessa: ogni job
          # in piu' qui dentro gira sul ramo di default con i segreti del repository.
          if set(jobs) != {"slack"}:
              problemi.append(f"i job non sono piu' esattamente {{'slack'}} ma {sorted(jobs)}.")

          for nome_job, job in jobs.items():
              if job.get("permissions") != {}:
                  problemi.append(f"il job '{nome_job}' non ha piu' `permissions: {{}}`.")

              # Il cuore dell'argomento: senza codice di terzi non c'e' niente da
              # eseguire con i nostri segreti. TRE modi di introdurne, non uno: uno
              # step con `uses:`, il JOB con `uses:` (una reusable workflow, che con
              # `secrets: inherit` riceve ogni segreto e non ha `steps` da ispezionare)
              # e `container:`/`services:`, che avviano un'immagine di qualcun altro con
              # l'ambiente del job dentro. La prima stesura guardava solo il primo,
              # mentre il suo messaggio d'errore dichiarava di guardarli tutti: un
              # controllo affermato che non esiste, dentro il gate scritto per impedire
              # esattamente quello.
              if "uses" in job:
                  problemi.append(f"il job '{nome_job}' E' una reusable workflow (`{job['uses']}`): con `secrets: inherit` riceve tutti i segreti.")
              for chiave in ("container", "services"):
                  if chiave in job:
                      problemi.append(f"il job '{nome_job}' dichiara `{chiave}:`: e' un'immagine di terzi con l'ambiente del job dentro.")
              for passo in job.get("steps", []):
                  if "uses" in passo:
                      problemi.append(f"il job '{nome_job}' usa `{passo['uses']}`: qui dentro non gira codice di nessun altro.")

              condizione = " ".join(str(job.get("if", "")).split())
              if condizione != ATTESA:
                  problemi.append(f"la condizione del job '{nome_job}' non e' piu' quella attesa.")
                  problemi.append(f"  attesa:  {ATTESA}")
                  problemi.append(f"  trovata: {condizione or '(nessuna)'}")

          if problemi:
              print("::error::notifica.yml non e' piu' la forma sicura di workflow_run, ma "
                    "l'audit di zizmor e' ancora zittito dal suo `ignore`.")
              for problema in problemi:
                  print(f"::error::{problema}")
              sys.exit(1)
          print("notifica.yml: un job solo, nessun codice di terzi (uses/container/services), "
                "permessi vuoti sopra e sul job, condizione identica a quella attesa")
          PY

      # Due invarianti nate il 23/08/2026 e sorvegliate dallo stesso giorno, perche'
      # una convenzione che vive solo in un file di piano e' un desiderio: il README
      # di questo repository lo dice con parole sue — "a contract written in a README
      # that no gate checks is a wish".
      #
      # E il secondo controllo esiste perche' il primo tentativo di verificarlo a mano
      # era CIECO da entrambi i lati: `grep -rn ... | grep -v '^\s*#'` non puo' mai
      # escludere un commento (grep antepone `file:riga:`), e contando per riga fisica
      # non vedeva ne' i tre `--max-time` finiti in doppio ne' le invocazioni spezzate
      # su piu' righe. Qui le continuazioni si uniscono prima di contare.
      - name: ogni job dichiara il proprio tetto, ogni curl i suoi due
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml

          problemi = []

          job_visti = 0
          for percorso in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              for nome, corpo in (yaml.safe_load(open(percorso)).get("jobs") or {}).items():
                  job_visti += 1
                  # Un job che chiama una reusable workflow (`jobs.<id>.uses:`) NON
                  # PUO' dichiarare `timeout-minutes`: il fornitore non ammette la
                  # chiave su quel tipo di job (le ammesse sono name, uses, with,
                  # secrets, strategy, needs, if, concurrency, permissions). Senza
                  # questa riga il primo che ne scrive uno prende una CI rossa che non
                  # ha modo di spegnere, e l'unica uscita e' disattivare il gate: un
                  # controllo rosso su cio' su cui non puoi agire diventa un
                  # `continue-on-error` con passi in piu'. Il tetto di quel job vive
                  # dentro il workflow chiamato: se e' locale (`./.github/...`) questo
                  # stesso ciclo lo sorveglia, se e' REMOTO (`org/repo/.github/...@sha`)
                  # non lo legge nessuno da qui. Oggi non ce ne sono; il giorno che ne
                  # arriva uno, quel tetto e' fuori dalla portata di questo gate e va
                  # detto invece che presunto.
                  if "uses" in (corpo or {}):
                      continue
                  if "timeout-minutes" not in (corpo or {}):
                      problemi.append(
                          f"{percorso}: il job '{nome}' non dichiara `timeout-minutes`: "
                          "eredita il default di 360 minuti, e un job che si appende "
                          "esce `cancelled` dopo sei ore."
                      )
          if job_visti < 15:
              problemi.append(f"trovati solo {job_visti} job: questo controllo non ha girato davvero.")

          # `curl` in POSIZIONE DI COMANDO, non la parola `curl` ovunque: senza questo
          # il gate matchava il proprio codice sorgente ed e' nato rosso sulla realta'.
          #
          # `run:` E' ANCORATO A INIZIO RIGA. Non lo era, e la correzione che aggiunse
          # quell'alternativa risolse il caso `- run: curl ...` allargandola a
          # QUALUNQUE testo contenente "run: curl": un esempio dentro un heredoc, una
          # riga di README generata, un `echo` che spiega come si scrive una sonda
          # facevano fallire la CI con errori inventati. Si era aggiunta una forma
          # invece di scrivere la regola. Ancorata, `-\s+run:\s*` diventa superflua:
          # `-?` la copre.
          #
          # IL TETTO DI QUESTO GATE, dichiarato invece che scoperto dal prossimo che
          # ci sbatte: riconosce `curl` invocato direttamente, in tutte le posizioni
          # di comando della shell e dietro i wrapper elencati, con i loro argomenti.
          # NON vede `curl` dentro un interprete che lo lancia per conto suo
          # (`bash -c "curl ..."`, `docker exec c curl ...`), ne' un eseguibile
          # nascosto in una variabile (`$CURL ...`), ne' un wrapper con piu' di tre
          # argomenti davanti. E' un lint sul nostro stile, non una barriera contro chi
          # voglia aggirarlo: chi scrive `bash -c` sta scegliendo di non essere
          # sorvegliato. Allargare l'elenco una forma per volta e' la mossa che qui e'
          # gia' costata quattro regressioni — se il buco diventa reale, si cambia
          # strada (parsare la riga con `shlex`), non si allunga la lista.
          CURL = re.compile(
              r"(?:^|[|;&`!({]|\$\(|&&|\|\||^\s*-?\s*run:\s*)\s*"
              # Un wrapper porta i PROPRI argomenti prima del comando che avvolge:
              # `timeout 10 curl`, `xargs -I{} curl`, `sudo -u ci curl`,
              # `env -u HTTP_PROXY curl`. La grammatica sapeva saltare il NOME del
              # wrapper e non i suoi argomenti, quindi meta' dell'elenco non
              # funzionava — e quattro di quelle forme sono nel banco di
              # `gate-linkedin.py` fra quelle da bloccare, cioe' sono forme che qui si
              # scrivono davvero. Fino a tre token, e nessuno puo' contenere una
              # virgoletta o un delimitatore: sono argomenti, non un altro comando.
              r"(?:(?:sudo|command|exec|eval|nohup|nice|time|timeout|xargs|env"
              r"|if|while|until|elif|then|do|else|not)\s+(?:[^\s'\"|;&()]+\s+){0,3}"
              r"|\S+=\S+\s+)*"
              r"(?:[\w./~$-]*/)?curl\s"
          )
          # Dove FINISCE un'invocazione: al primo separatore di comando. Serve perche'
          # i flag vanno attribuiti al curl a cui appartengono — vedi sotto.
          SEPARATORE = re.compile(r"&&|\|\||[|;&`]")
          # `-m` e' la forma breve documentata (`man curl`: "-m, --max-time"), e in una
          # shell i flag corti si raggruppano (`curl -sSm 30`) e si attaccano al valore
          # (`-m30`). Cercare la sottostringa `--max-time` bocciava tutte e tre;
          # cercare `-m` isolato ne bocciava due su tre. Il lookbehind tiene fuori la
          # `-m` che sta DENTRO `--max-time`.
          TETTO = re.compile(r"(?<![\w-])--max-time(?=[= ])|(?<![\w-])-[A-Za-z]*m(?=[ =]|\d)")
          CONNESSIONE = re.compile(r"(?<![\w-])--connect-timeout(?=[= ])")

          curl_visti = 0
          # `.yaml` anche qui: il ciclo sui job lo guardava e questo no — un workflow
          # con l'altra estensione avrebbe avuto i job sorvegliati e i curl no.
          # Asimmetria nata con il gate, trovata rileggendolo lo stesso giorno.
          for percorso in sorted(
              glob.glob("scripts/*.sh")
              + glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          ):
              # le continuazioni di riga si uniscono PRIMA di contare: un flag sulla
              # riga successiva appartiene alla stessa invocazione.
              unito = re.sub(r"\\\n\s*", " ", open(percorso).read())
              for riga in unito.splitlines():
                  nudo = riga.strip()
                  if nudo.startswith("#"):
                      continue
                  breve = nudo[:70]
                  # Ogni invocazione si guarda da sola, e i suoi flag sono quelli che
                  # stanno fra il suo `curl` e il primo separatore di comando.
                  #
                  # Contarli sulla RIGA INTERA era sbagliato in tutti e due i versi, e
                  # non in teoria: `curl --connect-timeout 5 https://x && git commit -m
                  # "fatto"` passava VERDE, perche' il `-m` di git faceva da alibi a un
                  # curl senza tetto — cioe' il gate cieco sull'unica cosa che
                  # sorveglia; e `curl ... --max-time 30 ... | python3 -m json.tool`
                  # diventava ROSSO su codice corretto, con `python -m` gia' in uso in
                  # `scripts/check-python-versions.sh`. Un'opzione senza il comando a
                  # cui appartiene e' ancora una stringa: la correzione precedente
                  # aveva cambiato COSA si cerca e non A CHI appartiene.
                  # Il confine e' il primo separatore MA ANCHE il curl successivo: fra
                  # `$(curl A)` e `$(curl B)` non c'e' nessun `;` o `|`, e senza questo
                  # limite i flag del secondo venivano contati anche al primo.
                  inizi = [m.start() for m in CURL.finditer(riga)] + [len(riga)]
                  for indice, invocazione in enumerate(CURL.finditer(riga)):
                      curl_visti += 1
                      limite = inizi[indice + 1]
                      fine = SEPARATORE.search(riga, invocazione.end(), limite)
                      segmento = riga[invocazione.end():fine.start() if fine else limite]
                      tetti = len(TETTO.findall(segmento))
                      connessioni = len(CONNESSIONE.findall(segmento))
                      if tetti != 1:
                          problemi.append(f"{percorso}: {tetti} `--max-time` su questo curl — se sono due vince l'ultimo: {breve}")
                      if connessioni != 1:
                          problemi.append(f"{percorso}: {connessioni} `--connect-timeout` su questo curl: {breve}")
          if curl_visti < 20:
              problemi.append(f"trovate solo {curl_visti} invocazioni di curl: questo controllo non ha girato davvero.")

          if problemi:
              print("::error::una chiamata senza tetto si appende, e un job senza tetto "
                    "muore dopo sei ore con conclusione `cancelled`.")
              for p in problemi:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"{job_visti} job con timeout-minutes, {curl_visti} curl con entrambi i tetti")
          PY

      # I due gate qui sopra sono nati rotti due volte in un giorno, ed entrambe le
      # volte erano stati dichiarati "provati rossi" a mano, in una shell che non
      # esiste piu'. I loro pavimenti (`< 15 job`, `< 20 curl`) non li sostituiscono:
      # contano un TOTALE, e la maggioranza dei curl sta in `scripts/`, quindi un regex
      # che smettesse di vedere tutti quelli dei workflow resterebbe sopra il pavimento
      # e verde. Questo banco estrae i due gate da QUESTO file — nessuna seconda copia
      # — li esercita su venti casi, e poi li MUTA pretendendo che il caso
      # corrispondente cambi colore: un caso che resta verde anche senza il controllo
      # che dovrebbe esercitare non prova niente.
      - name: il banco dei due gate qui sopra
        run: python3 scripts/prova-gate-workflow.py
