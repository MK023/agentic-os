name: test

# Diviso da validate.yml il 13-08-2026, che era arrivato a 13 job di mestieri
# diversi. **I nomi dei job non sono cambiati**, ed e' la cosa importante: i
# dodici check obbligatori del ruleset `main protetta` (id 19979456) SONO i nomi
# dei job. Rinominarne uno durante la divisione avrebbe lasciato il ruleset ad
# aspettare per sempre un contesto che nessuno produce piu'.
#
# I test del servizio, e il gate che garantisce che girino sull'interprete
# della produzione. Stanno insieme perche' il secondo esiste solo per dare
# un senso al primo: verde su un Python che nessuno esegue non prova nulla.
#
# Nessun filtro `paths`, di proposito: un check obbligatorio che non parte per un
# filtro lascia la PR in attesa per sempre invece di passare. Si puo' aggiungere,
# ma serve un job "skip" che riporti successo, ed e' un pezzo di macchinario in
# piu' per risparmiare qualche minuto di runner gratuito.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di
# workflow lo regala anche ai job che il repository non lo leggono mai; con la
# mappa vuota ogni permesso qui sotto e' una riga che qualcuno ha dovuto
# scrivere apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE. Con il gruppo condiviso di prima, un push avrebbe
  # cancellato i run degli altri quattro workflow, e un check obbligatorio
  # cancellato non e' ne' rosso ne' verde: resta appeso.
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Nessuno step `run:` interpola espressioni ${{ }}: le uniche sono in `if:` e
# in mappe `env:`, quindi non c'e' superficie di template injection. Lo impone
# zizmor, nel job workflow-lint (lint.yml).
jobs:
  status-api-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Must track the minor in services/public-status-api/Dockerfile — the
      # python-versions job below fails the build when they drift. Drift is silent
      # otherwise: every job here stays green while testing a runtime production
      # does not have, because the image build proves only that the hash-locked
      # wheels install, never that one test ran on that interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Two commands, not one: requirements.txt carries hashes, and pip switches the
      # WHOLE command into hash-checking mode as soon as one requirement has them —
      # the unhashed test tools would fail the install.
      # Quoted: an unquoted ":all: " would make YAML read a mapping mid-command.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt"
      # Pinnate come tutto il resto della pipeline: erano l'unico install non
      # deterministico rimasto (le dipendenze di prodotto sono hash-locked).
      #
      # `httpx2` sta QUI e non in requirements.in perche' e' una dipendenza di
      # TEST, non di produzione. Starlette 1.3.1 importa `httpx2 as httpx` se lo
      # trova e ricade su `httpx` con uno StarletteDeprecationWarning se non c'e'
      # (letto nel suo testclient.py, non dedotto). Installarlo qui spegne il
      # warning senza toccare `httpx==0.28.1`, che e' quello con cui il servizio
      # parla davvero a Prometheus. respx continua a moccare httpx: sono due
      # strade separate, il TestClient entra nell'app e main.py esce verso l'hub.
      - run: pip install httpx2==2.10.0 respx==0.23.1 pytest==9.1.1 pytest-cov==7.1.0
      - run: pytest services/public-status-api/test_main.py -v --cov=services/public-status-api --cov-report=xml:services/public-status-api/coverage.xml --cov-fail-under=100

  # La versione di Python è scritta in sei posti — cinque pin nei workflow, il
  # FROM del Dockerfile e `sonar.python.version` — e setup-python non sa leggere
  # un Dockerfile né SonarCloud un workflow. La
  # duplicazione non si elimina, si sorveglia: questo job fallisce quando i due
  # numeri divergono, cioè quando la CI proverebbe un interprete che la
  # produzione non ha. Verde senza questo gate voleva dire solo che le wheel si
  # installavano; nessun test aveva mai eseguito su quel Python.
  python-versions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: bash scripts/check-python-versions.sh
