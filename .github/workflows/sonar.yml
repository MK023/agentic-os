name: sonar

# Diviso da validate.yml il 13-08-2026, che era arrivato a 13 job di mestieri
# diversi. **I nomi dei job non sono cambiati**, ed e' la cosa importante: i
# dodici check obbligatori del ruleset `main protetta` (id 19979456) SONO i nomi
# dei job. Rinominarne uno durante la divisione avrebbe lasciato il ruleset ad
# aspettare per sempre un contesto che nessuno produce piu'.
#
# SonarCloud, da solo perche' e' l'unico job che tocca un servizio esterno
# e l'unico che ha bisogno di un segreto.
#
# Nessun filtro `paths`, di proposito: un check obbligatorio che non parte per un
# filtro lascia la PR in attesa per sempre invece di passare. Si puo' aggiungere,
# ma serve un job "skip" che riporti successo, ed e' un pezzo di macchinario in
# piu' per risparmiare qualche minuto di runner gratuito.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di
# workflow lo regala anche ai job che il repository non lo leggono mai; con la
# mappa vuota ogni permesso qui sotto e' una riga che qualcuno ha dovuto
# scrivere apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE. Con il gruppo condiviso di prima, un push avrebbe
  # cancellato i run degli altri quattro workflow, e un check obbligatorio
  # cancellato non e' ne' rosso ne' verde: resta appeso.
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

# Nessuno step `run:` interpola espressioni ${{ }}: le uniche sono in `if:` e
# in mappe `env:`, quindi non c'e' superficie di template injection. Lo impone
# zizmor, nel job workflow-lint (lint.yml).
jobs:
  # Runs on pushes to main as well as on PRs. PR-only was a real gap: SonarQube
  # Cloud had never analysed the main branch at all (`measures: []`), so the project
  # had no baseline, no quality-gate history, and nothing for "new code" to be new
  # *against* — the Clean-as-You-Code model needs the main branch analysed to mean
  # anything.
  # Still excluded for Dependabot PRs: GitHub does not pass repository secrets to
  # them, so SONAR_TOKEN arrives empty and the scan dies with "Not authorized" on
  # every dependency bump — a gate that structurally cannot pass there, not a
  # weakened one. On a push event `github.event.pull_request` is null, so the first
  # clause short-circuits and the job runs.
  sonar:
    permissions:
      contents: read
    # Due esclusioni, entrambe per la stessa ragione: i secret non raggiungono
    # queste PR, quindi il job resterebbe rosso per sempre bloccando ogni merge.
    # I fork non sono un caso teorico: questo repository e' pubblico.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # UN SOLO comando con entrambi i file, non due in fila. `-c requirements.txt`
      # nel .in vincola la COMPILAZIONE, non l'installazione: con due install
      # sequenziali, il giorno che Dependabot alza una dipendenza CONDIVISA nel lock
      # di produzione senza che requirements-dev.txt venga ricompilato nello stesso
      # PR, il secondo comando la riporterebbe indietro in silenzio e con exit 0 — i
      # test girerebbero contro un albero che la produzione non ha, cioe' esattamente
      # cio' che il vincolo doveva impedire. Con un comando solo e' pip a risolverli
      # insieme e a fallire sul conflitto: il gate e' pip, non un commento.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt -r services/public-status-api/requirements-dev.txt"
      - run: pytest services/public-status-api/test_main.py -v --cov=services/public-status-api --cov-report=xml:services/public-status-api/coverage.xml --cov-fail-under=100
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
