name: mutation

# Nightly, not per-PR: a full mutation run takes minutes, and what it guards (the
# only authorization comparison in the project) changes rarely.
# No ${{ }} expression is interpolated into any `run:` step here — no
# template-injection surface.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Allineato a validate.yml, dove la #53 lo ha messo su ogni checkout e
          # questo file era rimasto fuori. Nessun push dalla CI: lasciare il token
          # in .git/config allarga solo il raggio di un eventuale compromesso di
          # uno step successivo — e qui gli step successivi eseguono mutanti del
          # nostro stesso codice.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Split: requirements.txt is hash-locked, and pip applies hash-checking to the
      # whole command as soon as one requirement carries hashes.
      # Quoted: an unquoted ":all: " would make YAML read a mapping mid-command.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt"
      - run: pip install httpx2==2.10.0 respx==0.23.1 pytest==9.1.1 mutmut==3.6.0
      # Lo scope bloccante era `require_valid_token` e basta — spec §6.2. Coverage
      # dice che una riga è stata eseguita; solo questo dice che un'asserzione si
      # sarebbe accorta se cambiava.
      #
      # Dal 13/08 comprende anche il **percorso del costo**. La PR #32 ci aveva
      # ucciso 19 survivor, ma quel percorso non stava nel gate: la pulizia poteva
      # marcire senza che niente se ne accorgesse, ed è il numero pubblico che è
      # già stato sbagliato una volta di 2,8x. Un test scritto una volta e non
      # sorvegliato è una fotografia, non un vincolo.
      #
      # I survivor di sentry.py restano deliberatamente NON bloccanti: asserire il
      # formato esatto sul filo di un reporter fail-open congelerebbe un dettaglio
      # che appartiene a Sentry, non a noi.
      - name: mutmut sulle funzioni bloccanti (autorizzazione + percorso del costo)
        working-directory: services/public-status-api
        env:
          FUNZIONI_BLOCCANTI: "require_valid_token _cost_usd _rate_usd_per_mtok _parse_series _report_pricing_gap"
        run: |
          set -uo pipefail
          # Se una funzione cambia nome il gate deve rompersi QUI. Senza questo
          # controllo il grep sui risultati non troverebbe più niente e passerebbe
          # verde per sempre: è il modo in cui un gate muore senza fare rumore.
          # Vale per tutte e cinque, non solo per la prima — una guardia che copre
          # un sottoinsieme lascia il buco esattamente dove non guarda.
          for funzione in ${FUNZIONI_BLOCCANTI}; do
            if ! grep -q "def ${funzione}" main.py; then
              echo "FAIL: main.py non definisce più '${funzione}'." >&2
              echo "Se l'hai rinominata, aggiorna FUNZIONI_BLOCCANTI nello stesso commit." >&2
              exit 1
            fi
          done

          mutmut run || true
          mutmut results > mutation-results.txt

          # `mutmut results` elenca solo i mutanti NON uccisi (survived, timeout, e
          # "not checked" quando il run muore a metà — che il `|| true` sopra
          # nasconderebbe). Contare solo `survived` faceva passare verde un run che
          # non aveva testato niente: qualsiasi riga con una funzione bloccante è
          # un problema.
          totale=0
          for funzione in ${FUNZIONI_BLOCCANTI}; do
            n=$(grep -c "${funzione}" mutation-results.txt || true)
            echo "non uccisi in ${funzione}: ${n}"
            if [ "${n}" -ne 0 ]; then
              grep "${funzione}" mutation-results.txt
              totale=$((totale + n))
            fi
          done

          if [ "${totale}" -ne 0 ]; then
            echo "" >&2
            echo "FAIL: ${totale} mutanti non uccisi nelle funzioni bloccanti." >&2
            exit 1
          fi
