name: mutation

# Sulle PR **e** di notte. Fino al 23-08-2026 qui c'era scritto "nightly, not
# per-PR: a full mutation run takes minutes, and what it guards (the only
# authorization comparison in the project) changes rarely", e misurando sono
# decadute tutte e due le meta': il run intero e' 2m35s, e le funzioni sorvegliate
# sono passate da una a dodici in tre giorni. Il prezzo di quella riga si e' visto
# il 21-08: la #142 ha aggiunto una guardia dentro `_cost_usd` con tre mutanti
# sopravvissuti, tutti i check della PR erano verdi, e il rosso e' arrivato la notte
# dopo — su `main`, dove un gate non blocca piu' niente. Un gate che scopre dopo il
# merge e' un rapporto, non un cancello.
#
# Il notturno RESTA, e non per abitudine: e' l'unico che si accorge di cio' che
# cambia senza che nessuno apra una PR — una dipendenza risolta diversamente, il
# prezzario che invecchia.
#
# Nessun filtro `paths`, come in test.yml e sonar.yml e per la stessa ragione
# scritta li': un check obbligatorio che non parte per un filtro lascia la PR
# appesa per sempre invece di passare. Oggi questo non e' fra i check obbligatori
# del ruleset, quindi il filtro sarebbe innocuo — e sarebbe la mina che scoppia il
# giorno che qualcuno ce lo aggiunge. Due minuti e mezzo di runner gratuito costano
# meno del job "skip" che servirebbe a disinnescarla.
#
# No ${{ }} expression is interpolated into any `run:` step here — no
# template-injection surface.
on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Deny by default, concesso job per job — come gli altri sei workflow. Questo
# file era rimasto con `contents: read` a livello di WORKFLOW: con un solo job
# l'effetto pratico e' identico, ma il modello di sicurezza no. Un `permissions`
# di workflow concede a ogni job futuro senza che nessuno se ne accorga, ed e'
# elencato per nome fra gli errori noti del modello di pipeline. Il costo di
# tenerlo giusto adesso e' una riga; il costo di accorgersene al secondo job e'
# un job con permessi che nessuno gli ha dato apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE, come negli altri workflow: con un gruppo condiviso un push
  # cancellerebbe i run degli altri, e un check cancellato non e' ne' rosso ne'
  # verde — resta appeso.
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-score:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Allineato a validate.yml, dove la #53 lo ha messo su ogni checkout e
          # questo file era rimasto fuori. Nessun push dalla CI: lasciare il token
          # in .git/config allarga solo il raggio di un eventuale compromesso di
          # uno step successivo — e qui gli step successivi eseguono mutanti del
          # nostro stesso codice.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # UN SOLO comando con entrambi i file, non due in fila. `-c requirements.txt`
      # nel .in vincola la COMPILAZIONE, non l'installazione: con due install
      # sequenziali, il giorno che Dependabot alza una dipendenza CONDIVISA nel lock
      # di produzione senza che requirements-dev.txt venga ricompilato nello stesso
      # PR, il secondo comando la riporterebbe indietro in silenzio e con exit 0 — i
      # test girerebbero contro un albero che la produzione non ha, cioe' esattamente
      # cio' che il vincolo doveva impedire. Con un comando solo e' pip a risolverli
      # insieme e a fallire sul conflitto: il gate e' pip, non un commento.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt -r services/public-status-api/requirements-dev.txt"
      # Lo scope bloccante era `require_valid_token` e basta — spec §6.2. Coverage
      # dice che una riga è stata eseguita; solo questo dice che un'asserzione si
      # sarebbe accorta se cambiava.
      #
      # Dal 13/08 comprende anche il **percorso del costo**. La PR #32 ci aveva
      # ucciso 19 survivor, ma quel percorso non stava nel gate: la pulizia poteva
      # marcire senza che niente se ne accorgesse, ed è il numero pubblico che è
      # già stato sbagliato una volta di 2,8x. Un test scritto una volta e non
      # sorvegliato è una fotografia, non un vincolo.
      #
      # Dal 19/08 comprende anche il **watchdog della persistenza**, e per la stessa
      # ragione al quadrato: il guasto del 13-08 e' rimasto invisibile sei giorni
      # perche' l'intervallo di ri-notifica era di fatto infinito. Era una POLITICA,
      # e nessun test la sorvegliava — un `<` che diventa `<=`, o una condizione
      # invertita, riaprirebbe esattamente quel silenzio senza rompere niente di
      # rosso. E' il posto dove la coverage mente piu' che altrove: le righe sono
      # tutte eseguite, ma l'unica cosa che conta e' se qualcuno se ne accorgerebbe.
      #
      # Dal 19/08 comprende anche le due GUARDIE DI AVVIO — `_token_configurato` e
      # `verifica_dsn`. Sono le funzioni che decidono se il servizio parte: un token
      # vuoto renderebbe valido `Bearer ` con lo spazio, un DSN illeggibile spegnerebbe
      # la segnalazione errori restando identica a "nessun errore". Il primo giro ne
      # ha lasciate vive dieci, tutte sul TESTO del messaggio: quel testo e' l'unica
      # istruzione operativa che riceve chi trova il deploy fermo, quindi si asserisce
      # per intero. Non e' in contraddizione con la deroga qui sotto: li' si rifiuta
      # di congelare il formato dell'ENVELOPE, che appartiene a Sentry.
      #
      # I survivor di sentry.py restano deliberatamente NON bloccanti: asserire il
      # formato esatto sul filo di un reporter fail-open congelerebbe un dettaglio
      # che appartiene a Sentry, non a noi.
      - name: mutmut sulle funzioni bloccanti (autorizzazione, costo, watchdog)
        working-directory: services/public-status-api
        env:
          FUNZIONI_BLOCCANTI: "require_valid_token _cost_usd _rate_usd_per_mtok _parse_series _report_pricing_gap _report_infra_throttled _check_persistence _check_zero_volume _etichetta_sicura _valore_pubblico _token_configurato verifica_dsn"
        run: |
          set -euo pipefail
          # Se una funzione cambia nome il gate deve rompersi QUI. Senza questo
          # controllo il grep sui risultati non troverebbe più niente e passerebbe
          # verde per sempre: è il modo in cui un gate muore senza fare rumore.
          # Vale per OGNI nome in FUNZIONI_BLOCCANTI, non solo per il primo — una
          # guardia che copre un sottoinsieme lascia il buco dove non guarda. Scritto
          # senza il conteggio apposta: "tutte e cinque" e' invecchiato nel commit
          # che le ha portate a sette.
          #
          # I file si LEGGONO da setup.cfg invece di essere nominati qui. Scrivere
          # `main.py` era una SECONDA lista accanto a `source_paths`, e il 19-08-2026
          # e' divergita: `verifica_dsn` e' stata aggiunta a FUNZIONI_BLOCCANTI ma
          # vive in sentry.py, che mutmut mutila e questo grep non guardava. Dalla
          # notte dopo il job usciva 1 PRIMA di generare un solo mutante — quindi non
          # solo era rosso, ma le NOVE funzioni bloccanti non erano piu' sorvegliate
          # da niente, comprese le due guardie d'avvio che il commento qui sopra
          # dichiara coperte. Il pavimento dei 100 mutanti non poteva accorgersene:
          # sta dopo, e non veniva mai raggiunto.
          sorgenti=$(awk '/^source_paths=/{dentro=1;next} /^[a-z_]+=/{dentro=0} dentro&&NF{print $1}' setup.cfg)
          if [ -z "${sorgenti}" ]; then
            echo "FAIL: setup.cfg non dichiara source_paths." >&2
            echo "Senza, questa guardia non sa dove cercare e mutmut non sa cosa mutilare." >&2
            exit 1
          fi
          echo "sorgenti di mutmut, da setup.cfg: $(echo ${sorgenti})"

          for funzione in ${FUNZIONI_BLOCCANTI}; do
            if ! grep -q -- "def ${funzione}" ${sorgenti}; then
              echo "FAIL: nessuno dei sorgenti di mutmut definisce '${funzione}'." >&2
              echo "Cercato in: $(echo ${sorgenti})" >&2
              echo "Se l'hai rinominata, aggiorna FUNZIONI_BLOCCANTI nello stesso commit." >&2
              echo "Se l'hai spostata in un file nuovo, quel file va in source_paths: fuori di li' mutmut non la mutila, e sorvegliarla sarebbe una finzione." >&2
              exit 1
            fi
          done

          # `|| true` resta necessario: mutmut esce non-zero QUANDO ci sono
          # sopravvissuti, che e' il caso che vogliamo misurare, non subire.
          mutmut run || true
          mutmut results > mutation-results.txt

          # Il pavimento. Senza, questo gate conta solo gli esiti CATTIVI e non
          # asserisce mai quello buono: se mutmut non parte — cache sporca,
          # dipendenze sfasate, un errore di import — il file dei risultati resta
          # vuoto, ogni grep -c da' 0, e lo step esce verde avendo verificato
          # NIENTE. "Nessun sopravvissuto" e "nessun mutante" erano lo stesso
          # output, e il 19-08-2026 questo gate e' stato usato per dichiarare zero
          # sopravvissuti: la dichiarazione valeva solo perche' un umano ha visto
          # scorrere i mutanti.
          #
          # 100 e' un pavimento grossolano, non una soglia di qualita': al
          # 19-08-2026 i mutanti generati sono 260.
          #
          # E prova che sono stati GENERATI, non che siano stati eseguiti: `mutmut
          # results` rilegge lo stato da disco, e un mutante mai eseguito compare
          # come "not checked", che questo conteggio include. L'esecuzione la
          # asserisce il ciclo qui sotto, che tratta "not checked" come un problema
          # al pari di "survived". Le due meta' insieme coprono sia il run morto sia
          # quello a meta'; questo pavimento da solo copre la prima.
          generati=$(mutmut results --all true | grep -cE ": (killed|survived|timeout|no tests|not checked|skipped|suspicious)" || true)
          echo "mutanti generati: ${generati}"
          if [ "${generati}" -lt 100 ]; then
            echo "FAIL: mutmut ha classificato ${generati} mutanti (attesi >=100)." >&2
            echo "Non e' un punteggio basso: e' un run che non ha girato." >&2
            exit 1
          fi

          # `mutmut results` elenca solo i mutanti NON uccisi (survived, timeout, e
          # "not checked" quando il run muore a metà — che il `|| true` sopra
          # nasconderebbe). Contare solo `survived` faceva passare verde un run che
          # non aveva testato niente: qualsiasi riga con una funzione bloccante è
          # un problema.
          totale=0
          for funzione in ${FUNZIONI_BLOCCANTI}; do
            n=$(grep -c "${funzione}" mutation-results.txt || true)
            echo "non uccisi in ${funzione}: ${n}"
            if [ "${n}" -ne 0 ]; then
              grep "${funzione}" mutation-results.txt
              totale=$((totale + n))
            fi
          done

          if [ "${totale}" -ne 0 ]; then
            echo "" >&2
            echo "FAIL: ${totale} mutanti non uccisi nelle funzioni bloccanti." >&2
            exit 1
          fi
