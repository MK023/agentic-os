name: mutation

# Nightly, not per-PR: a full mutation run takes minutes, and what it guards (the
# only authorization comparison in the project) changes rarely.
# No ${{ }} expression is interpolated into any `run:` step here — no
# template-injection surface.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Split: requirements.txt is hash-locked, and pip applies hash-checking to the
      # whole command as soon as one requirement carries hashes.
      # Quoted: an unquoted ":all: " would make YAML read a mapping mid-command.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt"
      - run: pip install respx==0.23.1 pytest==9.1.1 mutmut==3.6.0
      # Blocking scope is `require_valid_token` only — spec §6.2. Coverage says a
      # line ran; only this says an assertion would have noticed it change.
      # sentry.py's survivors (string/dict shape inside the envelope payload) are
      # deliberately not blocking: asserting the exact wire format of a fail-open
      # reporter would freeze a detail Sentry owns, not us.
      - name: mutmut sulla funzione di autorizzazione (blocca sui non uccisi)
        working-directory: services/public-status-api
        run: |
          set -uo pipefail
          # Se la funzione cambia nome il gate deve rompersi QUI: il grep sotto non
          # troverebbe mai più nulla e passerebbe verde per sempre.
          grep -q 'def require_valid_token' main.py
          mutmut run || true
          mutmut results > mutation-results.txt
          # `mutmut results` elenca solo i mutanti NON uccisi (survived, timeout, e
          # "not checked" quando il run muore a metà — che il `|| true` sopra
          # nasconderebbe). Contare solo `survived` faceva passare verde un run che
          # non aveva testato niente: qualsiasi riga con la funzione è un problema.
          non_uccisi=$(grep -c 'require_valid_token' mutation-results.txt || true)
          echo "Mutanti non uccisi in require_valid_token: ${non_uccisi}"
          if [ "${non_uccisi}" -ne 0 ]; then
            grep 'require_valid_token' mutation-results.txt
            exit 1
          fi
