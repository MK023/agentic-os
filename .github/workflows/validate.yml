name: validate

on:
  pull_request:
  push:
    permissions:
      contents: read
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di workflow
# lo regala anche ai job che il repository non lo leggono mai; con la mappa vuota
# ogni permesso qui sotto e' una riga che qualcuno ha dovuto scrivere apposta.
permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# No `run:` step in this workflow interpolates any ${{ }} expression: the only
# expressions used are in `if:` conditions and `env:` mappings, so there is no
# template-injection surface. zizmor (workflow-lint job below) enforces that.
jobs:
  compose:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
          STATUS_API_TOKEN: dummy
          OTLP_INGEST_TOKEN: dummy
          SENTRY_DSN: ""

  status-api-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Must track the minor in services/public-status-api/Dockerfile — the
      # python-versions job below fails the build when they drift. Drift is silent
      # otherwise: every job here stays green while testing a runtime production
      # does not have, because the image build proves only that the hash-locked
      # wheels install, never that one test ran on that interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Two commands, not one: requirements.txt carries hashes, and pip switches the
      # WHOLE command into hash-checking mode as soon as one requirement has them —
      # the unhashed test tools would fail the install.
      # Quoted: an unquoted ":all: " would make YAML read a mapping mid-command.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt"
      # Pinnate come tutto il resto della pipeline: erano l'unico install non
      # deterministico rimasto (le dipendenze di prodotto sono hash-locked).
      - run: pip install respx==0.23.1 pytest==9.1.1 pytest-cov==7.1.0
      - run: pytest services/public-status-api/test_main.py -v --cov=services/public-status-api --cov-report=xml:services/public-status-api/coverage.xml --cov-fail-under=100

  # Builds every image the platform will build. The four Railway Dockerfiles copy
  # configuration out of docker/, so a moved or renamed config file breaks them —
  # and that breakage would otherwise surface as a failed deploy rather than a
  # failed check. Also builds the status API image, which is where the hash-locked
  # install actually gets exercised.
  images:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Ritenta: il primo fallimento non deterministico di questa pipeline è stato un
      # `TLS handshake timeout` verso auth.docker.io mentre si scaricava un'immagine
      # base (29-07). Non è il nostro codice, ma un gate che fallisce a caso smette
      # di essere un segnale — o si rende resiliente o si toglie.
      # Tre tentativi con attesa crescente. Se diventasse frequente, il passo
      # successivo è specchiare le immagini base su GHCR e smettere di dipendere dal
      # rate limit anonimo di Docker Hub.
      - name: build delle immagini (con ritentata sui fallimenti di rete)
        run: |
          set -uo pipefail
          costruisci() {
            for tentativo in 1 2 3; do
              if docker build "$@"; then return 0; fi
              echo "tentativo ${tentativo} fallito, riprovo tra $((tentativo * 15))s" >&2
              sleep $((tentativo * 15))
            done
            return 1
          }
          for servizio in otel-collector prometheus grafana cloudflared; do
            costruisci -f "railway/${servizio}/Dockerfile" -t "agentic-${servizio}:ci" .
          done
          costruisci -t agentic-status-api:ci services/public-status-api

      # `docker compose config` NON valida questo file, e non è una svista: compose
      # conosce il proprio schema, non quello del Collector — quella config è solo un
      # file montato dentro un container. Finora nessun gate la leggeva, quindi un
      # errore lì passava tutti i check e moriva al deploy.
      # Il caso che l'ha motivato: `service::telemetry::metrics::address` è IGNORATA
      # dalla v0.123.0. Non è un errore di sintassi, quindi niente si sarebbe
      # lamentato — il Collector sarebbe partito con la porta chiusa e la metrica
      # semplicemente non sarebbe esistita.
      # Gira sull'immagine appena costruita: valida ESATTAMENTE il file che viene
      # spedito, con esattamente la versione che lo eseguirà.
      # Le immagini erano pinnate e mai guardate: sapevamo esattamente quale
      # versione gira, non se ha CVE noti. Pinnare risponde alla riproducibilita',
      # non all'esposizione.
      #
      # Bloccante SOLO sull'immagine che componiamo noi. La prima versione di
      # questo gate falliva su tutte e cinque con `ignore-unfixed`, e al primo
      # run e' andata rossa su 15 HIGH dentro grafana 13.1.3 (tempo, stdlib Go
      # 1.26.3, x/net, x/text). Sono veri e hanno un fix **nei moduli Go a
      # monte**, non in una release di Grafana installabile: il gate sarebbe
      # rimasto rosso per settimane, e un gate perennemente rosso diventa un
      # `continue-on-error` con passaggi extra.
      #
      # La distinzione utile non e' "il CVE ha un fix" ma "possiamo agire":
      # su status-api si aggiorna la base o una dipendenza, sulle immagini di
      # terzi l'unica leva e' aggiornare l'immagine, che e' gia' il mestiere di
      # Dependabot. Quindi quelle si scansionano e si leggono, non bloccano.
      # `vuln-type: library` — le dipendenze Python, le uniche che scegliamo noi.
      # Un CVE li si chiude modificando requirements.in e ricompilando il lockfile.
      # Oggi sono tutte a zero: fastapi, httpx, pydantic, uvicorn, l'intero albero.
      - name: CVE delle dipendenze Python di status-api (bloccante)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: library
          exit-code: "1"
          format: table

      # I pacchetti di sistema di `python:3.14.0-slim` ricadono nella stessa
      # categoria delle immagini di terzi qui sotto: non li installiamo noi e
      # l'unica leva e' cambiare il tag della base. Al 13/08 sono 25 HIGH con fix
      # in Debian ma non ancora in un tag pubblicato. Visibili, non bloccanti.
      - name: CVE del sistema operativo di status-api (informativo)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os
          exit-code: "0"
          format: table

      - name: CVE dell'immagine otel-collector (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-otel-collector:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine prometheus (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-prometheus:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine grafana (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-grafana:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine cloudflared (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: agentic-cloudflared:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: validate della config del Collector (col binario che la eseguirà)
        env:
          OTLP_INGEST_TOKEN: dummy
        run: |
          docker run --rm -e OTLP_INGEST_TOKEN agentic-otel-collector:ci \
            validate --config=/etc/otelcol-contrib/config.yaml

  # Guardia sulla deroga. Il servizio prometheus gira come root SU RAILWAY, via
  # RAILWAY_RUN_UID=0, perché il volume montato è di proprietà di root — deroga
  # unica, misurata e scritta in docs/DECISIONS.md. Questo job impedisce che
  # diventi un'abitudine: un Dockerfile nuovo senza USER, o un USER 0 messo per
  # far sparire un errore di permessi, fallisce qui.
  image-users:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: bash scripts/check-image-users.sh

  # Fino al 13/08/2026 questa pipeline aveva dodici gate e nessun linter Python.
  # Non era un problema teorico: al primo lancio ruff ha trovato uno `zip()` senza
  # `strict=` proprio dove si costruiscono i tre numeri pubblici — se le chiavi e i
  # risultati divergessero, l'endpoint risponderebbe 200 con un valore accoppiato
  # alla query sbagliata. Stessa famiglia del `result[0]` che leggeva un gruppo su N.
  #
  # `S` (flake8-bandit) è dentro ruff, quindi bandit gira sotto in gran parte in
  # sovrapposizione: misurato il 13/08, l'unico rilievo di bandit era lo stesso
  # `B110` che ruff segnala come `S110`. Resta perché il suo catalogo si muove
  # separatamente, non perché oggi aggiunga segnale.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Pinnati come ogni altra cosa qui: un linter che cambia versione da solo
      # trasforma un gate in un generatore casuale di build rosse.
      - run: pip install ruff==0.15.4 bandit==1.9.2
      - run: ruff check .
      - run: ruff format --check .
      # -x sui test: gli assert sono il modo in cui i test si scrivono. La cartella
      # mutants/ è generata da mutmut e non è codice sorgente.
      - run: bandit -q -r services/public-status-api -x '**/test_*.py,**/mutants/**'

  # La versione di Python è scritta in cinque posti — quattro pin nei workflow e
  # il FROM del Dockerfile — e setup-python non sa leggere un Dockerfile. La
  # duplicazione non si elimina, si sorveglia: questo job fallisce quando i due
  # numeri divergono, cioè quando la CI proverebbe un interprete che la
  # produzione non ha. Verde senza questo gate voleva dire solo che le wheel si
  # installavano; nessun test aveva mai eseguito su quel Python.
  python-versions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: bash scripts/check-python-versions.sh

  # Infrastructure static analysis: the Dockerfiles and these workflows, which is all
  # the infrastructure this repo has now that deployment is Railway's config-as-code.
  # Sonar covers the Python; policy lives in .checkov.yml (blocks on HIGH/CRITICAL,
  # soft-fails LOW/MEDIUM).
  checkov:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: .
          config_file: .checkov.yml

  # Pipeline-as-attack-surface: zizmor is SAST for
  # the workflows themselves — template injection, dangerous triggers, overly
  # broad permissions. Blocks on HIGH, pinned version — a linter that changes its
  # own rules silently is a non-deterministic gate.
  workflow-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - name: zizmor sui workflow (blocca su HIGH)
        run: |
          pip install --quiet zizmor==1.28.0
          zizmor --min-severity=high .github/workflows/

  # Two dependency gates on purpose, they see different things: this one audits
  # the WHOLE pinned set on every run, `dependency-review` below sees only what a
  # single PR's diff introduces. Keeping both also means the audit survives if the
  # repo ever goes private again — `dependency-review` cannot run there without
  # GitHub Code Security (confirmed live on PR #1, 2026-07-28, before this repo
  # was made public), pip-audit needs no licence and no secret.
  # Policy: any known advisory against the three pinned dependencies fails the
  # build. With three dependencies that is a real signal, not noise; if an
  # advisory that provably does not apply here ever fires, add
  # `--ignore-vuln <ID>` with a comment saying why — never drop the gate.
  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r services/public-status-api/requirements.txt --progress-spinner off

  # Blocks on new HIGH-severity CVEs introduced by this PR's dependency diff — it
  # does not see what is already on main (that is pip-audit's job above, plus
  # Dependabot alerts). Uses no secrets, so it runs on Dependabot's own PRs too.
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Zero tolerance, full history, e da oggi nessuna eccezione — perche' una
  # c'era. Fino al 13/08/2026 il job portava
  # `if: pull_request.user.login != 'dependabot[bot]'`, e le dieci PR di
  # Dependabot mergiate quel giorno sono entrate in main **senza scansione dei
  # segreti**. Il motivo era legittimo (l'action vuole un token che a quelle PR
  # non arriva, e sarebbe rimasta rossa bloccando ogni bump) ma il risultato no:
  # un check obbligatorio che si salta da solo e' un `continue-on-error` con
  # passaggi extra, che e' la cosa che il CLAUDE.md vieta per nome.
  #
  # Il binario CLI non vuole nessun token, quindi l'eccezione non ha piu' una
  # ragione di esistere e sparisce. Un percorso solo, non due: tenere l'action
  # per gli umani e la CLI per Dependabot avrebbe lasciato in piedi proprio il
  # ramo che nessuno guarda, che e' il ramo dove le cose marciscono.
  # Sparisce anche `pull-requests: read`, che serviva solo all'action.
  #
  # Pinnato per versione **e** per checksum: da solo il pin della versione e'
  # un'etichetta, e un release asset di GitHub si puo' sostituire sotto la
  # stessa etichetta. `--redact=100` perche' i log di un repo pubblico sono
  # pubblici: un gate che trova un segreto e lo stampa in chiaro lo pubblica lui.
  #
  # Misurato in locale con la v8.30.1 prima di scriverlo: exit 0 sulla storia di
  # questo repo (99 commit, nessun leak), exit 1 su un repo con una chiave AWS
  # piantata apposta. Il secondo e' quello che conta.
  gitleaks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # `gitleaks git` legge la storia con `git log -p`: con la profondita'
          # di default vedrebbe un commit solo e direbbe comunque "no leaks
          # found" — verde e cieco.
          fetch-depth: 0
      - name: gitleaks su tutta la storia (binario pinnato, nessun token)
        env:
          GITLEAKS_VERSION: 8.30.1
          # Checksum di gitleaks_8.30.1_linux_x64.tar.gz. Cambiando VERSION va
          # rifatto anche questo: un asset diverso fa fallire lo step, ed e' il
          # comportamento voluto, non un intralcio.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # Scaricato in RUNNER_TEMP e non nel workspace: un binario da 8 MB nella
        # working copy finirebbe sotto gli occhi dello scan che stiamo lanciando.
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --exit-code 1 --no-banner .

  # Runs on pushes to main as well as on PRs. PR-only was a real gap: SonarQube
  # Cloud had never analysed the main branch at all (`measures: []`), so the project
  # had no baseline, no quality-gate history, and nothing for "new code" to be new
  # *against* — the Clean-as-You-Code model needs the main branch analysed to mean
  # anything.
  # Still excluded for Dependabot PRs: GitHub does not pass repository secrets to
  # them, so SONAR_TOKEN arrives empty and the scan dies with "Not authorized" on
  # every dependency bump — a gate that structurally cannot pass there, not a
  # weakened one. On a push event `github.event.pull_request` is null, so the first
  # clause short-circuits and the job runs.
  sonar:
    permissions:
      contents: read
    # Due esclusioni, entrambe per la stessa ragione: i secret non raggiungono
    # queste PR, quindi il job resterebbe rosso per sempre bloccando ogni merge.
    # I fork non sono un caso teorico: questo repository e' pubblico.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Two commands, not one: requirements.txt carries hashes, and pip switches the
      # WHOLE command into hash-checking mode as soon as one requirement has them —
      # the unhashed test tools would fail the install.
      # Quoted: an unquoted ":all: " would make YAML read a mapping mid-command.
      - run: "pip install --require-hashes --only-binary=:all: -r services/public-status-api/requirements.txt"
      # Pinnate come tutto il resto della pipeline: erano l'unico install non
      # deterministico rimasto (le dipendenze di prodotto sono hash-locked).
      - run: pip install respx==0.23.1 pytest==9.1.1 pytest-cov==7.1.0
      - run: pytest services/public-status-api/test_main.py -v --cov=services/public-status-api --cov-report=xml:services/public-status-api/coverage.xml --cov-fail-under=100
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
