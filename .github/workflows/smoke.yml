name: smoke

# Il CLAUDE.md di questo repo dichiara scripts/verify-hub.sh "il vero controllo
# che un deploy ha funzionato" — e fino a oggi non lo eseguiva nessuno in
# automatico. Railway ignora l'HEALTHCHECK del Dockerfile, quindi un deploy
# `SUCCESS` dice soltanto che il container e' partito, non che sta servendo.
#
# Questa e' la versione economica: colpisce il solo endpoint pubblico, non ha
# bisogno di nessun segreto e quindi puo' esistere subito. La versione completa
# (verify-hub.sh, che verifica anche Grafana dietro Access e la status API con
# il suo bearer) richiede CF_ACCESS_CLIENT_ID/SECRET e STATUS_API_TOKEN come
# GitHub secrets: crearli e' una decisione di Marco, non della CI.
on:
  schedule:
    # `*/10` e' cio' che si CHIEDE, non cio' che si ottiene. Misurato sui primi
    # dodici run reali del 13/08: intervalli fra 38 e 93 minuti, mediana ~55.
    # GitHub non garantisce la puntualita' degli schedule e strozza i cron
    # frequenti sui repo pubblici — il numero qui dentro e' un tetto, non una
    # cadenza.
    #
    # Quindi la prima versione di questo commento, che diceva "avrebbe visto
    # entrambe le finestre del 13/08", era FALSA e va detto: quelle finestre
    # duravano pochi minuti l'una, e a ~55' ci si passa in mezzo quasi sempre.
    # Quello che questa sonda vede davvero e' un disservizio che DURA: un deploy
    # che non serve, un volume pieno, un Tunnel giu'. Non un riavvio di due
    # minuti.
    #
    # Per cogliere anche quelli servirebbe una sonda che non gira su GitHub —
    # per esempio un Cron Trigger sul Worker del sito, che sta gia' sul bordo e
    # ha gia' il canale Sentry cablato. E' infrastruttura nuova, quindi e' una
    # decisione di Marco, non della CI.
    - cron: "*/10 * * * *"
  # Niente trigger su push a main, e non e' una dimenticanza: Railway ridispiega
  # in modo asincrono e mette in coda sui crediti gratuiti. Un controllo lanciato
  # subito dopo il push interrogherebbe il container VECCHIO e direbbe "verde"
  # proprio del deploy che non e' ancora arrivato — la stessa classe di guasto
  # silenzioso che questo workflow esiste per intercettare.
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Se un run resta appeso, il successivo non si accoda: non serve a niente avere
  # due sonde in volo, e `cancel-in-progress` terrebbe viva solo l'ultima.
  group: smoke
  cancel-in-progress: false

jobs:
  # Nessun checkout: lo script sta tutto qui e il job non legge il repository.
  # Con `permissions: {}` il GITHUB_TOKEN di questo job non puo' fare niente.
  endpoint-pubblico:
    runs-on: ubuntu-latest
    steps:
      - name: l'endpoint pubblico risponde 200 con tre numeri veri
        env:
          URL: https://marcobellingeri.dev/api/agentic-status
        run: |
          set -euo pipefail

          # --retry-all-errors copre anche i 5xx transitori del bordo Cloudflare:
          # un gate che diventa rosso per un blip di rete smette di essere letto,
          # e questo gira 144 volte al giorno.
          codice=$(curl -sS -o "$RUNNER_TEMP/risposta.json" -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "$URL")

          if [ "$codice" != "200" ]; then
            echo "FAIL: l'endpoint pubblico ha risposto ${codice}, non 200" >&2
            cat "$RUNNER_TEMP/risposta.json" >&2 || true
            exit 1
          fi

          # Il controllo che conta davvero. Il Worker fa fail-open per scelta: se
          # l'hub e' irraggiungibile risponde comunque 200, con i tre campi a
          # null, cosi' il visitatore vede un trattino invece di un errore. E'
          # corretto verso il pubblico ed e' esattamente cio' che rende inutile
          # guardare solo il codice HTTP: durante un blackout totale dell'hub
          # questo gate sarebbe verde. I null sono il segnale, il 200 no.
          python3 - "$RUNNER_TEMP/risposta.json" <<'PY'
          import json
          import sys

          campi = ("sessionsToday", "tokensToday", "costUsdToday")

          try:
              with open(sys.argv[1]) as sorgente:
                  dati = json.load(sorgente)
          except (OSError, ValueError) as errore:
              print(f"FAIL: risposta 200 ma non e' JSON valido: {errore}", file=sys.stderr)
              sys.exit(1)

          nulli = [campo for campo in campi if dati.get(campo) is None]
          if nulli:
              print(f"FAIL: 200 ma questi campi sono null: {', '.join(nulli)}", file=sys.stderr)
              print("Il Worker fa fail-open: 200 + null significa che NON e' riuscito", file=sys.stderr)
              print("a leggere l'hub. Guarda Railway (prometheus, status-api) e il Tunnel.", file=sys.stderr)
              sys.exit(1)

          # Secondo modo di rispondere 200 con numeri veri mentre l'hub e' giu'.
          # Da marcobellingeri.dev#202 il Worker, quando non riesce a leggere
          # l'hub, serve l'ultimo valore buono dalla Cache API invece del
          # trattino. E' giusto per il visitatore e sarebbe un disastro qui: i tre
          # campi tornerebbero pieni e questo gate direbbe verde per un'ora esatta
          # mentre l'hub e' morto. Il Worker si dichiara con `stale`, e questa e'
          # l'unica ragione per cui quel campo esiste.
          if dati.get("stale"):
              eta = dati.get("ageSeconds")
              print(f"FAIL: 200 con numeri VECCHI (stale, ~{eta}s fa).", file=sys.stderr)
              print("Il Worker sta servendo l'ultimo valore buono: l'hub non risponde.", file=sys.stderr)
              print("I numeri sono veri, il momento no. Guarda Railway e il Tunnel.", file=sys.stderr)
              sys.exit(1)

          print(f"ok: {dati}")
          PY
