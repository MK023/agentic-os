name: smoke

# Il CLAUDE.md di questo repo dichiara scripts/verify-hub.sh "il vero controllo
# che un deploy ha funzionato" — e fino a oggi non lo eseguiva nessuno in
# automatico. Railway ignora l'HEALTHCHECK del Dockerfile, quindi un deploy
# `SUCCESS` dice soltanto che il container e' partito, non che sta servendo.
#
# Questa e' la versione economica: colpisce il solo endpoint pubblico, non ha
# bisogno di nessun segreto e quindi puo' esistere subito. La versione completa
# (verify-hub.sh, che verifica anche Grafana dietro Access e la status API con
# il suo bearer) richiede CF_ACCESS_CLIENT_ID/SECRET e STATUS_API_TOKEN come
# GitHub secrets: crearli e' una decisione di Marco, non della CI.
on:
  schedule:
    # `*/10` e' cio' che si CHIEDE, non cio' che si ottiene. Misurato sui primi
    # dodici run reali del 13/08: intervalli fra 38 e 93 minuti, mediana ~55.
    # Rimisurato il 23/08 sugli ultimi venti run: 15-92 minuti, mediana ~29,
    # media 36. Migliorato, non risolto — la coda lunga e' ancora li', e finche'
    # c'e' la finestra cieca sul percorso pubblico si dichiara in ore, non in
    # minuti.
    # GitHub non garantisce la puntualita' degli schedule e strozza i cron
    # frequenti sui repo pubblici — il numero qui dentro e' un tetto, non una
    # cadenza.
    #
    # Quindi la prima versione di questo commento, che diceva "avrebbe visto
    # entrambe le finestre del 13/08", era FALSA e va detto: quelle finestre
    # duravano pochi minuti l'una, e a ~55' ci si passa in mezzo quasi sempre.
    # Quello che questa sonda vede davvero e' un disservizio che DURA: un deploy
    # che non serve, un volume pieno, un Tunnel giu'. Non un riavvio di due
    # minuti.
    #
    # Per cogliere anche quelli servirebbe una sonda che non gira su GitHub —
    # per esempio un Cron Trigger sul Worker del sito, che sta gia' sul bordo e
    # ha gia' il canale Sentry cablato. E' infrastruttura nuova, quindi e' una
    # decisione di Marco, non della CI.
    - cron: "*/10 * * * *"
  # Niente trigger su push a main, e non e' una dimenticanza: Railway ridispiega
  # in modo asincrono e mette in coda sui crediti gratuiti. Un controllo lanciato
  # subito dopo il push interrogherebbe il container VECCHIO e direbbe "verde"
  # proprio del deploy che non e' ancora arrivato — la stessa classe di guasto
  # silenzioso che questo workflow esiste per intercettare.
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Se un run resta appeso, il successivo non si accoda: non serve a niente avere
  # due sonde in volo, e `cancel-in-progress` terrebbe viva solo l'ultima.
  group: smoke
  cancel-in-progress: false

jobs:
  # Nessun checkout: lo script sta tutto qui e il job non legge il repository.
  # Con `permissions: {}` il GITHUB_TOKEN di questo job non puo' fare niente.
  # L'unica cosa esposta su internet che ACCETTA scritture, e il suo controllo
  # d'accesso non era mai stato riverificato dopo il primo giorno: la prova 401/401/200
  # esiste in docs/LOCAL_DRY_RUN.md (contro un container locale) e in una misura una
  # tantum registrata in DECISIONS.md. Togliere OTLP_INGEST_TOKEN dal servizio, o
  # perdere il blocco `auth:` in una modifica che passa comunque `validate`, aprirebbe
  # l'ingest a chiunque con tutti e dodici i gate verdi.
  #
  # Sta QUI e non in verify-hub.sh perche' non serve nessun segreto: la prova e' che
  # una richiesta SENZA credenziali venga rifiutata. Un test che non ha bisogno di un
  # segreto per esistere non deve dipendere da un segreto per girare — e' la ragione
  # per cui verify-hub.sh e' ancora manuale.
  ingest-chiede-il-token:
    runs-on: ubuntu-latest
    steps:
      - name: l'ingest OTLP rifiuta chi non ha il token
        env:
          HOST: https://otel.marcobellingeri.dev
        run: |
          set -euo pipefail

          # `attesi` e' una lista separata da spazi: dal 20/08/2026 davanti
          # all'ingest c'e' una regola WAF, quindi per la stessa richiesta il
          # codice legittimo puo' venire dal bordo o dal Collector, e sono due
          # numeri diversi. Vedi il commento su "senza header" piu' sotto.
          controlla() {
            attesi="$1"; descrizione="$2"; percorso="$3"; shift 3
            codice=$(curl -sS -o /dev/null -w '%{http_code}' \
              --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 \
              "$@" "${HOST}${percorso}")
            for atteso in $attesi; do
              if [ "$codice" = "$atteso" ]; then
                echo "ok: ${descrizione} -> ${codice}"
                return 0
              fi
            done
            echo "FAIL: ${descrizione} ha ricevuto ${codice}, atteso uno di: ${attesi}." >&2
            # La conseguenza dipende da CHI doveva rispondere: un messaggio solo,
            # buono per entrambi i casi, e' un messaggio sbagliato per uno dei due.
            # Questa e' la frase che qualcuno legge alle 3 di notte.
            #
            # Si sceglie sul CODICE RICEVUTO, non sull'atteso e non sul percorso.
            # Instradare sul percorso era sbagliato dal 20/08 mattina; instradare
            # sull'atteso lo e' diventato il 20/08 pomeriggio, aprendo /v1/logs:
            # 401 e 403 sono entrambi vivi, dicono solo CHI ha risposto, quindi uno
            # scambio fra i due e' sempre la superficie che si e' spostata. Solo un
            # 2xx significa che non ha risposto nessuno dei due controlli.
            case "$codice" in
              5*|000)
                # Il codice non-conforme PIU' PROBABILE su una sonda che gira 144
                # volte al giorno, e per due versioni finiva nel ramo del bordo:
                # chi legge andava ad aprire la dashboard Cloudflare per un guasto
                # che sta su Railway. Due rami non bastavano.
                echo "Ne' il bordo ne' il Collector hanno risposto: e' il Tunnel o" >&2
                echo "l'origine. Guarda i deploy Railway e lo stato di cloudflared," >&2
                echo "NON la regola WAF — quella e' il caso 401/403 qui sotto." >&2
                echo "Da fuori il sistema e' irraggiungibile mentre dentro puo'" >&2
                echo "continuare a funzionare benissimo: le tre cifre pubbliche si" >&2
                echo "congelano senza che niente all'interno se ne accorga." >&2
                ;;
              2*)
                echo "L'ingest e' l'unica superficie pubblica che accetta scritture:" >&2
                echo "un 200 qui significa che chiunque puo' scrivere nel TSDB, e i tre" >&2
                echo "numeri pubblici diventano quelli che decide lui." >&2
                ;;
              *)
                echo "La superficie raggiungibile si e' spostata: la regola WAF su otel." >&2
                echo "vive nella dashboard Cloudflare e non in questo repository, quindi" >&2
                echo "nessun altro controllo se ne accorge. Atteso ${attesi}, arrivato" >&2
                echo "${codice}: se il bordo ha smesso di bloccare, una rotta e' tornata" >&2
                echo "aperta; se blocca un percorso che deve passare, l'ingest di quel" >&2
                echo "segnale e' fermo e nessuno lo sta dicendo." >&2
                echo "L'autenticazione regge comunque — e' bearertokenauth dentro il" >&2
                echo "Collector — ma non e' piu' lei a decidere chi arriva." >&2
                ;;
            esac
            exit 1
          }

          post=(-X POST -H 'Content-Type: application/json' -d '{}')

          # --- Cio' che prova il COLLECTOR ---------------------------------
          # Queste tre passano la regola WAF (sono POST /v1/metrics) e arrivano
          # davvero al Collector: il 401 lo dice lui. Sono la prova che
          # `bearertokenauth` e' ancora al suo posto, e restano vere anche se un
          # giorno la regola WAF venisse estesa all'header Authorization.
          #
          # Misurato il 19/08/2026: con OTLP_INGEST_TOKEN vuoto il Collector PARTE
          # (lo dice solo a livello info) e continua a rispondere 401 anche a un
          # bearer vuoto. Non fa fail-open — e questa riga e' cio' che lo tiene vero.
          controlla 401 "un bearer vuoto" /v1/metrics "${post[@]}" -H 'Authorization: Bearer '
          # Un token SBAGLIATO, non assente: dal 20/08/2026 il bordo ferma chi non
          # porta l'header, quindi questa e' diventata l'UNICA riga che arriva al
          # Collector con credenziali e lo vede rifiutarle. Se sparisse, resterebbe
          # provata solo la regola WAF e non l'autenticazione che sta sotto.
          controlla 401 "un bearer non valido" /v1/metrics "${post[@]}" \
            -H 'Authorization: Bearer questo-token-non-esiste'
          # `/v1/logs` e' aperto dal 20/08/2026 perche' Loki ingerisce i log event di
          # Claude Code (Fase 1.5). Il bordo lo lascia passare, quindi il 401 lo dice
          # il Collector: e' la prova che l'autenticazione vale sul percorso NUOVO e
          # non solo su quello vecchio. Aprire una rotta e non asserirla e' come
          # aprirla e dimenticarsene.
          controlla 401 "un bearer non valido su /v1/logs" /v1/logs "${post[@]}" \
            -H 'Authorization: Bearer questo-token-non-esiste'

          # --- Cio' che prova la regola WAF --------------------------------
          # La regola vive nella dashboard Cloudflare, fuori da git: nessun gate di
          # questo repository puo' accorgersi se qualcuno la disattiva, e una
          # superficie che torna aperta in silenzio e' esattamente il guasto che
          # questo workflow esiste per intercettare. Queste tre righe sono l'unico
          # posto in cui quella regola viene riverificata.
          # Misurate contro produzione il 20/08/2026, subito dopo ogni modifica.
          #
          # 403 ESATTO, non "401 o 403". Fra il 20/08 mattina e il 20/08 sera questa
          # riga ha accettato entrambi, perche' la regola non guardava ancora
          # l'header e la richiesta arrivava al Collector: era una tolleranza per la
          # transizione, non una tolleranza. Un controllo che accetta due codici per
          # sempre e' un controllo che non puo' fallire.
          controlla 403 "una richiesta senza header Authorization" /v1/metrics "${post[@]}"
          # La stessa asserzione sul percorso NUOVO. SECURITY.md dichiara la misura
          # "su entrambi i percorsi" e finora era provata su uno: se la regola WAF
          # diventasse permissiva su /v1/logs senza header, l'autenticazione
          # reggerebbe (il Collector risponde 401) ma la superficie raggiungibile si
          # allargherebbe e nessuna delle sei asserzioni se ne accorgeva.
          controlla 403 "una richiesta senza header Authorization su /v1/logs" /v1/logs "${post[@]}"
          controlla 403 "un GET sulla radice" /
          controlla 403 "una POST su /v1/traces" /v1/traces "${post[@]}"

  endpoint-pubblico:
    runs-on: ubuntu-latest
    steps:
      - name: l'endpoint pubblico risponde 200 con tre numeri veri
        env:
          URL: https://marcobellingeri.dev/api/agentic-status
        run: |
          set -euo pipefail

          # --retry-all-errors copre anche i 5xx transitori del bordo Cloudflare:
          # un gate che diventa rosso per un blip di rete smette di essere letto,
          # e questo gira 144 volte al giorno.
          codice=$(curl -sS -o "$RUNNER_TEMP/risposta.json" -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "$URL")

          if [ "$codice" != "200" ]; then
            echo "FAIL: l'endpoint pubblico ha risposto ${codice}, non 200" >&2
            cat "$RUNNER_TEMP/risposta.json" >&2 || true
            exit 1
          fi

          # Il controllo che conta davvero. Il Worker fa fail-open per scelta: se
          # l'hub e' irraggiungibile risponde comunque 200, con i tre campi a
          # null, cosi' il visitatore vede un trattino invece di un errore. E'
          # corretto verso il pubblico ed e' esattamente cio' che rende inutile
          # guardare solo il codice HTTP: durante un blackout totale dell'hub
          # questo gate sarebbe verde. I null sono il segnale, il 200 no.
          python3 - "$RUNNER_TEMP/risposta.json" <<'PY'
          import json
          import sys

          campi = ("sessionsToday", "tokensToday", "costUsdToday")

          try:
              with open(sys.argv[1]) as sorgente:
                  dati = json.load(sorgente)
          except (OSError, ValueError) as errore:
              print(f"FAIL: risposta 200 ma non e' JSON valido: {errore}", file=sys.stderr)
              sys.exit(1)

          nulli = [campo for campo in campi if dati.get(campo) is None]
          if nulli:
              print(f"FAIL: 200 ma questi campi sono null: {', '.join(nulli)}", file=sys.stderr)
              print("Il Worker fa fail-open: 200 + null significa che NON e' riuscito", file=sys.stderr)
              print("a leggere l'hub. Guarda Railway (prometheus, status-api) e il Tunnel.", file=sys.stderr)
              sys.exit(1)

          # Secondo modo di rispondere 200 con numeri veri mentre l'hub e' giu'.
          # Da marcobellingeri.dev#202 il Worker, quando non riesce a leggere
          # l'hub, serve l'ultimo valore buono dalla Cache API invece del
          # trattino. E' giusto per il visitatore e sarebbe un disastro qui: i tre
          # campi tornerebbero pieni e questo gate direbbe verde per un'ora esatta
          # mentre l'hub e' morto. Il Worker si dichiara con `stale`, e questa e'
          # l'unica ragione per cui quel campo esiste.
          if dati.get("stale"):
              eta = dati.get("ageSeconds")
              print(f"FAIL: 200 con numeri VECCHI (stale, ~{eta}s fa).", file=sys.stderr)
              print("Il Worker sta servendo l'ultimo valore buono: l'hub non risponde.", file=sys.stderr)
              print("I numeri sono veri, il momento no. Guarda Railway e il Tunnel.", file=sys.stderr)
              sys.exit(1)

          print(f"ok: {dati}")
          PY
