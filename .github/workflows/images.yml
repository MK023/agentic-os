name: immagini

# Diviso da validate.yml il 13-08-2026, che era arrivato a 13 job di mestieri
# diversi. **I nomi dei job non sono cambiati**, ed e' la cosa importante: i
# dodici check obbligatori del ruleset `main protetta` (id 19979456) SONO i nomi
# dei job. Rinominarne uno durante la divisione avrebbe lasciato il ruleset ad
# aspettare per sempre un contesto che nessuno produce piu'.
#
# Tutto cio' che si costruisce o si valida come artefatto: le cinque immagini
# con la scansione CVE e il validate della config del Collector, la guardia
# sull'utente non-root, e lo schema del compose.
#
# Nessun filtro `paths`, di proposito: un check obbligatorio che non parte per un
# filtro lascia la PR in attesa per sempre invece di passare. Si puo' aggiungere,
# ma serve un job "skip" che riporti successo, ed e' un pezzo di macchinario in
# piu' per risparmiare qualche minuto di runner gratuito.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di
# workflow lo regala anche ai job che il repository non lo leggono mai; con la
# mappa vuota ogni permesso qui sotto e' una riga che qualcuno ha dovuto
# scrivere apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE. Con il gruppo condiviso di prima, un push avrebbe
  # cancellato i run degli altri quattro workflow, e un check obbligatorio
  # cancellato non e' ne' rosso ne' verde: resta appeso.
  group: immagini-${{ github.ref }}
  cancel-in-progress: true

# Nessuno step `run:` interpola espressioni ${{ }}: le uniche sono in `if:` e
# in mappe `env:`, quindi non c'e' superficie di template injection. Lo impone
# zizmor, nel job workflow-lint (lint.yml).
jobs:
  # Builds every image the platform will build. The four Railway Dockerfiles copy
  # configuration out of docker/, so a moved or renamed config file breaks them —
  # and that breakage would otherwise surface as a failed deploy rather than a
  # failed check. Also builds the status API image, which is where the hash-locked
  # install actually gets exercised.
  images:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Ritenta: il primo fallimento non deterministico di questa pipeline è stato un
      # `TLS handshake timeout` verso auth.docker.io mentre si scaricava un'immagine
      # base (29-07). Non è il nostro codice, ma un gate che fallisce a caso smette
      # di essere un segnale — o si rende resiliente o si toglie.
      # Tre tentativi con attesa crescente. Se diventasse frequente, il passo
      # successivo è specchiare le immagini base su GHCR e smettere di dipendere dal
      # rate limit anonimo di Docker Hub.
      - name: build delle immagini (con ritentata sui fallimenti di rete)
        run: |
          # -e, non solo -uo: senza, l'esito dello step e' quello dell'ULTIMO comando
          # (la build di status-api), e un fallimento di otel-collector, prometheus,
          # grafana o cloudflared lasciava lo step VERDE. Oggi verrebbe intercettato
          # comunque, ma per caso e nel posto sbagliato — gli step Trivy successivi
          # citano tag che non esisterebbero. Il giorno che si aggiunge un'immagine
          # senza uno step a valle che la nomini, quel fallimento diventa muto.
          #
          # La funzione di ritentata usa `if docker build ...; then`, che -e non
          # altera: nessun altro comportamento cambia.
          set -euo pipefail
          costruisci() {
            for tentativo in 1 2 3; do
              if docker build "$@"; then return 0; fi
              echo "tentativo ${tentativo} fallito, riprovo tra $((tentativo * 15))s" >&2
              sleep $((tentativo * 15))
            done
            return 1
          }
          for servizio in otel-collector prometheus grafana cloudflared; do
            costruisci -f "railway/${servizio}/Dockerfile" -t "agentic-${servizio}:ci" .
          done
          costruisci -t agentic-status-api:ci services/public-status-api

      # `docker compose config` NON valida questo file, e non è una svista: compose
      # conosce il proprio schema, non quello del Collector — quella config è solo un
      # file montato dentro un container. Finora nessun gate la leggeva, quindi un
      # errore lì passava tutti i check e moriva al deploy.
      # Il caso che l'ha motivato: `service::telemetry::metrics::address` è IGNORATA
      # dalla v0.123.0. Non è un errore di sintassi, quindi niente si sarebbe
      # lamentato — il Collector sarebbe partito con la porta chiusa e la metrica
      # semplicemente non sarebbe esistita.
      # Gira sull'immagine appena costruita: valida ESATTAMENTE il file che viene
      # spedito, con esattamente la versione che lo eseguirà.
      # Le immagini erano pinnate e mai guardate: sapevamo esattamente quale
      # versione gira, non se ha CVE noti. Pinnare risponde alla riproducibilita',
      # non all'esposizione.
      #
      # Bloccante SOLO sull'immagine che componiamo noi. La prima versione di
      # questo gate falliva su tutte e cinque con `ignore-unfixed`, e al primo
      # run e' andata rossa su 15 HIGH dentro grafana 13.1.3 (tempo, stdlib Go
      # 1.26.3, x/net, x/text). Sono veri e hanno un fix **nei moduli Go a
      # monte**, non in una release di Grafana installabile: il gate sarebbe
      # rimasto rosso per settimane, e un gate perennemente rosso diventa un
      # `continue-on-error` con passaggi extra.
      #
      # La distinzione utile non e' "il CVE ha un fix" ma "possiamo agire":
      # su status-api si aggiorna la base o una dipendenza, sulle immagini di
      # terzi l'unica leva e' aggiornare l'immagine, che e' gia' il mestiere di
      # Dependabot. Quindi quelle si scansionano e si leggono, non bloccano.
      # `vuln-type: library` — le dipendenze Python, le uniche che scegliamo noi.
      # Un CVE li si chiude modificando requirements.in e ricompilando il lockfile.
      # Oggi sono tutte a zero: fastapi, httpx, pydantic, uvicorn, l'intero albero.
      - name: CVE delle dipendenze Python di status-api (bloccante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: library
          exit-code: "1"
          format: table

      # I pacchetti di sistema di `python:3.14.0-slim` ricadono nella stessa
      # categoria delle immagini di terzi qui sotto: non li installiamo noi e
      # l'unica leva e' cambiare il tag della base. Al 13/08 sono 25 HIGH con fix
      # in Debian ma non ancora in un tag pubblicato. Visibili, non bloccanti.
      - name: CVE del sistema operativo di status-api (informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os
          exit-code: "0"
          format: table

      - name: CVE dell'immagine otel-collector (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-otel-collector:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine prometheus (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-prometheus:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine grafana (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-grafana:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine cloudflared (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-cloudflared:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Il Collector ha il suo `validate` qui sotto dal primo giorno; Prometheus non
      # aveva niente. E il test promtool era il caso peggiore: il file porta in cima
      # l'istruzione per eseguirlo — "promtool test rules scripts/..." — e nessuno lo
      # eseguiva. La CI ne confrontava le TARIFFE (gate della #75) senza mai lanciarlo,
      # quindi una query rotta dentro quel file sarebbe rimasta rotta in silenzio. Un
      # test che spiega come eseguirsi e non viene eseguito e' documentazione, non un
      # test: e' la stessa forma di "un commento non e' un gate", applicata a un file
      # che sembrava gia' un controllo.
      #
      # Col binario della nostra immagine, non con uno scaricato: e' lo stesso
      # principio del validate del Collector.
      - name: la config di Prometheus e il test promtool girano davvero
        run: |
          set -euo pipefail
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            agentic-prometheus:ci check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/scripts:/scripts:ro" \
            agentic-prometheus:ci test rules /scripts/cost-per-session.promql-test.yml

      - name: validate della config del Collector (col binario che la eseguirà)
        env:
          OTLP_INGEST_TOKEN: dummy
        run: |
          docker run --rm -e OTLP_INGEST_TOKEN agentic-otel-collector:ci \
            validate --config=/etc/otelcol-contrib/config.yaml

  # Guardia sulla deroga. Il servizio prometheus gira come root SU RAILWAY, via
  # RAILWAY_RUN_UID=0, perché il volume montato è di proprietà di root — deroga
  # unica, misurata e scritta in docs/DECISIONS.md. Questo job impedisce che
  # diventi un'abitudine: un Dockerfile nuovo senza USER, o un USER 0 messo per
  # far sparire un errore di permessi, fallisce qui.
  image-users:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: bash scripts/check-image-users.sh

  compose:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
          STATUS_API_TOKEN: dummy
          OTLP_INGEST_TOKEN: dummy
          SENTRY_DSN: ""

      # La coppia inseparabile: la finestra dei tre numeri sta NELLE QUERY
      # (max_over_time), e `metric_expiration` deve restare corto.
      #
      # Sta qui e non fra i test del Python perche' le due meta' vivono in file di
      # servizi diversi: nessuna suite le vede insieme. Senza questo passo, un
      # ritorno a `metric_expiration: 25h` passerebbe tutti e dodici i gate — le
      # query sono asserite in test_main.py, l'expiration non era asserita da
      # nessuna parte. Il 14-08-2026 quella meta' e' stata cambiata senza rete.
      #
      # Rialzare l'expiration a ore sotto una finestra di 25h non sotto-conta:
      # SOVRA-conta, perche' il Collector continua a ri-esportare una sessione che
      # la query gia' vede nel TSDB e la finestra effettiva diventa ~50h.
      - name: la finestra sta nelle query, non nell'expiration
        run: |
          set -euo pipefail
          exp=$(awk '/^[[:space:]]*metric_expiration:/ {print $2; exit}' docker/otel-collector-config.yaml)
          case "$exp" in
            "")     echo "::error::metric_expiration non trovato in docker/otel-collector-config.yaml"; exit 1 ;;
            *s|*m)  echo "metric_expiration=$exp — corto, corretto" ;;
            *)      echo "::error::metric_expiration=$exp: a ore o giorni si somma alla finestra della query (~50h). Deve restare secondi o minuti."; exit 1 ;;
          esac
          # Tutte e tre le query, non una: mezza modifica farebbe divergere i numeri
          # pubblici da se stessi.
          n=$(grep -c 'max_over_time(claude_code' services/public-status-api/main.py)
          [ "$n" -eq 3 ] || { echo "::error::main.py ha $n query con max_over_time, ne servono 3"; exit 1; }
          grep -q 'max_over_time(claude_code' docker/grafana/dashboards/claude-code.json \
            || { echo "::error::la dashboard Grafana ha perso max_over_time: mostrerebbe numeri diversi dall'API"; exit 1; }

          # I NOMI, non solo la finestra. I nomi delle metriche sono prevedibili solo
          # grazie a `translation_strategy: UnderscoreEscapingWithoutSuffixes`: la
          # strategia predefinita appende tipo e unita' e li farebbe diventare
          # `claude_code_token_usage_tokens_total`. Cambiata quella, le tre query non
          # corrispondono piu' a niente, /status risponde 200 con tre zeri, e la
          # compensazione scritta in BLOCKERS ("i numeri sono diversi da zero") la
          # nota solo se qualcuno guarda. Il Collector nomina le metriche solo nei
          # commenti, quindi la meta' da sorvegliare e' la strategia.
          strategia=$(awk -F': *' '/^[[:space:]]*translation_strategy:/ {print $2; exit}' docker/otel-collector-config.yaml)
          [ "$strategia" = "UnderscoreEscapingWithoutSuffixes" ] || {
            echo "::error::translation_strategy=$strategia: con un'altra strategia i nomi prendono i suffissi di tipo e unita' e le tre query di main.py non trovano piu' nulla."; exit 1; }
          for metrica in claude_code_session_count claude_code_token_usage; do
            grep -q "$metrica" services/public-status-api/main.py || {
              echo "::error::main.py non usa piu' $metrica: i nomi vivono in tre posti e questo e' uno."; exit 1; }
          done

      # Il test promtool esiste per mettere alla prova il pannello del costo per
      # sessione, quindi deve portare le SUE tariffe. Il file diceva gia' "rieseguimi
      # quando cambia il prezzario": non e' bastato. La #66 ha alzato cacheCreation da
      # 1.25x a 2x dell'input in main.py e nella dashboard, e qui sono rimaste le
      # vecchie per due giorni senza che niente diventasse rosso — il test passa lo
      # stesso perche' esercita solo opus input/output e haiku cacheRead, cioe' non
      # valuta mai i moltiplicatori sbagliati che si porta dietro.
      #
      # Un test con dentro tariffe stale che non asserisce mai e' peggio di un test
      # assente: chi lo legge prende quei numeri per buoni. Un commento non e' un gate.
      - name: le tariffe del test promtool sono quelle del pannello
        run: |
          python3 - <<'PY'
          import json, re, sys
          dash = json.load(open("docker/grafana/dashboards/claude-code.json"))
          pannello = next(p for p in dash["panels"] if "sessione" in p.get("title", "").lower())
          attese = sorted(set(re.findall(r"\* ([0-9.]+)", pannello["targets"][0]["expr"])), key=float)
          trovate = sorted(set(re.findall(r"\* ([0-9.]+)", open("scripts/cost-per-session.promql-test.yml").read())), key=float)
          # Il TERZO posto, che il messaggio d'errore qui sotto nominava gia' e che il
          # gate non guardava: la tabella in main.py e' quella che PRODUCE il numero
          # pubblico. E' dato a livello di modulo, quindi la copertura la vede al
          # 100% e mutmut non genera mutanti per una costante: un prezzo sbagliato li'
          # non fa diventare rosso niente. E' la #66/#75 spostata di un file.
          tabella = re.search(r"PRICES_USD_PER_MTOK = \{.*?\n\}", open("services/public-status-api/main.py").read(), re.S)
          if not tabella:
              print("::error::PRICES_USD_PER_MTOK non trovata in main.py: il gate sta guardando il file sbagliato")
              sys.exit(1)
          da_codice = sorted({v.rstrip("0").rstrip(".") or "0" for v in re.findall(r":\s*([0-9]+\.[0-9]+)", tabella.group(0))}, key=float)

          if attese != trovate or attese != da_codice:
              print(f"::error::le tariffe divergono. Pannello: {attese} — test: {trovate} — main.py: {da_codice}. "
                    "Il prezzario vive in tre posti (main.py, la dashboard, questo test): cambiarne uno solo li fa mentire.")
              sys.exit(1)
          print(f"tariffe allineate nei tre posti: {trovate}")
          PY

      # Stessa famiglia del gate qui sopra, ma le meta' sono TRE, e questo gate e'
      # nato sbagliando proprio quello: scritto per confrontare Dockerfile e compose,
      # ignorava il pannello Grafana — che nello stesso commit era rimasto a 300MB ed
      # e' l'unica cosa che GUARDA questo guasto. Un cap di retention vive in
      # railway/prometheus/Dockerfile (produzione), docker/docker-compose.yml (locale)
      # e nelle soglie del pannello "Blocchi TSDB su disco". Il compose prometteva a
      # parole di essere allineato alla produzione: vero quando scritto, e non
      # dipendeva da niente per restare vero. Un commento non e' un gate.
      #
      # Il pannello sarebbe andato in rosso PERMANENTE dal sesto giorno su un hub
      # sano — cioe' il modo piu' efficace di insegnare a ignorarlo.
      # Un COPY che non compare nei watchPatterns del suo railway.json significa che
      # Railway NON ricostruisce quel servizio quando quel file cambia: la modifica
      # entra in main verde e la produzione resta indietro, in silenzio.
      #
      # NON e' il guasto del 13-08-2026, e vale la pena non spacciarlo per tale: li'
      # la causa fu una build cancellata da un push successivo il cui commit mancava
      # i watchPatterns di quel servizio — accoppiamento fra scope del COMMIT e
      # watchPatterns, non fra COPY e watchPatterns. E' un buco vicino, e vero, ma un
      # altro. Questo gate chiude questo.
      - name: ogni COPY e' coperto dai watchPatterns del suo servizio
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys

          # Railway documenta i watch paths come "gitignore-style patterns". fnmatch
          # NON lo e', e sbaglia tre volte tutte in direzione "approva": il suo `*`
          # attraversa `/`, ignora la negazione `!`, e non riconosce la forma
          # radicata `/src/**` che la doc del vendor usa negli esempi (la darebbe per
          # non corrispondente, rendendo ROSSO un config corretto). Qui si traduce a
          # mano, e cio' che non si sa tradurre si RIFIUTA invece di indovinarlo.
          def regex(pattern: str) -> re.Pattern:
              if pattern.startswith("!"):
                  sys.exit(f"::error::watchPattern {pattern!r}: la negazione non e' modellata "
                           "da questo gate, che leggerebbe la copertura al contrario. "
                           "Il gate si ferma invece di approvare.")
              corpo = pattern.lstrip("/")
              if corpo.endswith("/"):
                  corpo += "**"
              pezzi, i = [], 0
              while i < len(corpo):
                  if corpo.startswith("**/", i):
                      pezzi.append("(?:.*/)?"); i += 3
                  elif corpo.startswith("**", i):
                      pezzi.append(".*"); i += 2
                  elif corpo[i] == "*":
                      pezzi.append("[^/]*"); i += 1
                  elif corpo[i] == "?":
                      pezzi.append("[^/]"); i += 1
                  else:
                      pezzi.append(re.escape(corpo[i])); i += 1
              # Una regola che corrisponde a una directory copre il suo contenuto.
              return re.compile("^" + "".join(pezzi) + "(?:/.*)?$")

          def coperto(percorso, patterns):
              return any(regex(p).match(percorso) for p in patterns)

          def sorgenti_copy(testo: str) -> list[str]:
              # I flag vanno tolti PRIMA, non esclusi con un lookahead: `\s+` non
              # torna indietro, quindi `COPY --chown=... src dst` non corrispondeva
              # affatto e il file spariva dal gate. Stessa cosa per --link, --parents,
              # --exclude. E le sorgenti sono tutte tranne l'ultima: `COPY a.py b.py
              # ./` ne controllava solo una.
              trovate = []
              for riga in testo.splitlines():
                  m = re.match(r"^\s*(COPY|ADD)\s+(.*)$", riga, re.IGNORECASE)
                  if not m:
                      continue
                  resto = m.group(2)
                  flag = re.findall(r"(--\S+)", resto)
                  if any(f.startswith("--from=") for f in flag):
                      continue  # sorgente in un'altra stage, non un file del repo
                  resto = re.sub(r"--\S+\s*", "", resto).strip()
                  pezzi = resto.split()
                  if len(pezzi) >= 2:
                      trovate.extend(pezzi[:-1])
              return trovate

          servizi = sorted(pathlib.Path("railway").glob("*/railway.json"))
          if not servizi:
              sys.exit("::error::nessun railway.json trovato: gate che passerebbe sempre")

          problemi = []
          for config in servizi:
              dati = json.loads(config.read_text()).get("build", {})
              patterns = dati.get("watchPatterns", [])
              if not patterns:
                  problemi.append(f"{config.parent.name}: nessun watchPattern")
                  continue

              # Validati TUTTI e subito, non durante il confronto: `any()` va in corto
              # circuito sul primo pattern che corrisponde, quindi un `!docker/**`
              # messo dopo un `**` non veniva mai nemmeno compilato e il rifiuto non
              # scattava. Il gate approvava esattamente il caso che dice di rifiutare.
              for pattern in patterns:
                  regex(pattern)

              percorso_dockerfile = dati.get("dockerfilePath")
              if percorso_dockerfile:
                  dockerfile, contesto = pathlib.Path(percorso_dockerfile), pathlib.Path(".")
              else:
                  radice = patterns[0].split("*")[0].rstrip("/")
                  dockerfile, contesto = pathlib.Path(radice) / "Dockerfile", pathlib.Path(radice)

              if not dockerfile.exists():
                  problemi.append(f"{config.parent.name}: {dockerfile} non esiste")
                  continue

              for sorgente in sorgenti_copy(dockerfile.read_text()):
                  percorso = sorgente if str(contesto) == "." else str(contesto / sorgente)
                  # Se la sorgente e' una directory, cio' che cambia sono i file
                  # DENTRO: si prova un discendente, non la directory stessa.
                  da_provare = percorso + "/__sonda__" if pathlib.Path(percorso).is_dir() else percorso
                  if not coperto(da_provare, patterns):
                      problemi.append(f"{config.parent.name}: COPY {sorgente} -> {da_provare} "
                                      f"non coperto da {patterns}")
              if not coperto(str(dockerfile), patterns):
                  problemi.append(f"{config.parent.name}: {dockerfile} non e' coperto da {patterns}")

          if problemi:
              print("::error::un COPY non sorvegliato significa che Railway NON ricostruisce "
                    "il servizio quando quel file cambia: la modifica entra in main verde e la "
                    "produzione resta indietro.")
              for problema in problemi:
                  print(f"::error::{problema}")
              sys.exit(1)
          print(f"watchPatterns coerenti con i COPY per {len(servizi)} servizi")
          PY

      # Checkov copre i Dockerfile (CKV_DOCKER_7 sul pinning) e i workflow, ma NON
      # docker/docker-compose.yml: `docker_compose` non e' un framework che Checkov
      # abbia — l'elenco valido va da `ansible` a `terraform` e non lo contiene — e
      # scripts/check-image-users.sh legge solo `USER`, mai `FROM`. La regola "ogni
      # immagine pinnata, mai :latest" era quindi applicata ai Dockerfile e a NIENTE
      # per il compose.
      - name: le immagini del compose sono pinnate e non divergono dai Dockerfile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def riferimento(grezzo: str) -> tuple[str, str]:
              """(nome, tag) da un riferimento immagine. Solleva se non e' pinnato.

              Le virgolette si tolgono: `image: 'prom/prometheus:latest'` e' YAML
              legale — ed e' cio' che un autoformattatore produce — e la versione
              precedente di questo gate leggeva il tag come `latest'`, che non e'
              uguale a `latest`, quindi lo APPROVAVA. Il tag si separa dall'ultimo
              segmento del path e non dal primo `:` incontrato, altrimenti la porta
              di un registry (`registry.local:5000/prom/prometheus`) veniva scambiata
              per un tag e un'immagine senza versione passava per pinnata.
              """
              pulito = grezzo.strip().strip("\"'")
              if "@" in pulito:  # digest: pinnato per definizione, e piu' forte di un tag
                  return pulito.split("@", 1)[0], pulito.split("@", 1)[1]
              testa, _, coda = pulito.rpartition("/")
              nome_corto, sep, tag = coda.partition(":")
              if not sep or not tag:
                  raise ValueError(f"{pulito} non e' pinnata a una versione")
              if tag == "latest":
                  raise ValueError(f"{pulito} usa il tag mobile :latest")
              return (f"{testa}/{nome_corto}" if testa else nome_corto), tag

          compose = pathlib.Path("docker/docker-compose.yml").read_text()
          grezze = re.findall(r"^\s*image:\s*(\S+)", compose, re.MULTILINE)
          if not grezze:
              sys.exit("::error::nessuna `image:` nel compose: gate che passerebbe sempre")

          da_compose = {}
          for grezzo in grezze:
              try:
                  nome, tag = riferimento(grezzo)
              except ValueError as errore:
                  sys.exit(f"::error::{errore}")
              da_compose[nome] = tag

          dockerfiles = sorted(pathlib.Path("railway").glob("*/Dockerfile"))
          if not dockerfiles:
              sys.exit("::error::nessun Dockerfile sotto railway/: gate che passerebbe sempre")

          non_confrontati = []
          for dockerfile in dockerfiles:
              basi = re.findall(r"^FROM\s+(?:--\S+\s+)*(\S+)", dockerfile.read_text(), re.MULTILINE)
              if not basi:
                  sys.exit(f"::error::{dockerfile} non ha un FROM leggibile")
              # L'ULTIMO FROM e' l'immagine finale: su un multi-stage il primo e' il
              # builder, e confrontare quello direbbe la cosa sbagliata.
              try:
                  nome, tag = riferimento(basi[-1])
              except ValueError as errore:
                  sys.exit(f"::error::{dockerfile}: {errore}")
              if nome not in da_compose:
                  non_confrontati.append(f"{dockerfile} usa {nome}, che il compose non nomina")
              elif da_compose[nome] != tag:
                  sys.exit(f"::error::{nome}: il compose dice {da_compose[nome]}, {dockerfile} "
                           f"dice {tag}. Locale e produzione divergono.")

          # Senza questo, rinominare o togliere un'immagine dal compose rendeva il
          # confronto un no-op silenzioso: il gate passava senza aver confrontato
          # niente. Vale la stessa regola del pavimento sul gate di mutation.
          if non_confrontati:
              print("::error::un'immagine di produzione non confrontata con il compose significa "
                    "che locale e produzione possono divergere senza che nulla lo veda.")
              for problema in non_confrontati:
                  print(f"::error::{problema}")
              sys.exit(1)

          print(f"immagini pinnate e allineate: {sorted(da_compose)}")
          PY
      # Prometheus non ha autenticazione CONFIGURATA (ne supporta — vedi SECURITY.md —
      # semplicemente non la accendiamo) ed e' raggiungibile da tutta la rete privata
      # del progetto. In quelle condizioni una sola parola nel CMD cambia il confine:
      # --web.enable-admin-api sblocca /api/v1/admin/tsdb/delete_series, cioe'
      # cancellazione di serie e snapshot da parte di chiunque, senza credenziali;
      # --web.enable-lifecycle sblocca /-/quit, cioe' lo spegnimento remoto del
      # componente che non ha ridondanza; i due receiver scrivono DIRETTAMENTE nel
      # TSDB scavalcando il Collector, e con lui l'allow-list che tiene fuori
      # user.email. Verificato sul binario v3.13.2: tutti e quattro sono `false` di
      # default, quindi oggi la postura e' giusta per OMISSIONE. Questo la rende una
      # decisione.
      #
      # La tentazione e' concreta e ha gia' un movente: il modo documentato per
      # recuperare spazio nel TSDB e' proprio l'admin API, e il volume si e' riempito
      # due volte. Il momento in cui qualcuno la accendera' e' un'emergenza, che e'
      # esattamente quando nessuno rilegge il confine di sicurezza.
      - name: prometheus non accende endpoint che non sa autenticare
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          dockerfile = pathlib.Path("railway/prometheus/Dockerfile")
          testo = dockerfile.read_text()
          cmd = re.search(r"^CMD \[(.*?)\]", testo, re.S | re.MULTILINE)
          if not cmd:
              sys.exit(f"::error::{dockerfile} non ha un CMD leggibile: gate cieco")

          vietati = [f for f in re.findall(r"--[a-z.\-]+", cmd.group(1)) if f.startswith("--web.")]
          if vietati:
              print("::error::Prometheus non ha autenticazione configurata ed e' raggiungibile "
                    "da tutta la rete privata: un endpoint --web.* lo espone a chiunque ci stia "
                    "dentro, senza credenziali.")
              for flag in vietati:
                  print(f"::error::{dockerfile}: {flag}")
              print("::error::Se serve davvero, va deciso in DECISIONS.md e questo gate va "
                    "cambiato nello stesso commit — non aggirato durante un incidente.")
              sys.exit(1)
          print("nessun endpoint --web.* acceso su prometheus")
          PY

      - name: il cap di retention e' lo stesso nei tre posti che lo dichiarano
        run: |
          python3 - <<'PY'
          import json, re, sys

          def flag(percorso, chiave):
              # Solo righe non commentate: un `# - --storage...=3GB` lasciato sopra a
              # un flag cambiato verrebbe letto come se fosse quello attivo, e il gate
              # passerebbe su una divergenza vera.
              for riga in open(percorso):
                  if riga.lstrip().startswith("#"):
                      continue
                  trovato = re.search(rf"--storage\.tsdb\.retention\.{chiave}=([^\"'\s\\]+)", riga)
                  if trovato:
                      return trovato.group(1)
              sys.exit(f"::error::{percorso} non dichiara --storage.tsdb.retention.{chiave}")

          prod = {c: flag("railway/prometheus/Dockerfile", c) for c in ("time", "size")}
          locale = {c: flag("docker/docker-compose.yml", c) for c in ("time", "size")}
          if prod != locale:
              sys.exit(f"::error::retention divergente. Produzione: {prod} — locale: {locale}. "
                       "I due file sono due meta' della stessa decisione: si cambiano insieme.")

          # `3GB` per Prometheus e' powers-of-2 ("Based on powers-of-2, so 1KB is 1024B").
          unita = {"KB": 1024, "MB": 1024**2, "GB": 1024**3, "TB": 1024**4}
          numero, simbolo = re.fullmatch(r"([0-9.]+)([KMGT]B)", prod["size"]).groups()
          cap = float(numero) * unita[simbolo]

          dash = json.load(open("docker/grafana/dashboards/claude-code.json"))
          pannello = next(p for p in dash["panels"] if p["title"].startswith("Blocchi TSDB"))
          passi = pannello["fieldConfig"]["defaults"]["thresholds"]["steps"]
          atteso = {"giallo": round(cap * 0.80), "rosso": round(cap * 0.95)}
          trovato = {"giallo": passi[1]["value"], "rosso": passi[2]["value"]}
          if atteso != trovato:
              sys.exit(f"::error::le soglie del pannello non sono ancorate al cap {prod['size']}. "
                       f"Attese {atteso}, trovate {trovato}: il pannello che sorveglia il disco "
                       "andrebbe in rosso su un hub sano, ed e' cosi' che si insegna a ignorarlo.")
          if prod["size"] not in pannello["title"]:
              sys.exit(f"::error::il titolo del pannello non dice {prod['size']}: {pannello['title']!r}")

          print(f"retention allineata nei tre posti: {prod}")
          PY
