name: immagini

# Diviso da validate.yml il 13-08-2026, che era arrivato a 13 job di mestieri
# diversi. **I nomi dei job non sono cambiati**, ed e' la cosa importante: i
# dodici check obbligatori del ruleset `main protetta` (id 19979456) SONO i nomi
# dei job. Rinominarne uno durante la divisione avrebbe lasciato il ruleset ad
# aspettare per sempre un contesto che nessuno produce piu'.
#
# Tutto cio' che si costruisce o si valida come artefatto: le sei immagini
# con la scansione CVE e il validate della config del Collector, la guardia
# sull'utente non-root, e lo schema del compose.
#
# Nessun filtro `paths`, di proposito: un check obbligatorio che non parte per un
# filtro lascia la PR in attesa per sempre invece di passare. Si puo' aggiungere,
# ma serve un job "skip" che riporti successo, ed e' un pezzo di macchinario in
# piu' per risparmiare qualche minuto di runner gratuito.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deny by default, concesso job per job. Un `contents: read` a livello di
# workflow lo regala anche ai job che il repository non lo leggono mai; con la
# mappa vuota ogni permesso qui sotto e' una riga che qualcuno ha dovuto
# scrivere apposta.
permissions: {}

concurrency:
  # Un gruppo PER FILE. Con il gruppo condiviso di prima, un push avrebbe
  # cancellato i run degli altri quattro workflow, e un check obbligatorio
  # cancellato non e' ne' rosso ne' verde: resta appeso.
  group: immagini-${{ github.ref }}
  cancel-in-progress: true

# Nessuno step `run:` interpola espressioni ${{ }}: le uniche sono in `if:` e
# in mappe `env:`, quindi non c'e' superficie di template injection. Lo impone
# zizmor, nel job workflow-lint (lint.yml).
jobs:
  # Builds every image the platform will build. The five Railway Dockerfiles copy
  # configuration out of docker/, so a moved or renamed config file breaks them —
  # and that breakage would otherwise surface as a failed deploy rather than a
  # failed check. Also builds the status API image, which is where the hash-locked
  # install actually gets exercised.
  images:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      # Ritenta: il primo fallimento non deterministico di questa pipeline è stato un
      # `TLS handshake timeout` verso auth.docker.io mentre si scaricava un'immagine
      # base (29-07). Non è il nostro codice, ma un gate che fallisce a caso smette
      # di essere un segnale — o si rende resiliente o si toglie.
      # Tre tentativi con attesa crescente. Se diventasse frequente, il passo
      # successivo è specchiare le immagini base su GHCR e smettere di dipendere dal
      # rate limit anonimo di Docker Hub.
      - name: build delle immagini (con ritentata sui fallimenti di rete)
        run: |
          # -e, non solo -uo: senza, l'esito dello step e' quello dell'ULTIMO comando
          # (la build di status-api), e un fallimento di otel-collector, prometheus,
          # grafana o cloudflared lasciava lo step VERDE. Oggi verrebbe intercettato
          # comunque, ma per caso e nel posto sbagliato — gli step Trivy successivi
          # citano tag che non esisterebbero. Il giorno che si aggiunge un'immagine
          # senza uno step a valle che la nomini, quel fallimento diventa muto.
          #
          # La funzione di ritentata usa `if docker build ...; then`, che -e non
          # altera: nessun altro comportamento cambia.
          set -euo pipefail
          costruisci() {
            for tentativo in 1 2 3; do
              if docker build "$@"; then return 0; fi
              echo "tentativo ${tentativo} fallito, riprovo tra $((tentativo * 15))s" >&2
              sleep $((tentativo * 15))
            done
            return 1
          }
          for servizio in otel-collector prometheus grafana cloudflared loki; do
            costruisci -f "railway/${servizio}/Dockerfile" -t "agentic-${servizio}:ci" .
          done
          costruisci -t agentic-status-api:ci services/public-status-api

      # `docker compose config` NON valida questo file, e non è una svista: compose
      # conosce il proprio schema, non quello del Collector — quella config è solo un
      # file montato dentro un container. Finora nessun gate la leggeva, quindi un
      # errore lì passava tutti i check e moriva al deploy.
      # Il caso che l'ha motivato: `service::telemetry::metrics::address` è IGNORATA
      # dalla v0.123.0. Non è un errore di sintassi, quindi niente si sarebbe
      # lamentato — il Collector sarebbe partito con la porta chiusa e la metrica
      # semplicemente non sarebbe esistita.
      # Gira sull'immagine appena costruita: valida ESATTAMENTE il file che viene
      # spedito, con esattamente la versione che lo eseguirà.
      # Le immagini erano pinnate e mai guardate: sapevamo esattamente quale
      # versione gira, non se ha CVE noti. Pinnare risponde alla riproducibilita',
      # non all'esposizione.
      #
      # Bloccante SOLO sull'immagine che componiamo noi. La prima versione di
      # questo gate falliva su tutte e cinque con `ignore-unfixed`, e al primo
      # run e' andata rossa su 15 HIGH dentro grafana 13.1.3 (tempo, stdlib Go
      # 1.26.3, x/net, x/text). Sono veri e hanno un fix **nei moduli Go a
      # monte**, non in una release di Grafana installabile: il gate sarebbe
      # rimasto rosso per settimane, e un gate perennemente rosso diventa un
      # `continue-on-error` con passaggi extra.
      #
      # La distinzione utile non e' "il CVE ha un fix" ma "possiamo agire":
      # su status-api si aggiorna la base o una dipendenza, sulle immagini di
      # terzi l'unica leva e' aggiornare l'immagine, che e' gia' il mestiere di
      # Dependabot. Quindi quelle si scansionano e si leggono, non bloccano.
      # `vuln-type: library` — le dipendenze Python, le uniche che scegliamo noi.
      # Un CVE li si chiude modificando requirements.in e ricompilando il lockfile.
      # Oggi sono tutte a zero: fastapi, httpx, pydantic, uvicorn, l'intero albero.
      - name: CVE delle dipendenze Python di status-api (bloccante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: library
          exit-code: "1"
          format: table

      # I pacchetti di sistema di `python:3.14.7-slim` ricadono nella stessa
      # categoria delle immagini di terzi qui sotto: non li installiamo noi e
      # l'unica leva e' cambiare il tag della base. Erano 25 HIGH al 13/08 su
      # 3.14.0; misurati 9 il 20/08 dopo il salto a 3.14.7 — la leva funziona,
      # ma arriva quando il tag esce, non quando esce il fix Debian. Visibili,
      # non bloccanti.
      - name: CVE del sistema operativo di status-api (informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-status-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os
          exit-code: "0"
          format: table

      - name: CVE dell'immagine otel-collector (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-otel-collector:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine prometheus (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-prometheus:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine grafana (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-grafana:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine cloudflared (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-cloudflared:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: CVE dell'immagine loki (informativo — immagine di terzi)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-loki:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Il Collector ha il suo `validate` qui sotto dal primo giorno; Prometheus non
      # aveva niente. E il test promtool era il caso peggiore: il file porta in cima
      # l'istruzione per eseguirlo — "promtool test rules scripts/..." — e nessuno lo
      # eseguiva. La CI ne confrontava le TARIFFE (gate della #75) senza mai lanciarlo,
      # quindi una query rotta dentro quel file sarebbe rimasta rotta in silenzio. Un
      # test che spiega come eseguirsi e non viene eseguito e' documentazione, non un
      # test: e' la stessa forma di "un commento non e' un gate", applicata a un file
      # che sembrava gia' un controllo.
      #
      # Col binario della nostra immagine, non con uno scaricato: e' lo stesso
      # principio del validate del Collector.
      - name: la config di Prometheus e il test promtool girano davvero
        run: |
          set -euo pipefail
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            agentic-prometheus:ci check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/scripts:/scripts:ro" \
            agentic-prometheus:ci test rules /scripts/cost-per-session.promql-test.yml

      - name: validate della config del Collector (col binario che la eseguirà)
        env:
          OTLP_INGEST_TOKEN: dummy
        run: |
          docker run --rm -e OTLP_INGEST_TOKEN agentic-otel-collector:ci \
            validate --config=/etc/otelcol-contrib/config.yaml

  # Guardia sulla deroga. Il servizio prometheus gira come root SU RAILWAY, via
  # RAILWAY_RUN_UID=0, perché il volume montato è di proprietà di root — deroga
  # unica, misurata e scritta in docs/DECISIONS.md. Questo job impedisce che
  # diventi un'abitudine: un Dockerfile nuovo senza USER, o un USER 0 messo per
  # far sparire un errore di permessi, fallisce qui.
  image-users:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: bash scripts/check-image-users.sh

  compose:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nessun push dalla CI: lasciare il token in .git/config allarga
          # solo il raggio di un eventuale compromesso di uno step successivo.
          persist-credentials: false
      - run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          CLOUDFLARE_TUNNEL_TOKEN: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
          STATUS_API_TOKEN: dummy
          OTLP_INGEST_TOKEN: dummy
          SENTRY_DSN: ""
          LOKI_R2_BUCKET: dummy
          LOKI_R2_ENDPOINT: dummy
          LOKI_R2_ACCESS_KEY_ID: dummy
          LOKI_R2_SECRET_ACCESS_KEY: dummy

      # La coppia inseparabile: la finestra dei tre numeri sta NELLE QUERY
      # (max_over_time), e `metric_expiration` deve restare corto.
      #
      # Sta qui e non fra i test del Python perche' le due meta' vivono in file di
      # servizi diversi: nessuna suite le vede insieme. Senza questo passo, un
      # ritorno a `metric_expiration: 25h` passerebbe tutti e dodici i gate — le
      # query sono asserite in test_main.py, l'expiration non era asserita da
      # nessuna parte. Il 14-08-2026 quella meta' e' stata cambiata senza rete.
      #
      # Rialzare l'expiration a ore sotto una finestra di 25h non sotto-conta:
      # SOVRA-conta, perche' il Collector continua a ri-esportare una sessione che
      # la query gia' vede nel TSDB e la finestra effettiva diventa ~50h.
      - name: la finestra sta nelle query, non nell'expiration
        run: |
          set -euo pipefail
          exp=$(awk '/^[[:space:]]*metric_expiration:/ {print $2; exit}' docker/otel-collector-config.yaml)
          case "$exp" in
            "")     echo "::error::metric_expiration non trovato in docker/otel-collector-config.yaml"; exit 1 ;;
            *s|*m)  echo "metric_expiration=$exp — corto, corretto" ;;
            *)      echo "::error::metric_expiration=$exp: a ore o giorni si somma alla finestra della query (~50h). Deve restare secondi o minuti."; exit 1 ;;
          esac
          # Tutte e tre le query, non una: mezza modifica farebbe divergere i numeri
          # pubblici da se stessi.
          n=$(grep -c 'max_over_time(claude_code' services/public-status-api/main.py)
          [ "$n" -eq 3 ] || { echo "::error::main.py ha $n query con max_over_time, ne servono 3"; exit 1; }
          grep -q 'max_over_time(claude_code' docker/grafana/dashboards/claude-code.json \
            || { echo "::error::la dashboard Grafana ha perso max_over_time: mostrerebbe numeri diversi dall'API"; exit 1; }

          # I NOMI, non solo la finestra. I nomi delle metriche sono prevedibili solo
          # grazie a `translation_strategy: UnderscoreEscapingWithoutSuffixes`: la
          # strategia predefinita appende tipo e unita' e li farebbe diventare
          # `claude_code_token_usage_tokens_total`. Cambiata quella, le tre query non
          # corrispondono piu' a niente, /status risponde 200 con tre zeri, e la
          # compensazione scritta in BLOCKERS ("i numeri sono diversi da zero") la
          # nota solo se qualcuno guarda. Il Collector nomina le metriche solo nei
          # commenti, quindi la meta' da sorvegliare e' la strategia.
          strategia=$(awk -F': *' '/^[[:space:]]*translation_strategy:/ {print $2; exit}' docker/otel-collector-config.yaml)
          [ "$strategia" = "UnderscoreEscapingWithoutSuffixes" ] || {
            echo "::error::translation_strategy=$strategia: con un'altra strategia i nomi prendono i suffissi di tipo e unita' e le tre query di main.py non trovano piu' nulla."; exit 1; }
          for metrica in claude_code_session_count claude_code_token_usage; do
            grep -q "$metrica" services/public-status-api/main.py || {
              echo "::error::main.py non usa piu' $metrica: i nomi vivono in tre posti e questo e' uno."; exit 1; }
          done

      # Il test promtool esiste per mettere alla prova il pannello del costo per
      # sessione, quindi deve portare le SUE tariffe. Il file diceva gia' "rieseguimi
      # quando cambia il prezzario": non e' bastato. La #66 ha alzato cacheCreation da
      # 1.25x a 2x dell'input in main.py e nella dashboard, e qui sono rimaste le
      # vecchie per due giorni senza che niente diventasse rosso — il test passa lo
      # stesso perche' esercita solo opus input/output e haiku cacheRead, cioe' non
      # valuta mai i moltiplicatori sbagliati che si porta dietro.
      #
      # Un test con dentro tariffe stale che non asserisce mai e' peggio di un test
      # assente: chi lo legge prende quei numeri per buoni. Un commento non e' un gate.
      - name: le tariffe del test promtool sono quelle del pannello
        run: |
          python3 - <<'PY'
          import json, re, sys
          dash = json.load(open("docker/grafana/dashboards/claude-code.json"))
          # OGNI pannello che porta tariffe, non il primo con "sessione" nel titolo.
          # La versione precedente ne guardava UNO e dichiarava "allineate nei tre
          # posti": il 2026-08-21 il pannello «Cost USD» e' rimasto a Sonnet 3/15 e
          # senza opus-4-8 mentre quello per-sessione veniva corretto, i due
          # pannelli della STESSA dashboard si contraddicevano, e il gate era verde.
          # Un gate che campiona un'istanza e riferisce sull'insieme e' un gate che
          # non c'e' — ed e' la seconda volta in questo file (la prima:
          # `for servizio in`, che leggeva un commento invece del codice).
          pannelli = [(p["title"], t["expr"]) for p in dash["panels"]
                      for t in (p.get("targets") or []) if re.search(r"\* [0-9.]", t.get("expr", ""))]
          if len(pannelli) < 2:
              print(f"::error::trovati solo {len(pannelli)} pannelli con tariffe: l'insieme si e' svuotato e questo gate non sta guardando niente")
              sys.exit(1)
          per_pannello = {titolo: sorted(set(re.findall(r"\* ([0-9.]+)", e)), key=float) for titolo, e in pannelli}
          if len({tuple(v) for v in per_pannello.values()}) != 1:
              for titolo, tar in per_pannello.items():
                  print(f"::error::{titolo}: {tar}")
              print("::error::due pannelli della stessa dashboard prezzano in modo diverso: uno dei due mente a chi lo guarda.")
              sys.exit(1)
          attese = next(iter(per_pannello.values()))
          trovate = sorted(set(re.findall(r"\* ([0-9.]+)", open("scripts/cost-per-session.promql-test.yml").read())), key=float)
          # Il TERZO posto, che il messaggio d'errore qui sotto nominava gia' e che il
          # gate non guardava: la tabella in main.py e' quella che PRODUCE il numero
          # pubblico. E' dato a livello di modulo, quindi la copertura la vede al
          # 100% e mutmut non genera mutanti per una costante: un prezzo sbagliato li'
          # non fa diventare rosso niente. E' la #66/#75 spostata di un file.
          tabella = re.search(r"PRICES_USD_PER_MTOK = \{.*?\n\}", open("services/public-status-api/main.py").read(), re.S)
          if not tabella:
              print("::error::PRICES_USD_PER_MTOK non trovata in main.py: il gate sta guardando il file sbagliato")
              sys.exit(1)
          da_codice = sorted({v.rstrip("0").rstrip(".") or "0" for v in re.findall(r":\s*([0-9]+\.[0-9]+)", tabella.group(0))}, key=float)

          if attese != trovate or attese != da_codice:
              print(f"::error::le tariffe divergono. Pannello: {attese} — test: {trovate} — main.py: {da_codice}. "
                    "Il prezzario vive in tre posti (main.py, la dashboard, questo test): cambiarne uno solo li fa mentire.")
              sys.exit(1)
          print(f"tariffe allineate nei tre posti: {trovate}")
          PY

      # Stessa famiglia del gate qui sopra, ma le meta' sono TRE, e questo gate e'
      # nato sbagliando proprio quello: scritto per confrontare Dockerfile e compose,
      # ignorava il pannello Grafana — che nello stesso commit era rimasto a 300MB ed
      # e' l'unica cosa che GUARDA questo guasto. Un cap di retention vive in
      # railway/prometheus/Dockerfile (produzione), docker/docker-compose.yml (locale)
      # e nelle soglie del pannello "Blocchi TSDB su disco". Il compose prometteva a
      # parole di essere allineato alla produzione: vero quando scritto, e non
      # dipendeva da niente per restare vero. Un commento non e' un gate.
      #
      # Il pannello sarebbe andato in rosso PERMANENTE dal sesto giorno su un hub
      # sano — cioe' il modo piu' efficace di insegnare a ignorarlo.
      # Un COPY che non compare nei watchPatterns del suo railway.json significa che
      # Railway NON ricostruisce quel servizio quando quel file cambia: la modifica
      # entra in main verde e la produzione resta indietro, in silenzio.
      #
      # NON e' il guasto del 13-08-2026, e vale la pena non spacciarlo per tale: li'
      # la causa fu una build cancellata da un push successivo il cui commit mancava
      # i watchPatterns di quel servizio — accoppiamento fra scope del COMMIT e
      # watchPatterns, non fra COPY e watchPatterns. E' un buco vicino, e vero, ma un
      # altro. Questo gate chiude questo.
      - name: ogni COPY e' coperto dai watchPatterns del suo servizio
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys

          # Railway documenta i watch paths come "gitignore-style patterns". fnmatch
          # NON lo e', e sbaglia tre volte tutte in direzione "approva": il suo `*`
          # attraversa `/`, ignora la negazione `!`, e non riconosce la forma
          # radicata `/src/**` che la doc del vendor usa negli esempi (la darebbe per
          # non corrispondente, rendendo ROSSO un config corretto). Qui si traduce a
          # mano, e cio' che non si sa tradurre si RIFIUTA invece di indovinarlo.
          def regex(pattern: str) -> re.Pattern:
              if pattern.startswith("!"):
                  sys.exit(f"::error::watchPattern {pattern!r}: la negazione non e' modellata "
                           "da questo gate, che leggerebbe la copertura al contrario. "
                           "Il gate si ferma invece di approvare.")
              corpo = pattern.lstrip("/")
              if corpo.endswith("/"):
                  corpo += "**"
              pezzi, i = [], 0
              while i < len(corpo):
                  if corpo.startswith("**/", i):
                      pezzi.append("(?:.*/)?"); i += 3
                  elif corpo.startswith("**", i):
                      pezzi.append(".*"); i += 2
                  elif corpo[i] == "*":
                      pezzi.append("[^/]*"); i += 1
                  elif corpo[i] == "?":
                      pezzi.append("[^/]"); i += 1
                  else:
                      pezzi.append(re.escape(corpo[i])); i += 1
              # Una regola che corrisponde a una directory copre il suo contenuto.
              return re.compile("^" + "".join(pezzi) + "(?:/.*)?$")

          def coperto(percorso, patterns):
              return any(regex(p).match(percorso) for p in patterns)

          def sorgenti_copy(testo: str) -> list[str]:
              # I flag vanno tolti PRIMA, non esclusi con un lookahead: `\s+` non
              # torna indietro, quindi `COPY --chown=... src dst` non corrispondeva
              # affatto e il file spariva dal gate. Stessa cosa per --link, --parents,
              # --exclude. E le sorgenti sono tutte tranne l'ultima: `COPY a.py b.py
              # ./` ne controllava solo una.
              trovate = []
              for riga in testo.splitlines():
                  m = re.match(r"^\s*(COPY|ADD)\s+(.*)$", riga, re.IGNORECASE)
                  if not m:
                      continue
                  resto = m.group(2)
                  flag = re.findall(r"(--\S+)", resto)
                  if any(f.startswith("--from=") for f in flag):
                      continue  # sorgente in un'altra stage, non un file del repo
                  resto = re.sub(r"--\S+\s*", "", resto).strip()
                  pezzi = resto.split()
                  if len(pezzi) >= 2:
                      trovate.extend(pezzi[:-1])
              return trovate

          servizi = sorted(pathlib.Path("railway").glob("*/railway.json"))
          if not servizi:
              sys.exit("::error::nessun railway.json trovato: gate che passerebbe sempre")

          problemi = []
          for config in servizi:
              dati = json.loads(config.read_text()).get("build", {})
              patterns = dati.get("watchPatterns", [])
              if not patterns:
                  problemi.append(f"{config.parent.name}: nessun watchPattern")
                  continue

              # Validati TUTTI e subito, non durante il confronto: `any()` va in corto
              # circuito sul primo pattern che corrisponde, quindi un `!docker/**`
              # messo dopo un `**` non veniva mai nemmeno compilato e il rifiuto non
              # scattava. Il gate approvava esattamente il caso che dice di rifiutare.
              for pattern in patterns:
                  regex(pattern)

              percorso_dockerfile = dati.get("dockerfilePath")
              if percorso_dockerfile:
                  dockerfile, contesto = pathlib.Path(percorso_dockerfile), pathlib.Path(".")
              else:
                  radice = patterns[0].split("*")[0].rstrip("/")
                  dockerfile, contesto = pathlib.Path(radice) / "Dockerfile", pathlib.Path(radice)

              if not dockerfile.exists():
                  problemi.append(f"{config.parent.name}: {dockerfile} non esiste")
                  continue

              for sorgente in sorgenti_copy(dockerfile.read_text()):
                  percorso = sorgente if str(contesto) == "." else str(contesto / sorgente)
                  # Se la sorgente e' una directory, cio' che cambia sono i file
                  # DENTRO: si prova un discendente, non la directory stessa.
                  da_provare = percorso + "/__sonda__" if pathlib.Path(percorso).is_dir() else percorso
                  if not coperto(da_provare, patterns):
                      problemi.append(f"{config.parent.name}: COPY {sorgente} -> {da_provare} "
                                      f"non coperto da {patterns}")
              if not coperto(str(dockerfile), patterns):
                  problemi.append(f"{config.parent.name}: {dockerfile} non e' coperto da {patterns}")

          if problemi:
              print("::error::un COPY non sorvegliato significa che Railway NON ricostruisce "
                    "il servizio quando quel file cambia: la modifica entra in main verde e la "
                    "produzione resta indietro.")
              for problema in problemi:
                  print(f"::error::{problema}")
              sys.exit(1)
          print(f"watchPatterns coerenti con i COPY per {len(servizi)} servizi")
          PY

      # Checkov copre i Dockerfile (CKV_DOCKER_7 sul pinning) e i workflow, ma NON
      # docker/docker-compose.yml: `docker_compose` non e' un framework che Checkov
      # abbia — l'elenco valido va da `ansible` a `terraform` e non lo contiene — e
      # scripts/check-image-users.sh legge solo `USER`, mai `FROM`. La regola "ogni
      # immagine pinnata, mai :latest" era quindi applicata ai Dockerfile e a NIENTE
      # per il compose.
      - name: le immagini del compose sono pinnate e non divergono dai Dockerfile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def riferimento(grezzo: str) -> tuple[str, str]:
              """(nome, tag) da un riferimento immagine. Solleva se non e' pinnato.

              Le virgolette si tolgono: `image: 'prom/prometheus:latest'` e' YAML
              legale — ed e' cio' che un autoformattatore produce — e la versione
              precedente di questo gate leggeva il tag come `latest'`, che non e'
              uguale a `latest`, quindi lo APPROVAVA. Il tag si separa dall'ultimo
              segmento del path e non dal primo `:` incontrato, altrimenti la porta
              di un registry (`registry.local:5000/prom/prometheus`) veniva scambiata
              per un tag e un'immagine senza versione passava per pinnata.
              """
              pulito = grezzo.strip().strip("\"'")
              if "@" in pulito:  # digest: pinnato per definizione, e piu' forte di un tag
                  return pulito.split("@", 1)[0], pulito.split("@", 1)[1]
              testa, _, coda = pulito.rpartition("/")
              nome_corto, sep, tag = coda.partition(":")
              if not sep or not tag:
                  raise ValueError(f"{pulito} non e' pinnata a una versione")
              if tag == "latest":
                  raise ValueError(f"{pulito} usa il tag mobile :latest")
              return (f"{testa}/{nome_corto}" if testa else nome_corto), tag

          compose = pathlib.Path("docker/docker-compose.yml").read_text()
          grezze = re.findall(r"^\s*image:\s*(\S+)", compose, re.MULTILINE)
          if not grezze:
              sys.exit("::error::nessuna `image:` nel compose: gate che passerebbe sempre")

          da_compose = {}
          for grezzo in grezze:
              try:
                  nome, tag = riferimento(grezzo)
              except ValueError as errore:
                  sys.exit(f"::error::{errore}")
              da_compose[nome] = tag

          dockerfiles = sorted(pathlib.Path("railway").glob("*/Dockerfile"))
          if not dockerfiles:
              sys.exit("::error::nessun Dockerfile sotto railway/: gate che passerebbe sempre")

          non_confrontati = []
          for dockerfile in dockerfiles:
              basi = re.findall(r"^FROM\s+(?:--\S+\s+)*(\S+)", dockerfile.read_text(), re.MULTILINE)
              if not basi:
                  sys.exit(f"::error::{dockerfile} non ha un FROM leggibile")
              # L'ULTIMO FROM e' l'immagine finale: su un multi-stage il primo e' il
              # builder, e confrontare quello direbbe la cosa sbagliata.
              try:
                  nome, tag = riferimento(basi[-1])
              except ValueError as errore:
                  sys.exit(f"::error::{dockerfile}: {errore}")
              if nome not in da_compose:
                  non_confrontati.append(f"{dockerfile} usa {nome}, che il compose non nomina")
              elif da_compose[nome] != tag:
                  sys.exit(f"::error::{nome}: il compose dice {da_compose[nome]}, {dockerfile} "
                           f"dice {tag}. Locale e produzione divergono.")

          # Senza questo, rinominare o togliere un'immagine dal compose rendeva il
          # confronto un no-op silenzioso: il gate passava senza aver confrontato
          # niente. Vale la stessa regola del pavimento sul gate di mutation.
          if non_confrontati:
              print("::error::un'immagine di produzione non confrontata con il compose significa "
                    "che locale e produzione possono divergere senza che nulla lo veda.")
              for problema in non_confrontati:
                  print(f"::error::{problema}")
              sys.exit(1)

          print(f"immagini pinnate e allineate: {sorted(da_compose)}")
          PY
      # Prometheus non ha autenticazione CONFIGURATA (ne supporta — vedi SECURITY.md —
      # semplicemente non la accendiamo) ed e' raggiungibile da tutta la rete privata
      # del progetto. In quelle condizioni una sola parola nel CMD cambia il confine:
      # --web.enable-admin-api sblocca /api/v1/admin/tsdb/delete_series, cioe'
      # cancellazione di serie e snapshot da parte di chiunque, senza credenziali;
      # --web.enable-lifecycle sblocca /-/quit, cioe' lo spegnimento remoto del
      # componente che non ha ridondanza; i due receiver scrivono DIRETTAMENTE nel
      # TSDB scavalcando il Collector, e con lui l'allow-list che tiene fuori
      # user.email. Verificato sul binario v3.13.2: tutti e quattro sono `false` di
      # default, quindi oggi la postura e' giusta per OMISSIONE. Questo la rende una
      # decisione.
      #
      # La tentazione e' concreta e ha gia' un movente: il modo documentato per
      # recuperare spazio nel TSDB e' proprio l'admin API, e il volume si e' riempito
      # due volte. Il momento in cui qualcuno la accendera' e' un'emergenza, che e'
      # esattamente quando nessuno rilegge il confine di sicurezza.
      # hadolint sui sei Dockerfile. Checkov ne copre alcune regole, hadolint
      # altre: sono liste diverse, non la stessa lista due volte. Aggiunto dopo aver
      # controllato che trovi qualcosa di VERO — cinque file puliti e un solo
      # rilievo, gia' deciso e documentato — perche' un gate che produce solo rumore
      # viene ignorato, e questo repo ha gia' pagato per gate ignorati.
      #
      # DL3025 e' derogato con la ragione accanto, non silenziato globalmente: il
      # HEALTHCHECK di status-api e' in forma shell APPOSTA, perche' $STATUS_API_TOKEN
      # deve espandersi al momento del controllo e non a quello della build.
      - name: hadolint sui Dockerfile
        run: |
          set -euo pipefail
          for dockerfile in railway/*/Dockerfile services/public-status-api/Dockerfile; do
            echo "== ${dockerfile}"
            docker run --rm -i hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c \
              hadolint --no-color --ignore DL3025 - < "${dockerfile}"
          done

      - name: prometheus non accende endpoint che non sa autenticare
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          dockerfile = pathlib.Path("railway/prometheus/Dockerfile")
          testo = dockerfile.read_text()
          cmd = re.search(r"^CMD \[(.*?)\]", testo, re.S | re.MULTILINE)
          if not cmd:
              sys.exit(f"::error::{dockerfile} non ha un CMD leggibile: gate cieco")

          # Il gate blocca i flag `--web.*` che ACCENDONO superficie. Ce n'e' una
          # famiglia che fa l'opposto — restringe — e vietarla significherebbe
          # impedire di chiudere un default aperto del fornitore. `--web.cors.origin`
          # e' il caso: il suo default e' `.*`, che rimanda indietro qualunque
          # `Origin`, e passarlo a `^$` toglie superficie invece di aggiungerla
          # (deciso e misurato il 2026-08-20, vedi DECISIONS.md).
          #
          # L'elenco e' un ALLOW-LIST e va tenuto corto: ogni voce nuova richiede la
          # stessa domanda, "questo flag restringe o allarga?", e la risposta scritta
          # in DECISIONS.md. Tutto cio' che non e' qui dentro resta vietato, compresi
          # i tre `--web.enable-*` che sono la ragione per cui questo gate esiste.
          RESTRINGONO = {"--web.cors.origin"}
          vietati = [f for f in re.findall(r"--[a-z.\-]+", cmd.group(1))
                     if f.startswith("--web.") and f not in RESTRINGONO]
          if vietati:
              print("::error::Prometheus non ha autenticazione configurata ed e' raggiungibile "
                    "da tutta la rete privata: un endpoint --web.* lo espone a chiunque ci stia "
                    "dentro, senza credenziali.")
              for flag in vietati:
                  print(f"::error::{dockerfile}: {flag}")
              print("::error::Se serve davvero, va deciso in DECISIONS.md e questo gate va "
                    "cambiato nello stesso commit — non aggirato durante un incidente.")
              sys.exit(1)
          print(f"nessun endpoint --web.* acceso su prometheus (ammessi solo i flag che restringono: {sorted(RESTRINGONO)})")
          PY

      # CLAUDE.md dice "Never put the `prometheus` exporter in a `logs` pipeline" —
      # il Collector si RIFIUTA di partire. Era scritto in un file che nessun gate
      # legge, e fino alla Fase 1.5 non c'era nemmeno una pipeline logs in cui
      # sbagliare. Adesso c'e'. Un commento non e' un gate.
      # Il commento sopra il build loop dice: "il giorno che si aggiunge
      # un'immagine senza uno step a valle che la nomini, quel fallimento diventa
      # muto". Era vero e non lo sorvegliava nessuno — e la Fase 1.5 e' proprio il
      # giorno in cui si aggiunge un'immagine. Due condizioni, entrambe necessarie:
      # ogni servizio in railway/ deve essere COSTRUITO, e il suo tag deve essere
      # NOMINATO da uno step a valle, altrimenti si costruisce e nessuno lo guarda.
      # I gate qui sotto guardano la FORMA: due leggono le allow-list, il terzo
      # controlla che ogni servizio railway sia costruito. Nessuno esegue niente.
      # Questo ESEGUE le allow-list: fa passare un payload OTLP dal Collector vero a
      # Loki vero e poi interroga Loki. Su questo progetto una config valida ha gia'
      # mentito — `-verify-config` accetta un endpoint che a runtime uccide Loki, e
      # `validate` esce 0 su nomi deprecati che compaiono solo all'avvio.
      #
      # Il test ha i denti, ed e' stato provato: togliendo entrambe le barriere
      # diventa rosso e nomina le chiavi trapelate; togliendone una sola resta verde,
      # che e' la definizione di "due barriere indipendenti" e va riverificata quando
      # una delle due cambia.
      - name: identita' e contenuto non arrivano nel log store (prova eseguita)
        run: bash scripts/prova-privacy-log.sh

      # `deletion_mode: disabled` chiude la sola rotta di Loki che DISTRUGGE senza
      # registrare chi. Che la chiuda davvero, e che chiudendola non si sia spenta
      # anche la ritenzione automatica, sono due cose che nessuna lettura della config
      # decide: la doc del fornitore lega le rotte di cancellazione a
      # `retention_enabled`, quindi la separazione fra le due va misurata. Se la
      # ritenzione si fermasse, i 720h diventerebbero "per sempre" con Loki up=1.
      - name: la rotta di cancellazione e' chiusa e la ritenzione gira ancora (prova eseguita)
        run: bash scripts/prova-ritenzione-loki.sh

      # Il gate "la finestra sta nelle query" e quello sulle tariffe confrontano TESTO
      # fra i file accoppiati. Il testo puo' essere identico in tutti e tre e sbagliato
      # in tutti e tre insieme, perche' il nome vero delle metriche lo decide
      # `translation_strategy` e nessuno dei tre file la esegue. Questo chiede al
      # Collector cosa espone davvero.
      - name: il contratto delle metriche regge fra Collector, status API e pannello
        run: bash scripts/prova-contratto-metriche.sh

      - name: ogni servizio railway e' costruito e scansionato
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          w = yaml.safe_load(open(".github/workflows/images.yml"))
          steps = w["jobs"]["images"]["steps"]
          # Le sole righe che COSTRUISCONO, non il testo intero dello step. La prima
          # versione prendeva tutto il `run:` commenti inclusi, e il commento sopra il
          # loop nomina quattro dei cinque servizi: togliere `grafana` dal `for`
          # lasciava il gate verde perche' la sottostringa sopravviveva nel commento.
          # E' lo stesso difetto corretto un'ora prima nel gate delle allow-list, che
          # cercava `keep_keys` nel testo intero del processor — la seconda volta nello
          # stesso pomeriggio, il che dice che la forma va cercata apposta e non
          # ricordata: se il gate legge prosa insieme al codice, la prosa lo passa.
          righe = [l for s in steps if "run" in s for l in s["run"].split("\n")
                   if ("for servizio in" in l or "costruisci -f" in l) and not l.strip().startswith("#")]
          build = "\n".join(righe)
          # I tag citati da qualunque step a valle: `image-ref:` di trivy-action, o
          # una riga `run:` che nomini il tag.
          # Il lato `citati` aveva lo STESSO buco del lato build, e non l'avevo
          # visto perche' l'avevo appena corretto sull'altra meta': leggeva tutto
          # il `run:` commenti inclusi, quindi un `# TODO: agentic-loki:ci lo
          # scansioneremo` soddisfaceva il gate. E il messaggio promette una
          # scansione, non una sottostringa: quindi si pretende che il tag compaia
          # in un `image-ref:` di uno step trivy-action, cioe' il mestiere che il
          # messaggio nomina.
          citati = set()
          for s in steps:
              if "aquasecurity/trivy-action" in str(s.get("uses", "")):
                  citati |= set(re.findall(r"agentic-([a-z0-9-]+):ci", str(s.get("with", {}))))
              if "run" in s and "costruisci" not in s["run"]:
                  for l in s["run"].split("\n"):
                      if not l.strip().startswith("#"):
                          citati |= set(re.findall(r"agentic-([a-z0-9-]+):ci", l))
          servizi = sorted(d.name for d in pathlib.Path("railway").iterdir()
                           if d.is_dir() and (d / "Dockerfile").exists())
          # Un pavimento. Se una riorganizzazione — un rename di `Dockerfile`, una
          # directory spostata — svuota l'insieme, questo gate direbbe "tutti
          # costruiti" piu' forte di prima. Una prova che riporta "tutto a posto"
          # quando non c'era niente da guardare e' la stessa bugia di un allarme
          # che non puo' scattare.
          if len(servizi) < 5:
              print(f"::error::trovati solo {len(servizi)} servizi sotto railway/ ({servizi}): l'insieme si e' svuotato e questo gate non sta guardando niente")
              sys.exit(1)
          fallimenti = []
          for s in servizi:
              if not re.search(rf"\b{re.escape(s)}\b", build):
                  fallimenti.append(f"railway/{s}/Dockerfile esiste ma nessuno step lo COSTRUISCE: un errore in quel file non lo vede nessun check, e muore al deploy")
              elif s not in citati:
                  fallimenti.append(f"agentic-{s}:ci viene costruito ma nessuno step a valle lo NOMINA: la build fallisce in silenzio se qualcuno toglie `set -e`, e non viene scansionato")
          if fallimenti:
              for f in fallimenti:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"ok: {len(servizi)} servizi railway, tutti costruiti e nominati a valle: {servizi}")
          PY

      # La regola di casa dice: una sola copia di ogni config, e il compose da' a ogni
      # container un alias di rete uguale al suo DNS interno Railway, cosi' gli
      # hostname dentro quelle config sono corretti in ENTRAMBI gli ambienti.
      # Non era vero. Trovato il 2026-08-20 facendo girare lo stack completo in
      # locale: il job di scrape su `grafana.railway.internal` risultava `up = 0` con
      # `no such host`, perche' Grafana, cloudflared e status-api non avevano alias.
      # In produzione avrebbe funzionato — quindi il guasto era LOCALE e silenzioso,
      # cioe' il tipo che fa dire "in locale non si puo' provare" e smettere di
      # provare. Quattro revisioni non l'avevano visto; un dry run si'.
      - name: ogni hostname .railway.internal ha il suo alias nel compose
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          compose = yaml.safe_load(open("docker/docker-compose.yml"))
          servizi = compose["services"]
          alias = set()
          for s in servizi.values():
              rete = (s.get("networks") or {})
              if isinstance(rete, dict):
                  alias |= set((rete.get("default") or {}).get("aliases") or [])
          citati = set()
          for f in pathlib.Path("docker").rglob("*"):
              if f.is_file() and f.suffix in (".yml", ".yaml", ".json"):
                  citati |= set(re.findall(r"[a-z0-9-]+\.railway\.internal", f.read_text()))
          # Un pavimento: se un rename o una riorganizzazione svuota l'insieme, questo
          # gate direbbe "ok" piu' forte di prima. Una prova che riporta "tutto a posto"
          # quando non c'era niente da guardare e' la stessa bugia di un allarme che non
          # puo' scattare.
          if len(citati) < 4:
              print(f"::error::trovati solo {len(citati)} hostname .railway.internal sotto docker/: l'insieme si e' svuotato, il gate non sta guardando niente")
              sys.exit(1)
          fallimenti = []
          for h in sorted(citati):
              nome = h.split(".")[0]
              if nome not in servizi:
                  fallimenti.append(f"{h} e' citato in docker/ ma non esiste nessun servizio `{nome}` nel compose")
              elif h not in alias:
                  fallimenti.append(f"{h} e' citato in docker/ e il servizio `{nome}` NON dichiara quell'alias: in produzione risolve, in locale no, e il dry run misura una cosa diversa da quella che gira")
          if fallimenti:
              for f in fallimenti:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"ok: {len(citati)} hostname citati, tutti con il loro alias: {sorted(citati)}")
          PY

      - name: la pipeline logs non contiene l'exporter prometheus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("docker/otel-collector-config.yaml"))
          logs = (cfg.get("service", {}).get("pipelines", {}) or {}).get("logs")
          if logs is None:
              print("::error::la pipeline `logs` non esiste piu' in docker/otel-collector-config.yaml.")
              print("::error::Se e' stata rimossa apposta, va tolto anche questo gate nello stesso commit.")
              sys.exit(1)
          # `startswith("prometheus")` e non il solo nome esatto piu' le istanze
          # con nome: anche `prometheusremotewrite` supporta il solo segnale
          # metriche e fa rifiutare l'avvio allo stesso modo.
          cattivi = [e for e in logs.get("exporters", []) if e.startswith("prometheus")]
          if cattivi:
              print(f"::error::la pipeline logs esporta verso {cattivi}: l'exporter prometheus supporta il solo segnale metriche.")
              print("::error::Il Collector NON PARTE, quindi si fermano anche le metriche e i tre numeri pubblici si congelano.")
              sys.exit(1)
          print(f"ok: la pipeline logs esporta verso {logs.get('exporters')}")
          PY

      # Stessa famiglia del gate sulle label delle metriche. La forma da
      # sorvegliare non e' l'elenco delle chiavi — quello cambia con il client — ma
      # che sia un ALLOW-LIST: `keep_keys` nel Collector e `ignore_defaults: true`
      # piu' un `drop` finale in Loki. Un delete-list fallisce aperto su ogni
      # attributo che una versione futura inventa, ed e' esattamente la forma che
      # questo progetto ha gia' rifiutato una volta sulle metriche.
      - name: i log passano da due allow-list, non da una delete-list
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          fallimenti = []

          cfg = yaml.safe_load(open("docker/otel-collector-config.yaml"))
          proc = cfg.get("processors", {})
          allow = [n for n in proc if n.startswith("transform/log-allowlist")]
          if not allow:
              fallimenti.append("il Collector non ha piu' un processor transform/log-allowlist")
          else:
              testo = yaml.safe_dump(proc[allow[0]])
              # OGNI statement, non "da qualche parte nel processor". La prima
              # versione di questo controllo cercava keep_keys nel testo intero:
              # trasformando in delete_key il solo statement `log` restava VERDE,
              # perche' la sottostringa sopravviveva nello statement `resource`.
              # Un gate che vede la meta' sbagliata e' un gate che non c'e'.
              # ALMENO UN keep_keys per contesto, e nessuna delete_* da nessuna
              # parte. Non "keep_keys in ogni statement": accanto agli allow-list
              # ci sono i `set(...)` che chiudono cio' che keep_keys non tocca (il
              # body, nome e versione dello scope, il valore di service.name), e
              # pretenderli keep_keys renderebbe il gate rosso sulla config giusta.
              # Nemmeno "keep_keys da qualche parte nel processor": la prima
              # versione faceva cosi' e trasformare in delete_key il solo contesto
              # `log` restava verde, perche' la sottostringa sopravviveva altrove.
              per_contesto = {}
              for st in (proc[allow[0]].get("log_statements") or []):
                  per_contesto.setdefault(st.get("context"), []).extend(st.get("statements") or [])
              if not per_contesto:
                  fallimenti.append("transform/log-allowlist non ha nessuno statement")
              for contesto, xs in per_contesto.items():
                  if not any("keep_keys(" in x for x in xs):
                      fallimenti.append(f"il contesto {contesto} non ha nessun keep_keys: e' diventata una delete-list")
                  for x in xs:
                      if "delete_key(" in x or "delete_matching_keys(" in x:
                          fallimenti.append(f"il contesto {contesto} usa una funzione delete_*: un allow-list non cancella, tiene ({x})")
              pipeline = cfg["service"]["pipelines"].get("logs", {})
              if allow[0] not in pipeline.get("processors", []):
                  fallimenti.append(f"{allow[0]} esiste ma NON e' nella pipeline logs: e' come non averlo")

              # DUE statement, non uno: keep_keys sul solo contesto `log` lascia
              # passare le resource attribute. Misurato il 2026-08-20 che l'identita'
              # NON e' nella resource su questo client — ma OTEL_RESOURCE_ATTRIBUTES
              # e' un punto d'iniezione documentato, e il set del client non e' un
              # contratto: la barriera vale sul futuro, non sulla misura di ieri.
              # TRE contesti, non due. Il piano ne prevedeva due; con quelli, gli
              # attributi di SCOPE attraversavano il Collector intatti e a fermarli
              # restava la sola allow-list di Loki. Misurato il 2026-08-20 con
              # scripts/prova-privacy-log.sh: togliendo la barriera di Loki,
              # `scope.secret` arrivava interrogabile. Due barriere che condividono
              # un punto cieco sono una barriera, ed e' un errore gia' corretto una
              # volta in spec (#119).
              contesti = {st.get("context") for st in (proc[allow[0]].get("log_statements") or [])}
              if contesti != {"resource", "scope", "log"}:
                  fallimenti.append(f"transform/log-allowlist copre {sorted(contesti)}: servono resource, scope E log — cio' che manca passa la barriera #1 intatto")

              # L'identita' che il fornitore dichiara "always included" non deve MAI
              # comparire dentro un keep_keys: sarebbe un allow-list che permette
              # esattamente cio' contro cui esiste.
              vietate = {"user.email", "user.id", "user.account_id", "user.account_uuid",
                         "organization.id", "prompt", "response", "error",
                         "tool_parameters", "tool_input", "body"}
              trovate = sorted(v for v in vietate if f'"{v}"' in testo)
              if trovate:
                  fallimenti.append(f"transform/log-allowlist TIENE {trovate}: identita' o contenuto di sessione dentro un allow-list")

          loki = yaml.safe_load(open("docker/loki.yaml"))
          limits = loki.get("limits_config", {}) or {}
          otlp = limits.get("otlp_config", {}) or {}
          if limits.get("allow_structured_metadata") is not True:
              fallimenti.append("loki.yaml non ha allow_structured_metadata: true: Loki rifiuta il payload")
          res = otlp.get("resource_attributes", {}) or {}
          if res.get("ignore_defaults") is not True:
              fallimenti.append("loki.yaml non ha ignore_defaults: true: le resource attribute finiscono nell'INDICE")

          # IL CONTROLLO CHE -verify-config NON FA. `ignore_defaults` toglie le
          # resource attribute dall'indice ma NON le scarta: il fallback di Loki e'
          # `structured_metadata`. Senza un `drop` catch-all in FONDO a ogni sezione,
          # cio' che nessuna regola nomina resta memorizzato e interrogabile.
          def chiude(voci, dove):
              voci = voci or []
              if not voci or voci[-1].get("action") != "drop" or voci[-1].get("regex") != ".*":
                  fallimenti.append(f"{dove} non finisce con un drop catch-all: cio' che nessuna regola nomina resta come structured metadata, interrogabile")
          chiude(res.get("attributes_config"), "resource_attributes.attributes_config")
          chiude(otlp.get("scope_attributes"), "scope_attributes")
          chiude(otlp.get("log_attributes"), "log_attributes")

          # L'ACCOPPIAMENTO. Le stesse chiavi vivono in due file: il `keep_keys` del
          # Collector e la lista `structured_metadata` di Loki. Nessuno le confrontava.
          # La direzione che fa male e' silenziosa: una chiave aggiunta al solo
          # Collector la scarta il catch-all di Loki, verde ovunque, e il dato non c'e'.
          # E' la stessa famiglia di "Metric names live in three places".
          import re
          st_log = [x for st in (proc.get(allow[0], {}).get("log_statements") or [])
                    if st.get("context") == "log" for x in (st.get("statements") or [])
                    if x.startswith("keep_keys(")]
          if len(st_log) != 1:
              fallimenti.append(f"mi aspetto ESATTAMENTE un keep_keys sul contesto log, ne ho trovati {len(st_log)}")
          else:
              coll = set(re.findall(r'"([^"]+)"', st_log[0].split("[", 1)[1]))
              sm = set()
              for voce in (otlp.get("log_attributes") or []):
                  if voce.get("action") == "structured_metadata":
                      sm |= set(voce.get("attributes") or [])
              if coll != sm:
                  solo_coll = sorted(coll - sm)
                  solo_loki = sorted(sm - coll)
                  if solo_coll:
                      fallimenti.append(f"chiavi tenute dal Collector e NON da loki.yaml: {solo_coll} — il catch-all di Loki le scarta in silenzio, verde ovunque e il dato non c'e'")
                  if solo_loki:
                      fallimenti.append(f"chiavi in loki.yaml e NON nel Collector: {solo_loki} — la barriera #1 le ha gia' tolte, quindi la riga in Loki e' morta e mente su cosa arriva")

          # I quattro statement che chiudono cio' che `keep_keys` non tocca. Trovati
          # da un audit il 2026-08-20, ciascuno provato portante togliendolo: il body
          # attraversava entrambe le allow-list, nome e versione dello scope sono
          # una classe a barriera singola (non l'unica: vedi il commento nel file di
          # config), e il VALORE di service.name e' l'unica
          # label di indice e lo sceglieva il mittente.
          tutti = " ".join(x for st in (proc.get(allow[0], {}).get("log_statements") or [])
                           for x in (st.get("statements") or []))
          for frammento, perche in [
              ("set(log.body", "il body del log record non e' governato da nessuna delle due allow-list: senza questo statement la riga arriva verbatim, indicizzata e conservata"),
              ("set(scope.name", "nome e versione dello scope finiscono in structured metadata per costruzione, e otlp_config non ha nessuna chiave per governarli: e' una classe a barriera singola"),
              ("set(scope.version", "nome e versione dello scope finiscono in structured metadata per costruzione, e otlp_config non ha nessuna chiave per governarli: e' una classe a barriera singola"),
              ('set(resource.attributes["service.name"]', "keep_keys filtra le CHIAVI, non i valori: senza questo statement il mittente sceglie il valore dell'unica label di indice, e ogni valore nuovo e' uno stream nuovo"),
          ]:
              if frammento not in tutti:
                  fallimenti.append(f"manca `{frammento}...)` in transform/log-allowlist: {perche}")

          if fallimenti:
              for f in fallimenti:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"ok: due allow-list chiuse, {len(sm)} chiavi allineate fra i due file, e i quattro statement che keep_keys non copre")
          PY

      # Tre pezzi accoppiati che stanno in file diversi e si leggono uno alla volta:
      # loki non ha `healthcheckPath` (decisione chiusa), espone `GET
      # /ingester/shutdown` senza credenziale, e quella rotta fa uscire il processo
      # con codice **0** — misurato con `docker wait`, non dedotto. La doc di Railway
      # dice che `ON_FAILURE` riavvia solo su codice NON zero: con quella policy una
      # GET dalla rete privata ferma il log store e nessuno lo rialza, senza nessun
      # rosso da nessuna parte. `ALWAYS` non chiude la rotta — non e' chiudibile — ma
      # rende il guasto temporaneo invece che definitivo.
      #
      # Questo gate esiste perche' la ragione di quel valore NON e' leggibile dal
      # file: railway.json e' JSON e non ammette commenti, quindi un allineamento
      # "tutti i servizi a ON_FAILURE" sembrerebbe pulizia.
      - name: loki resta a restartPolicyType ALWAYS (esce 0 su una rotta pubblica)
        run: |
          python3 - <<'PY'
          import json, sys
          c = json.load(open("railway/loki/railway.json"))
          # `deploy` UNITO agli override per ambiente, e non e' zelo: lo schema
          # pubblicato ha `environments.<nome>.deploy.restartPolicyType`, e la doc
          # config-as-code fissa la priorita' — l'override per ambiente vince sulla
          # base. Leggendo il solo `deploy` questo gate passava VERDE su un file che
          # in produzione vale ON_FAILURE e per giunta dichiara un healthcheckPath:
          # dimostrato eseguendolo, ed e' il gate nato rotto che questo repository
          # teme piu' di un difetto.
          deploy = dict(c.get("deploy") or {})
          for ambiente, conf in (c.get("environments") or {}).items():
              deploy.update((conf.get("deploy") or {}))
          politica = deploy.get("restartPolicyType")
          if politica != "ALWAYS":
              print(f"::error::railway/loki/railway.json ha restartPolicyType={politica!r}: con qualunque valore diverso da ALWAYS, `GET /ingester/shutdown` (uscita con codice 0, nessuna credenziale) ferma il log store e nessuno lo riavvia — loki non ha healthcheckPath")
              sys.exit(1)
          # La seconda meta' dell'accoppiamento: se un giorno loki prendesse un
          # healthcheckPath, questa riga andrebbe ridiscussa invece di restare vera
          # per inerzia.
          if "healthcheckPath" in deploy:
              print("::error::loki ora dichiara healthcheckPath: la ragione di ALWAYS era proprio la sua assenza — si rilegge la decisione, non si lascia il valore per inerzia")
              sys.exit(1)
          print("ok: loki a ALWAYS, e senza healthcheckPath come la decisione presuppone")
          PY

      - name: il cap di retention e' lo stesso nei tre posti che lo dichiarano
        run: |
          python3 - <<'PY'
          import json, re, sys

          def flag(percorso, chiave):
              # Solo righe non commentate: un `# - --storage...=3GB` lasciato sopra a
              # un flag cambiato verrebbe letto come se fosse quello attivo, e il gate
              # passerebbe su una divergenza vera.
              for riga in open(percorso):
                  if riga.lstrip().startswith("#"):
                      continue
                  trovato = re.search(rf"--storage\.tsdb\.retention\.{chiave}=([^\"'\s\\]+)", riga)
                  if trovato:
                      return trovato.group(1)
              sys.exit(f"::error::{percorso} non dichiara --storage.tsdb.retention.{chiave}")

          prod = {c: flag("railway/prometheus/Dockerfile", c) for c in ("time", "size")}
          locale = {c: flag("docker/docker-compose.yml", c) for c in ("time", "size")}
          if prod != locale:
              sys.exit(f"::error::retention divergente. Produzione: {prod} — locale: {locale}. "
                       "I due file sono due meta' della stessa decisione: si cambiano insieme.")

          # `3GB` per Prometheus e' powers-of-2 ("Based on powers-of-2, so 1KB is 1024B").
          unita = {"KB": 1024, "MB": 1024**2, "GB": 1024**3, "TB": 1024**4}
          numero, simbolo = re.fullmatch(r"([0-9.]+)([KMGT]B)", prod["size"]).groups()
          cap = float(numero) * unita[simbolo]

          dash = json.load(open("docker/grafana/dashboards/claude-code.json"))
          pannello = next(p for p in dash["panels"] if p["title"].startswith("Blocchi TSDB"))
          passi = pannello["fieldConfig"]["defaults"]["thresholds"]["steps"]
          atteso = {"giallo": round(cap * 0.80), "rosso": round(cap * 0.95)}
          trovato = {"giallo": passi[1]["value"], "rosso": passi[2]["value"]}
          if atteso != trovato:
              sys.exit(f"::error::le soglie del pannello non sono ancorate al cap {prod['size']}. "
                       f"Attese {atteso}, trovate {trovato}: il pannello che sorveglia il disco "
                       "andrebbe in rosso su un hub sano, ed e' cosi' che si insegna a ignorarlo.")
          if prod["size"] not in pannello["title"]:
              sys.exit(f"::error::il titolo del pannello non dice {prod['size']}: {pannello['title']!r}")

          print(f"retention allineata nei tre posti: {prod}")
          PY
