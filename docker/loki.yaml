# Loki — Fase 1.5. Una sola copia di questa configurazione, come ogni altra in
# docker/: l'immagine Railway la copia a build time, il compose la monta.
#
# `auth_enabled: false` NON significa "senza autenticazione": in Loki riguarda il
# multi-tenancy (l'header X-Scope-OrgID), non l'accesso. Cio' che tiene chiuso
# questo servizio e' che non ha nessun hostname del Tunnel, esattamente come
# Prometheus. Non si riscriva la ragione falsa: e' gia' stata corretta una volta
# in SECURITY.md.
auth_enabled: false

server:
  http_listen_port: 3100
  # Esplicito, NON perche' il default sia diverso: il default e' "" e ascolta
  # gia' ovunque. Scritto per rendere leggibile che Grafana e il Collector sono
  # altri container. Resta sulla rete privata Railway.
  http_listen_address: 0.0.0.0

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  # Single binary: una sola istanza, nessuna replica. La doc lo richiede
  # esplicitamente per deploymentMode SingleBinary.
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: 2026-08-20
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  # Riga PORTANTE, non una ripetizione del default. La doc `latest` dice che
  # `use_thanos_objstore` vale true per default; su 3.7.6 e' FALSO — il reference
  # della versione dichiara `default = false`, e il binario lo conferma. Senza
  # questa riga Loki userebbe i client legacy e ignorerebbe tutto il blocco
  # `object_store` qui sotto: credenziali giuste, storage sbagliato, nessun errore.
  use_thanos_objstore: true
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h
  object_store:
    s3:
      bucket_name: ${LOKI_R2_BUCKET}
      # Endpoint R2: <ACCOUNT_ID>.r2.cloudflarestorage.com, SENZA schema.
      # ATTENZIONE, misurato: la doc Cloudflare pubblica l'endpoint CON `https://`
      # e `-verify-config` LO ACCETTA senza lamentarsi. Loki muore solo all'avvio
      # ("Endpoint url cannot have fully qualified paths"). E' l'unico errore di
      # questo file che il gate NON vede: chi incolla dal dashboard passa verde e
      # la produzione non parte.
      endpoint: ${LOKI_R2_ENDPOINT}
      access_key_id: ${LOKI_R2_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_R2_SECRET_ACCESS_KEY}
      # R2 vuole region `auto`. Dichiararla evita anche la GetBucketLocation che
      # il client farebbe da solo con region vuota.
      region: auto
      # Il DEFAULT e' `auto`, NON `path`: questa riga e' una scelta, non una
      # ripetizione del default. Ammessi: auto | path | virtual-hosted.
      bucket_lookup_type: path
      # insecure resta FALSE: l'endpoint R2 e' HTTPS. Metterlo a true qui
      # significherebbe spedire le credenziali in chiaro verso internet.
      insecure: false

limits_config:
  # I TETTI D'INGESTIONE, dichiarati e non ereditati. I default del fornitore sono
  # `ingestion_rate_mb: 4` e `ingestion_burst_size_mb: 6`: quattro MB al secondo
  # sostenuti sono ~345 GB al giorno spediti verso R2, e R2 si paga. Il tetto di
  # spesa del workspace Railway non limita una bolletta Cloudflare, e finora nessuna
  # riga di questo progetto poneva la domanda — non era un parametro sbagliato, era
  # un parametro mai posto.
  #
  # I numeri: una sessione di Claude Code misurata il 2026-08-20 produce ~90 log
  # record, dell'ordine dei 100 KB in tutto. 1 MB/s sostenuto e' quattro ordini di
  # grandezza sopra l'uso reale, quindi non e' un limite operativo: e' il punto oltre
  # il quale rifiutare e' meglio che pagare. Vanno rivisti se un secondo produttore
  # entra in scena.
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  # `service.name` e' l'unica label di indice E il Collector ne fissa il valore, quindi
  # gli stream leciti sono uno. Il default e' 5000: non illimitato, ma 5000 stream
  # spazzatura nell'indice e altrettanti flush verso R2.
  #
  # Era 10, per poche ore il 2026-08-20, e 10 era SBAGLIATO nella direzione peggiore.
  # Misurato: nove push con label diverse esauriscono il budget, e da quel momento la
  # risposta e' "maximum active stream limit exceeded WHEN TRYING TO CREATE STREAM".
  # Lo stream gia' aperto continua a ricevere, quindi non si nota — ma al primo
  # riavvio di Loki, o dopo `chunk_idle_period`, il Collector non puo' piu' ricreare
  # il suo, e la telemetria smette di entrare con Loki `up=1`, container healthy e
  # tutti i gate verdi. E' la forma esatta del guasto silenzioso che questo progetto
  # esiste per non avere. Un tetto che il produttore legittimo puo' sbattere e' una
  # negazione di servizio con il nostro nome sopra.
  #
  # 200: due ordini di grandezza sotto il default, ancora un tetto vero contro la
  # cardinalita' (l'unico modo di creare stream e' l'API di push nativa, vedi
  # SECURITY.md), e fuori portata per il produttore vero, che ne usa uno.
  # Il segnale che dice se ci si sta avvicinando esiste ed e' gia' raccolto:
  # `loki_ingester_memory_streams` e `loki_discarded_samples_total{reason=~".*stream.*"}`
  # arrivano in Prometheus dal job `loki`.
  max_global_streams_per_user: 200

  # Senza questa riga Loki RIFIUTA il payload: la structured metadata e' il
  # meccanismo su cui poggia tutto il blocco qui sotto.
  allow_structured_metadata: true

  # ALLOW-LIST #2 — la seconda barriera, e non e' ridondanza: la prima sta nel
  # Collector (`transform/log-allowlist`), questa vale su qualunque cosa arrivi
  # all'endpoint OTLP di Loki, Collector compreso.
  #
  # `ignore_defaults: true` toglie le resource attribute dall'INDICE, NON le
  # scarta: il fallback di Loki per un attributo che nessuna regola nomina e'
  # `structured_metadata`. Misurato: con il solo `index_label` qui sotto, un
  # payload con `user.email` fra le resource attribute produceva
  #   indice:  ["service_name"]                       <- sembrava a posto
  #   query:   {service_name="claude-code"} | user_email="victim@example.com"
  #            -> 1 risultato, con organization_id accanto
  # L'indirizzo non era una label, ma era memorizzato e interrogabile. Serve il
  # catch-all `drop` in FONDO a tutte e tre le sezioni.
  #
  # `attributes:` e non `regex:`: `regex` e' un regex Prometheus ancorato dove il
  # punto e' un metacarattere — misurato, `regex: service.name` matcha anche
  # `serviceXname`.
  #
  # L'ORDINE E' LETALE: first-match-wins, il catch-all va SEMPRE IN FONDO — ma i
  # due modi di sbagliarlo NON si somigliano, ed e' misurato. Catch-all in cima a
  # `resource_attributes`: lo stream resta senza label e Loki risponde 400, rumoroso.
  # Catch-all in cima a `log_attributes`: il push passa 204, `-verify-config` dice
  # `config is valid`, e sparisce in silenzio tutta la structured metadata — cioe'
  # la risposta a "quale tool call e' fallita", con tutto verde. Il secondo caso lo
  # vedono DUE controlli, entrambi in CI: il gate "i log passano da due allow-list",
  # che pretende il drop catch-all in fondo a tutte e tre le sezioni, e
  # scripts/prova-privacy-log.sh, che fallisce sull'asserzione (c) perche' la
  # structured metadata utile sparisce. Il gate legge la forma, la prova la misura:
  # e' la ridondanza giusta, perche' un allow-list rotto nel verso "scarta tutto"
  # supera (a) e (b) e sembra un successo.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
        - action: drop
          regex: .*
    # Anche queste cadrebbero in structured metadata per default.
    scope_attributes:
      - action: drop
        regex: .*
    log_attributes:
      # Le chiavi MISURATE il 2026-08-20 che rispondono alla domanda della Fase
      # 1.5 — "quale tool call e' fallita in quella sessione" — e nient'altro.
      # Structured metadata e NON label: `session.id` come label creerebbe uno
      # stream per sessione, il primo anti-pattern di cardinalita' che la doc
      # nomina.
      #
      # NON sono qui, deliberatamente: `user.email`, `user.id`, `user.account_id`,
      # `user.account_uuid`, `organization.id` (identita', che il fornitore manda
      # SEMPRE) e `prompt`, `response`, `error`, `tool_parameters`, `tool_input`,
      # `body`, `command_name`, `server_name` (contenuto, redatto per default ma
      # riacceso da una variabile d'ambiente: un default non e' un controllo).
      - action: structured_metadata
        attributes:
          - event.name
          - event.sequence
          - session.id
          - prompt.id
          - tool_name
          - tool_use_id
          - success
          - error_type
          - duration_ms
          - decision
          - source
          - model
          - query_source
          - status
          - status_code
          - attempt
          - error_code
          - error_name
          - transport_type
          - server_scope
          - prompt_length
          - response_length
      # Ultima riga di un allow-list, non una delete-list: vale su ogni chiave che
      # una versione futura del client inventa. Ammesse: drop | index_label |
      # structured_metadata. Per ogni voce va indicato ESATTAMENTE uno fra
      # `attributes` e `regex` — entrambi o nessuno fanno rifiutare la config.
      - action: drop
        regex: .*
  retention_period: 720h

  # Loki NON ha autenticazione, e i due buchi che ne derivano non pesano uguale —
  # ma NON nel modo scritto qui fino al 2026-08-21.
  # `GET /ingester/shutdown` spegne il processo e non e' disattivabile da
  # configurazione. La riga diceva "Railway riavvia, quindi e' un disservizio":
  # FALSO, e misurato subito dopo averlo scritto. Loki esce con codice **0**
  # (`docker wait` su container vero), e la doc di Railway dice che `On Failure`
  # riavvia solo su codice NON zero. Con la policy di railway/loki/railway.json quel
  # GET ferma il log store e nessuno lo rialza: nessun healthcheck su questo
  # servizio, e `up{job="loki"}` non ha ancora una regola d'allarme.
  # `POST /loki/api/v1/delete` invece DISTRUGGE, senza registrare chi, ed e' l'unico
  # dei due che si chiude da qui. Questa riga lo chiude: la rotta risponde 403
  # (misurato: rispondeva 204, e la richiesta veniva accettata e registrata).
  #
  # Ammessi: disabled | filter-only | filter-and-delete. Il default e'
  # `filter-and-delete`, cioe' aperto.
  #
  # NON spegne la ritenzione automatica, che resta guidata da
  # `compactor.retention_enabled` — ma le due cose si toccano davvero (la doc dice
  # che le rotte di cancellazione esistono solo con `retention_enabled: true`),
  # quindi la separazione e' PROVATA e non letta: scripts/prova-ritenzione-loki.sh
  # pretende un giro di ritenzione riuscito dopo il cambiamento. Se la ritenzione si
  # fermasse, i 720h qui sopra diventerebbero "per sempre" e il conto R2 crescerebbe
  # in silenzio, con Loki `up=1` e ogni gate verde.
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  # Senza questa chiave Loki RIFIUTA di partire quando retention_enabled e' true.
  # Ma il VALORE non e' validato: `delete_request_store: bananas` passa
  # -verify-config. Che `s3` sia giusto lo si verifica a runtime.
  delete_request_store: s3
  retention_enabled: true
