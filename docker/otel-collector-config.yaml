# OTel Collector — ingest contract for the hub.
#
# Auth: the `otlp` receiver has no authentication of its own, and Task 5 puts a
# public Cloudflare Tunnel hostname in front of it. An unauthenticated ingest
# endpoint behind a public tunnel hostname is the CVE-2026-28798 pattern
# (ZimaOS). `bearertokenauth` closes it: only requests carrying the configured
# token reach any pipeline.
extensions:
  bearertokenauth:
    scheme: "Bearer"
    tokens:
      - "${env:OTLP_INGEST_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Labels are an ALLOW-LIST, not a deny-list, and that is the point.
  #
  # The first version of this deleted the five identity attributes Claude Code was
  # measured sending (user.email — carrying a real address — user.id,
  # user.account_id, user.account_uuid, organization.id). That works only until the
  # next release adds a sixth: telemetry here is beta, its attribute set is not a
  # contract, and a deny-list at a privacy boundary fails open on everything it has
  # not heard of. This keeps what is known-safe and drops the rest, so an unknown
  # attribute is a missing label rather than a leak.
  #
  # Cost of the trade: a new producer (Phase 2) whose labels are not listed here will
  # see them silently disappear. That is the intended direction of failure — add the
  # keys deliberately, after looking at what the producer actually sends.
  #
  # `session.id` is on the list, and deleting it is a mistake that looks like a fix:
  # the counters are cumulative per process, so without it two concurrent sessions
  # write the same series and the last export wins. Measured 2026-07-28 — two
  # parallel sessions produced one series reading `1`, not `2`. It is a random
  # per-run UUID, it never leaves the hub, and the public endpoint returns only sums.
  transform/label-allowlist:
    metric_statements:
      - context: datapoint
        statements:
          # `datapoint.attributes`, not `attributes`: the Collector rewrites the bare
          # form to this and logs "please rewrite them accordingly" — an implicit
          # correction is a thing that changes silently on an upgrade.
          - keep_keys(datapoint.attributes, ["model", "type", "query_source", "start_type", "terminal_type", "session.id"])

  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Default is 5m: a counter stops being exposed 5 minutes after its last
    # update, so every series would vanish from /metrics whenever Marco stops
    # working — and "cost today" would read 0 for most of the day. 25h keeps a
    # full day of counters alive on the exporter side.
    metric_expiration: 25h
    # UnderscoreEscapingWithoutSuffixes: Prometheus metric names come out exactly
    # as `claude_code_session_count` / `claude_code_token_usage` /
    # `claude_code_cost_usage`. The default strategy appends type AND unit
    # suffixes, which would make them `claude_code_token_usage_tokens_total` and
    # `claude_code_cost_usage_USD_total` — names that depend on Claude Code's unit
    # metadata rather than on anything we control. Predictable beats conventional
    # here, since the real names can't be observed until the hub is live.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    # resource_to_telemetry_conversion stays OFF (the default). It is defence in
    # depth, not the primary control: identity (user.email with a real address,
    # user.id, organization.id, ...) arrives as *data point* attributes — measured
    # against v2.1.220, see docs/CLAUDE_CODE_TELEMETRY.md — so what actually drops
    # it is the allow-list above. Keeping the conversion off means resource
    # attributes never become labels either. Per-datapoint attributes on the list
    # (`type`, `model`) are still labels — those are what the dashboard groups by.

service:
  extensions: [bearertokenauth]
  pipelines:
    # Metrics only. The `prometheus` exporter supports the metrics signal only
    # (upstream README: "metrics [beta]"), so a `logs` pipeline pointing at it
    # fails Collector startup. Claude Code's log/event stream has no consumer in
    # Phase 1 — see docs/CLAUDE_CODE_TELEMETRY.md, which leaves OTEL_LOGS_EXPORTER
    # unset for exactly this reason.
    metrics:
      receivers: [otlp]
      # Order matters: strip before batching, so nothing identifying is ever held
      # in a batch buffer or handed to an exporter.
      processors: [transform/label-allowlist, batch]
      exporters: [prometheus]
