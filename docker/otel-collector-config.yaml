# OTel Collector — ingest contract for the hub.
#
# Auth: the `otlp` receiver has no authentication of its own, and Task 5 puts a
# public Cloudflare Tunnel hostname in front of it. An unauthenticated ingest
# endpoint behind a public tunnel hostname is the CVE-2026-28798 pattern
# (ZimaOS). `bearertokenauth` closes it: only requests carrying the configured
# token reach any pipeline.
extensions:
  bearertokenauth:
    scheme: "Bearer"
    tokens:
      - "${env:OTLP_INGEST_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth
        # Un default esiste gia' (confighttp: "Default: 20971520 (20MiB)"), quindi
        # questo non chiude un buco aperto — lo restringe di tre ordini di grandezza
        # rispetto agli export reali di Claude Code, che sono qualche KB. Scritto
        # esplicitamente perche' il punto non e' il valore ma il non dipendere da un
        # default: quello del body size e' gia' cambiato una volta a monte, e
        # `memory_limiter` non aiuta qui — agisce al confine del CONSUMATORE, cioe'
        # dopo che il corpo e' stato letto, decompresso e deserializzato.
        max_request_body_size: 4194304

processors:
  # Primo della pipeline, come prescrive la documentazione OpenTelemetry: senza,
  # un picco di dati in ingresso non incontra nessun freno e il Collector muore
  # per OOM. Il container riparte, ma nel frattempo la telemetria si ferma e i
  # tre numeri pubblici si congelano — lo stesso tipo di guasto che il 13/08/2026
  # è rimasto invisibile per ore su Prometheus, cioè un servizio che smette di
  # funzionare senza che niente lo dica.
  #
  # 256 MiB su un container che oggi ne usa 45: il limite non è tarato sul
  # consumo attuale ma sul punto oltre il quale rifiutare dati è meglio che
  # morire. Quando il soft limit (limit_mib - spike_limit_mib = 192 MiB) viene
  # superato, il processor risponde errori ai receiver e Claude Code ritenta —
  # perdere un export è recuperabile, un OOM no.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Labels are an ALLOW-LIST, not a deny-list, and that is the point.
  #
  # The first version of this deleted the five identity attributes Claude Code was
  # measured sending (user.email — carrying a real address — user.id,
  # user.account_id, user.account_uuid, organization.id). That works only until the
  # next release adds a sixth: telemetry here is beta, its attribute set is not a
  # contract, and a deny-list at a privacy boundary fails open on everything it has
  # not heard of. This keeps what is known-safe and drops the rest, so an unknown
  # attribute is a missing label rather than a leak.
  #
  # Cost of the trade: a new producer (Phase 2) whose labels are not listed here will
  # see them silently disappear. That is the intended direction of failure — add the
  # keys deliberately, after looking at what the producer actually sends.
  #
  # `session.id` is on the list, and deleting it is a mistake that looks like a fix:
  # the counters are cumulative per process, so without it two concurrent sessions
  # write the same series and the last export wins. Measured 2026-07-28 — two
  # parallel sessions produced one series reading `1`, not `2`. It is a random
  # per-run UUID, it never leaves the hub, and the public endpoint returns only sums.
  transform/label-allowlist:
    metric_statements:
      - context: datapoint
        statements:
          # `datapoint.attributes`, not `attributes`: the Collector rewrites the bare
          # form to this and logs "please rewrite them accordingly" — an implicit
          # correction is a thing that changes silently on an upgrade.
          - keep_keys(datapoint.attributes, ["model", "type", "query_source", "start_type", "terminal_type", "session.id"])

  # I nomi delle ETICHETTE hanno un allow-list; i nomi delle METRICHE non ne avevano
  # nessuno, e quella era la meta' scoperta. Chi tiene OTLP_INGEST_TOKEN poteva
  # scrivere `claude_code.token.usage` con i valori che voleva: le tre cifre pubbliche
  # sul sito diventano le sue. E non si annullano aspettando — le query usano
  # `max_over_time(...[25h])` su un contatore, quindi un picco iniettato resta
  # appiccicato per venticinque ore.
  #
  # Il filter processor SCARTA quando la condizione e' vera ("If any condition is met,
  # the telemetry is dropped"), quindi un allow-list si scrive negato: si scarta tutto
  # cio' che non e' uno dei tre nomi attesi. Non e' elegante, e' la sintassi che il
  # processor ha.
  #
  # I nomi sono quelli senza suffisso, perche' `translation_strategy` li rende tali —
  # e' lo stesso accoppiamento che il gate in images.yml sorveglia.
  filter/metric-allowlist:
    error_mode: ignore
    metrics:
      metric:
        - 'name != "claude_code.session.count" and name != "claude_code.token.usage" and name != "claude_code.cost.usage"'

  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # The default 5m, deliberately — and this line is half of one change, never a
    # setting on its own. It was 25h for a year for exactly one reason: the status
    # API asked Prometheus an INSTANT query, which can only see series the exporter
    # is exposing right now, so the series had to be kept alive to be counted.
    #
    # The queries now look backwards instead (`max_over_time(...[25h])` in
    # services/public-status-api/main.py and in the Grafana dashboard), and that
    # inverts this setting's job: a series the Collector keeps re-exporting keeps
    # landing in the TSDB, so 25h of expiration under a 25h window makes a session
    # count for ~50h. Measured 2026-08-14 — it OVERCOUNTS. Expiration decides when a
    # session stops counting, the query decides how far back we look; if both are the
    # window, they multiply. 5m is a wide margin over the 15s scrape interval.
    #
    # Raising this back to 25h without shortening the queries brings back the double
    # count. Shortening the queries without raising this loses the history. One change.
    metric_expiration: 5m
    # UnderscoreEscapingWithoutSuffixes: Prometheus metric names come out exactly
    # as `claude_code_session_count` / `claude_code_token_usage` /
    # `claude_code_cost_usage`. The default strategy appends type AND unit
    # suffixes, which would make them `claude_code_token_usage_tokens_total` and
    # `claude_code_cost_usage_USD_total` — names that depend on Claude Code's unit
    # metadata rather than on anything we control. Predictable beats conventional
    # here, since the real names can't be observed until the hub is live.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    # resource_to_telemetry_conversion stays OFF (the default). It is defence in
    # depth, not the primary control: identity (user.email with a real address,
    # user.id, organization.id, ...) arrives as *data point* attributes — measured
    # against v2.1.220, see docs/CLAUDE_CODE_TELEMETRY.md — so what actually drops
    # it is the allow-list above. Keeping the conversion off means resource
    # attributes never become labels either. Per-datapoint attributes on the list
    # (`type`, `model`) are still labels — those are what the dashboard groups by.

service:
  # Telemetria interna del Collector. Conta i PAYLOAD IN ARRIVO, non il loro
  # contenuto — ed è l'unica cosa che distingue "un client ha smesso di parlare"
  # da "Marco ha smesso di lavorare". Sui contatori cumulativi quelle due
  # situazioni producono lo stesso identico segnale: i pannelli dei totali
  # guardano indietro 25h con max_over_time e continuano a mostrare lo stesso
  # numero in entrambi i casi, e il pannello dal vivo a rate() smette di avere
  # dati in entrambi i casi. Misurato tre volte fra il 29 e il 30 luglio, ogni
  # volta diagnosticato male prima di avere questa serie.
  #
  # Il meccanismo è cambiato il 14-08-2026 (metric_expiration da 25h a 5m,
  # sopra), l'ambiguità no: nessuna delle due serie di Claude Code sa dire
  # perché ha smesso di crescere. Questa lo sa.
  #
  # host 0.0.0.0 e non il default localhost: Prometheus è un altro container e su
  # localhost non lo raggiungerebbe mai. Resta comunque sulla rete privata di
  # Railway — questa porta non ha, e non deve avere, un hostname del Tunnel.
  #
  # `readers` e non `service::telemetry::metrics::address`: dalla v0.123.0 quella
  # chiave è IGNORATA (qui gira la 0.157.0), quindi scriverla lascerebbe la porta
  # chiusa senza dire niente — un fallimento silenzioso al posto di una misura.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  extensions: [bearertokenauth]
  pipelines:
    # Metrics only. The `prometheus` exporter supports the metrics signal only
    # (upstream README: "metrics [beta]"), so a `logs` pipeline pointing at it
    # fails Collector startup. Claude Code's log/event stream has no consumer in
    # Phase 1 — see docs/CLAUDE_CODE_TELEMETRY.md, which leaves OTEL_LOGS_EXPORTER
    # unset for exactly this reason.
    metrics:
      receivers: [otlp]
      # Order matters: strip before batching, so nothing identifying is ever held
      # in a batch buffer or handed to an exporter.
      # memory_limiter per primo: deve poter rifiutare i dati PRIMA che vengano
      # trasformati e accodati, altrimenti frena a valle del lavoro già fatto.
      # filter subito dopo memory_limiter: cio' che non ci interessa si scarta prima
      # di trasformarlo e prima di accodarlo, come per il freno.
      processors: [memory_limiter, filter/metric-allowlist, transform/label-allowlist, batch]
      exporters: [prometheus]
