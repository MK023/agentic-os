apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    # Stesso hostname in locale e su Railway (vedi gli alias di rete nel compose).
    url: http://loki.railway.internal:3100
    # isDefault resta a Prometheus: i tre numeri pubblici passano da li', e un
    # datasource di default sbagliato fa aprire i pannelli nuovi sulla fonte
    # sbagliata senza dire niente.
    isDefault: false
