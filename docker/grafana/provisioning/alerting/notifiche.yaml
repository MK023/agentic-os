# DOVE FINISCONO GLI ALLARMI.
#
# Il webhook Slack arriva da una variabile di servizio Railway, MAI dal file: un
# incoming webhook e' una credenziale — chi lo ha puo' scrivere nel canale — e
# questo file sta in git.
#
# COSA SUCCEDE FINCHE' LA VARIABILE NON ESISTE, dichiarato invece che scoperto:
# Grafana provisiona lo stesso, le regole VALUTANO e gli allarmi si vedono nella
# sua UI; l'invio a Slack fallisce e resta scritto nei log di Grafana. Cioe' il
# sistema degrada a "gli allarmi ci sono ma nessuno te li porta". E' un'assenza
# dichiarata, non un controllo affermato: si chiude impostando UNA variabile su
# Railway, senza toccare il codice.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-hub
        type: slack
        settings:
          # Interpolazione di ambiente del provisioning di Grafana. Il valore non
          # compare mai qui dentro ne' in nessun commit.
          # NIENTE `title` e `text` qui, e la loro assenza e' una correzione.
          # C'erano, copiati da un esempio, e valevano
          #   {{ template "slack.default.title" . }} / "slack.default.text"
          # che sono nomi di template di ALERTMANAGER, non di Grafana. Un nome
          # sconosciuto rende stringa vuota IN SILENZIO: misurato, tre notifiche
          # consegnate tutte con `attachments[0].text` vuoto — cioe' ogni
          # `description` scritta in regole.yaml, che e' tutto il ragionamento
          # operativo, non raggiungeva mai il destinatario. Arrivava un titolo e
          # basta. Senza quelle righe valgono i default di Grafana, che mettono nel
          # corpo valore, label e annotazioni.
          url: $SLACK_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: slack
    # L'ALBERO INTERO E' UNA SOLA RISORSA: provisionarlo sovrascrive tutte le
    # politiche esistenti. Scritto perche' e' l'unico file di questa cartella che
    # non si somma a cio' che c'era — lo sostituisce.
    # `group_by` NON comprime guasti diversi, e la ragione scritta qui prima diceva
    # il contrario ("riceverne uno per notifica trasformerebbe un guasto in cinque
    # messaggi"). Misurato: raggruppare per `alertname` garantisce l'opposto — due
    # regole diverse non finiscono MAI nello stesso messaggio, e ogni regola qui
    # produce una sola istanza. Un guasto solo (Loki assente) ha prodotto due
    # messaggi separati.
    # Resta cosi' lo stesso, deliberatamente: un messaggio per regola dice QUALE
    # regola, e con cinque regole in tutto il volume non e' il problema. Se un
    # giorno lo diventasse, la leva e' `group_by: [gravita]`, che accorpa davvero.
    group_by: [alertname, gravita]
    # 30s prima di spedire il primo gruppo: e' il tempo che serve a Grafana per
    # raccogliere le istanze della STESSA regola prima di spedirne una.
    group_wait: 30s
    group_interval: 5m
    # 4h e non 1h: un guasto qui si ripara a mano, e ripetere ogni ora una cosa
    # che gia' si sa e' il modo piu' veloce per smettere di leggere le notifiche.
    repeat_interval: 4h
