; Grafana era l'unico servizio senza un file di configurazione: provisioning sì,
; impostazioni no. Ogni valore che conta — cookie, gravatar, telemetria in uscita,
; snapshot, plugin — era il default del fornitore, quindi la postura di sicurezza del
; servizio non stava in git e un bump minore poteva cambiarla con un diff vuoto.
; Il repo ha già una regola per questo: "una sola copia di ogni file di
; configurazione, in docker/". Grafana non la rispettava.
;
; Ogni default citato qui sotto è stato LETTO dalla documentazione Grafana il
; 20-08-2026, non ricordato: sono i valori che il fornitore dichiara, e sono la
; ragione per cui ciascuna riga esiste. Una riga che ripete il default non serve a
; niente e va tolta, non lasciata "per chiarezza".

[security]
; Default documentato: false — "Set to true if you host Grafana behind HTTPS".
; Lo siamo: TLS termina al bordo Cloudflare. Il tunnel consegna HTTP in chiaro al
; container, quindi Grafana da solo non può dedurlo e non marca il cookie di sessione
; come Secure: il browser lo manderebbe in chiaro su una prima richiesta http://,
; PRIMA che il redirect a HTTPS avvenga. Il cookie di Access è già Secure; questo no,
; e proteggono strati diversi.
cookie_secure = true

; Raccomandato dalla pagina di hardening del fornitore. Con Access davanti non ci sono
; login OAuth/SAML da preservare, che è l'unico caso in cui la doc dice di usare `lax`.
; Il costo dichiarato: arrivando da un link esterno la prima navigazione non porta il
; cookie, quindi si vede la schermata di login una volta in più. Accettabile su una
; dashboard personale.
cookie_samesite = strict

; Default documentato: false. Questo repo ha speso lavoro misurato per tenere
; user.email fuori da Prometheus; lasciare che l'indirizzo dell'account venga hashato
; e spedito a gravatar.com sarebbe la stessa informazione consegnata a un terzo da un
; default mai deciso.
disable_gravatar = true

; Raccomandato dalla pagina di hardening: limita le risorse che il browser può
; caricare. Nessun pannello qui carica risorse esterne, quindi il costo è zero.
content_security_policy = true

[auth]
; Prefisso __Host-: il browser accetta il cookie solo se è Secure, con path=/ e senza
; Domain, quindi non può essere sovrascritto da un sottodominio. Ha senso solo insieme
; a cookie_secure = true, sopra.
login_cookie_name = __Host-grafana_session

[auth.anonymous]
; L'accesso anonimo è già disabilitato per default e resta tale: la riga che lo
; impostava a false nel compose ripeteva il default e si leggeva come hardening.
; Questa invece cambia qualcosa: nasconde il numero di versione nella pagina di login,
; che è l'unica cosa che un non autenticato vede.
hide_version = true

[analytics]
; Tre default documentati a `true`: Grafana chiama stats.grafana.org e grafana.com per
; telemetria d'uso e controllo aggiornamenti. Non è una compromissione — è traffico in
; uscita non dichiarato, e un'impronta (versione, sistema, id istanza) da un hub la cui
; postura pubblica è "escono tre numeri".
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[snapshots]
; Default documentato: true. Un click pubblica i dati di un pannello su un server di
; terzi — l'esatto inverso del confine "tre numeri aggregati". La funzione non è usata.
external_enabled = false

[plugins]
; Tutto qui è provisionato da file: il catalogo è superficie d'attacco pura, e un
; plugin di backend installato da un admin esegue codice come uid 472 dentro la rete
; privata.
plugin_admin_enabled = false
; "nessun plugin viene installato a runtime" è ciò che questo commento affermava, e
; era FALSO. Misurato il 2026-08-20 leggendo i log di avvio del container vero:
; Grafana 13.1.4 porta una lista di preinstall COMPILATA NEL BINARIO — non compare in
; defaults.ini, dove `preinstall =` è vuoto — e allo start scarica da grafana.com sei
; app (lokiexplore, metricsdrilldown, exploretraces, pyroscope, ...). Le versioni non
; sono pinnate e `preinstall_auto_update` è true di default, quindi derivano da sole.
; In produzione non c'è volume: succede a OGNI deploy.
; Le firme vengono verificate (signature_status="valid" su tutte), quindi non è una
; falla di esecuzione — è che l'immagine è pinnata per digest e i plugin dentro no,
; che è la regola di casa rotta dall'interno. Qui non serve nessuna di quelle app.
; La chiave è quella del fornitore, letta dal suo defaults.ini nel container:
; "Disables preinstall feature. It has the same effect as setting preinstall to an
; empty list."
preinstall_disabled = true
