# Questo file è l'ambiente LOCALE (prova a mano, CI). La produzione è Railway —
# vedi railway/README.md. I due condividono gli stessi file di configurazione, e
# gli `aliases` qui sotto sono il trucco che lo rende possibile: in locale ogni
# container risponde anche al nome DNS che avrà su Railway
# (`<servizio>.railway.internal`), così prometheus.yml e il datasource di Grafana
# non esistono in due versioni destinate a divergere.
#
# Image tags pinned to a released version, never `:latest` — a mutable tag is a
# supply-chain risk, not just a reproducibility one. Versions below were the
# current stable releases on 2026-07-28 (checked against each registry, not from
# memory); re-check before a much later run.
# Every service: no-new-privileges + cap_drop ALL — none of them needs a Linux
# capability beyond default userspace networking.
#
# LOCALE, non di sistema: Railway non espone nessuna delle due impostazioni, quindi
# in produzione nessuno dei sei servizi le ha. Stanno qui perche' il locale deve
# somigliare alla produzione dove puo', non perche' descrivano cio' che gira.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # --no-autoupdate come nel Dockerfile Railway: l'immagine è pinnata, un
    # connettore che si aggiorna da solo la spinnerebbe in silenzio.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - otel-collector
      - grafana
      - status-api

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0-386@sha256:93e4793719dd55d0d9499328e7b45af219116cc9d1bcb95df5b3a0f8cade831d
    restart: unless-stopped
    networks:
      default:
        aliases: ["otel-collector.railway.internal"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - OTLP_INGEST_TOKEN=${OTLP_INGEST_TOKEN}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    networks:
      default:
        aliases: ["prometheus.railway.internal"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # No Cloudflare Tunnel route to this service, ever (Task 5) — Prometheus's own
    # HTTP API is not configured with authentication (it supports it, we do not turn
    # it on — see SECURITY.md), so its only safe exposure is
    # internal-to-the-compose-network, scraped by Grafana and queried by status-api.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Stessi due limiti della produzione (railway/prometheus/Dockerfile, dove
      # sta il ragionamento sui numeri): con la sola retention a tempo il volume
      # si riempie e la compaction fallisce in silenzio, perché l'ingestione
      # continua dalla RAM. Qui il volume è un volume Docker senza tetto, quindi
      # il limite non serve a salvare il disco — serve a far somigliare il locale
      # alla produzione, che è il motivo per cui questo file esiste.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=3GB

  grafana:
    image: grafana/grafana:13.1.4@sha256:9be3a3ccdb06bcbb127f888b0c4c1d151837443e478887897a63a27d7b348043
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      # GF_AUTH_ANONYMOUS_ENABLED=false era qui e ripeteva il default del fornitore:
      # si leggeva come hardening senza cambiare niente. Le impostazioni vere adesso
      # stanno in docker/grafana/grafana.ini, una copia sola per i due ambienti, come
      # ogni altra configurazione di questo progetto.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    restart: unless-stopped
    networks:
      default:
        aliases: ["loki.railway.internal"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Nessuna rotta del Tunnel verso questo servizio, mai — stessa regola di
    # Prometheus. `auth_enabled: false` in loki.yaml riguarda il multi-tenancy,
    # non l'accesso: qui non c'e' niente da autenticare perche' non c'e' nessuna
    # rotta pubblica.
    environment:
      - LOKI_R2_BUCKET=${LOKI_R2_BUCKET}
      - LOKI_R2_ENDPOINT=${LOKI_R2_ENDPOINT}
      - LOKI_R2_ACCESS_KEY_ID=${LOKI_R2_ACCESS_KEY_ID}
      - LOKI_R2_SECRET_ACCESS_KEY=${LOKI_R2_SECRET_ACCESS_KEY}
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]

  status-api:
    build: ../services/public-status-api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - PROMETHEUS_URL=http://prometheus.railway.internal:9090
      - STATUS_API_TOKEN=${STATUS_API_TOKEN}
      - SENTRY_DSN=${SENTRY_DSN}

volumes:
  prometheus-data:
  grafana-data:
  # Serve anche con lo storage su R2: `tsdb_shipper` tiene indice attivo e cache
  # su disco locale prima di spedirli all'object storage.
  loki-data:
