global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Il tetto sulla cardinalita', e sta QUI perche' e' qui che si paga. Le etichette
    # hanno un allow-list sui NOMI, ma i VALORI sono quelli che manda il client:
    # `session.id` e' un UUID per esecuzione — deliberatamente, altrimenti due sessioni
    # in parallelo collassano in una serie sola — quindi chi tiene OTLP_INGEST_TOKEN
    # puo' creare serie senza limite. `memory_limiter` protegge la RAM del COLLECTOR;
    # niente proteggeva il disco di Prometheus, che si e' gia' riempito due volte.
    #
    # Il compromesso va detto: superata la soglia fallisce l'INTERO scrape, quindi si
    # perdono metriche invece che riempire il volume. E' la scelta rumorosa — `up` va
    # a 0 e il pannello che lo guarda esiste gia' — contro quella silenziosa, che qui
    # sarebbe la storia troncata di cui nessuno si accorge.
    #
    # 5000 e' molto sopra il consumo reale (poche decine di serie attive, con
    # metric_expiration a 5 minuti) e molto sotto il punto in cui il TSDB soffre.
    sample_limit: 5000
    # `label_limit` e `label_value_length_limit` mancavano proprio qui, cioe' sul job
    # che riceve i valori scelti dal client: `keep_keys` nel Collector governa le
    # CHIAVI, non i valori, e `otel_scope_*` piu' `exported_job` non passano nemmeno
    # da quello. Senza un tetto, un valore di label lungo un megabyte entra nel TSDB
    # e ci resta per la retention.
    # 30 e 256 sono margine, non stima: l'allow-list ne produce sei piu' i metadati,
    # e il valore piu' lungo che si e' visto e' un UUID di sessione (36 caratteri).
    # Gli altri due job — `otel-collector-interno` e `prometheus` — non li hanno di
    # proposito: espongono la telemetria dei propri binari, con un insieme di label
    # fissato dal codice e nessun valore che venga da fuori.
    label_limit: 30
    label_value_length_limit: 256
    static_configs:
      # Nome DNS interno di Railway. In locale il compose dà ai container lo stesso
      # alias di rete, così questo file è identico nei due ambienti invece di essere
      # due file che divergono al primo che qualcuno dimentica di allineare.
      - targets: ["otel-collector.railway.internal:8889"]

  # Secondo target, stesso container, porta diversa: la 8889 è l'USCITA della
  # pipeline (le metriche di Claude Code), la 8888 è il Collector che parla di sé.
  # Sono due domande diverse e finora sapevamo rispondere solo alla prima:
  # `claude_code_token_usage` piatto non dice se il dato non arriva o se nessuno
  # sta lavorando, mentre `otelcol_receiver_accepted_metric_points` conta i
  # payload in ingresso e separa i due casi.
  # Serve anche il suo `up`: se il Collector muore, la serie sparisce del tutto e
  # una regola scritta su rate() non scatterebbe mai — non c'è serie da valutare.
  - job_name: otel-collector-interno
    static_configs:
      - targets: ["otel-collector.railway.internal:8888"]

  # Il connettore, per la stessa ragione degli altri due applicata all'unico ingresso.
  # Se cloudflared muore, tutto il sistema e' irraggiungibile dall'esterno mentre
  # dentro continua a funzionare benissimo: nessuna serie di Claude Code cambia,
  # perche' e' il canale di INGRESSO a essere rotto, non la telemetria.
  # `cloudflared_tunnel_ha_connections` e `cloudflared_tunnel_request_errors` sono i
  # nomi utili quando si va a guardare.
  #
  # E li' finisce, che e' meno di quanto questo commento prometteva prima. Nessuna di
  # queste serie viene VALUTATA da qualcosa: il progetto non ha `rule_files`, non ha
  # Alertmanager, e nessun pannello usa quei due nomi. L'unico consumatore e' il
  # riquadro «Target su/giu'» (`expr: up`) del dashboard, che sta in Grafana — cioe'
  # dietro il connettore di cui dovrebbe riportare la morte. Raccolto e non valutato
  # e' una REGISTRAZIONE, buona per capire dopo cosa e' successo; non e' un
  # testimone. I testimoni stanno fuori: `smoke.yml` ogni dieci minuti dall'esterno e
  # `sorveglianza.yml` una volta al giorno.
  #
  # I tetti, per la stessa ragione scritta su otel-collector applicata a un target
  # che per giunta non autentica nessuno: /metrics su :2000 e' aperto a chiunque stia
  # nella rete privata, e lo scrape si fida di qualunque cosa risponda a quel nome.
  # Il numero NON e' misurato — avviare il connettore non fa parte di questo
  # cambiamento — quindi e' scelto per confronto e detto com'e': il 5000 di
  # otel-collector serve un produttore a cardinalita' illimitata (`session.id` e' un
  # UUID per esecuzione), qui il payload viene da un binario pinnato con un insieme
  # fisso di famiglie e nessuna etichetta per-richiesta, cioe' un ordine di grandezza
  # piu' in basso. 1000 lascia margine largo a un aggiornamento del connettore e
  # ferma comunque una fuga; 30 etichette e 256 caratteri sono altrettanto larghi per
  # cio' che il binario emette oggi, e servono contro cio' che emettera' domani.
  # Se un tetto scatta fallisce l'INTERO scrape e `up` va a 0: rumoroso, che e' la
  # stessa scelta gia' motivata sul primo job.
  - job_name: cloudflared
    sample_limit: 1000
    label_limit: 30
    label_value_length_limit: 256
    static_configs:
      - targets: ["cloudflared.railway.internal:2000"]

  # Prometheus che parla di sé, per lo stesso motivo del job qui sopra applicato al
  # servizio che finora era l'unico a non essere osservato da nessuno.
  # Il 13/08/2026 il suo volume si è riempito e la compaction ha fallito una volta al
  # minuto per ore: le tre cifre pubbliche restavano giuste e in movimento, perché il
  # head sta in RAM, quindi da fuori non si vedeva niente. È stato trovato leggendo i
  # log a mano — l'unico modo che c'era, perché `prometheus_tsdb_*` non veniva
  # raccolto da nessuna parte e non esisteva serie su cui scrivere una regola.
  # localhost e non il DNS interno: è lo stesso processo, non serve uscire dal
  # container, e in locale il compose si comporta identico senza alias aggiuntivi.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana. Aggiunto il 2026-08-20 non per completezza ma perche' una frase lo
  # dava gia' per fatto: la decisione chiusa "niente healthcheckPath" (DECISIONS.md,
  # BLOCKERS.md, CLAUDE.md) si regge sull'argomento "tanto uno scrape `up` li guarda
  # tutti, e piu' a lungo di un healthcheck". Per Grafana non era vero da nessuna
  # parte. Delle due strade — riscrivere la decisione o rendere vera la premessa —
  # questa e' quattro righe e lascia il sistema con un testimone in piu'.
  # `/metrics` di Grafana non e' autenticato ma sta sulla rete privata, e non e'
  # dietro il Tunnel: nessuna rotta nuova verso l'esterno.
  #
  # I tetti non sono decorazione. Il `sample_limit` stava solo su otel-collector,
  # con scritto accanto "e' qui che si paga": era vero con tre job. Misurato subito
  # dopo aver aggiunto questo, sullo stack vero: 3186 campioni per scrape da Grafana
  # contro i ~305 del Collector. Un Grafana compromesso poteva servire un /metrics da
  # centomila serie e Prometheus le prendeva tutte. Superata la soglia fallisce
  # l'INTERO scrape, ed e' la scelta rumorosa voluta.
  - job_name: grafana
    sample_limit: 6000
    label_limit: 30
    label_value_length_limit: 128
    static_configs:
      - targets: ["grafana.railway.internal:3000"]
